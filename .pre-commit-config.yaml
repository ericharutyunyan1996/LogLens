# Install once:  .venv\Scripts\pre-commit install
# Run on all files: .venv\Scripts\pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]       # sample logs belong in samples/generated (git-ignored), not in commits
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: .venv/Scripts/ruff.exe format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: .venv/Scripts/ruff.exe check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: .venv/Scripts/mypy.exe
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: .venv/Scripts/python.exe -m pytest -q
        language: system
        types: [python]
        pass_filenames: false
