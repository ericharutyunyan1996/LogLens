# LogLens built-in knowledge base.
#
# Each [[entry]] matches by one of:
#   providers + event_ids  — Windows events (provider names compared case-insensitively, "Microsoft-Windows-" optional)
#   codes                  — hex error codes appearing in the text (NTSTATUS / HRESULT)
#   patterns               — regular expressions searched (case-insensitive) in the line
# noise: "important" (act on it), "normal" (context), "benign" (usually harmless — don't chase it)
# Entries describe well-known, public Windows / .NET / HTTP / SQL behaviour; nothing here is application-specific.

# ---------------------------------------------------------------- application crashes & hangs
[[entry]]
id = "event-app-crash"
providers = ["Application Error"]
event_ids = [1000]
noise = "important"
title = "An application crashed"
explanation = "Windows recorded an unhandled crash. The message names the faulting application, the faulting module (the DLL or EXE where the crash happened) and the exception code."
causes = ["A bug in the application or in the faulting module", "Memory corruption earlier in the process", "A mismatched or recently updated dependency (runtime, driver, plug-in, antivirus hook)"]
steps = ["Look up the exception code shown in the message (LogLens explains it below when present)", "Check '.NET Runtime 1026' and 'Windows Error Reporting 1001' events at the same time", "Read the application's own log just before the crash time", "If it repeats, enable WER LocalDumps to capture a crash dump"]

[[entry]]
id = "event-app-hang"
providers = ["Application Hang"]
event_ids = [1002]
noise = "important"
title = "An application stopped responding and was closed"
explanation = "The program's window stopped processing messages long enough for Windows (or the user) to end it."
causes = ["A deadlock or a long blocking operation on the UI thread", "Waiting for a slow network share, database or disk", "Very high CPU or memory pressure"]
steps = ["Check what the application logged just before the hang", "Look for resource events (2004 low memory, disk 153) around the same time", "Capture a hang dump with Task Manager or ProcDump if it repeats"]

[[entry]]
id = "event-wer"
providers = ["Windows Error Reporting"]
event_ids = [1001]
noise = "normal"
title = "Windows Error Reporting summary"
explanation = "A fault report (bucket) was created for a crash or hang. 'Event Name' tells the kind: APPCRASH, CLR20r3 (.NET), BEX (buffer overrun), AppHangB1 (hang); P1–P10 hold app, version, module and code."
causes = ["Follow-up record of a crash or hang reported by another event"]
steps = ["Use the matching Application Error 1000 / .NET Runtime 1026 event for details", "The report files are listed under C:\\ProgramData\\Microsoft\\Windows\\WER\\ReportArchive"]

[[entry]]
id = "event-dotnet-1026"
providers = [".NET Runtime"]
event_ids = [1026]
noise = "important"
title = "Unhandled .NET exception terminated the process"
explanation = "A .NET application crashed because an exception was not caught. The message contains the exception type, message and stack trace."
causes = ["A code path without exception handling (often on a background thread or timer)", "A configuration, file or network problem surfaced as an exception"]
steps = ["Read the exception type and the top stack frames that belong to your code", "Correlate with the application's own log at the same time", "Handle/log exceptions on background threads (AppDomain.UnhandledException, TaskScheduler.UnobservedTaskException)"]

[[entry]]
id = "event-dotnet-1023"
providers = [".NET Runtime"]
event_ids = [1023, 1025]
noise = "important"
title = ".NET runtime internal / fatal error"
explanation = "The .NET runtime itself failed (execution engine error or fail-fast)."
causes = ["Native memory corruption (unsafe code, P/Invoke, native libraries)", "Environment.FailFast called by the application", "Runtime bug or damaged runtime installation"]
steps = ["Check for native/unsafe components and recent updates", "Repair or update the .NET runtime", "Capture a crash dump for analysis"]

[[entry]]
id = "event-aspnet-1309"
providers = ["ASP.NET"]
event_ids = [1309]
noise = "important"
title = "Unhandled exception in an ASP.NET request"
explanation = "An ASP.NET application threw an exception that was not handled while processing a web request; the message includes URL, exception and stack trace."
causes = ["Application bug for this request path", "Back-end dependency (database, service) failing"]
steps = ["Read the 'Exception information' and 'Request information' parts of the message", "Match the request URL and time with IIS logs (status 500)"]

[[entry]]
id = "event-sidebyside-33"
providers = ["SideBySide"]
event_ids = [33, 35, 59, 63, 80]
noise = "important"
title = "Side-by-side configuration error (missing runtime / manifest)"
explanation = "Windows could not build the activation context for a program — usually a required Visual C++ runtime or assembly version is missing."
causes = ["Visual C++ Redistributable of the required version/architecture not installed", "Broken application manifest"]
steps = ["Install the Visual C++ Redistributable named in the message (x86 and x64 as needed)", "Run 'sxstrace' to trace the activation context if unclear"]

# ---------------------------------------------------------------- services
[[entry]]
id = "event-scm-7000"
providers = ["Service Control Manager"]
event_ids = [7000]
noise = "important"
title = "A service failed to start"
explanation = "The Service Control Manager could not start the service; the message includes the reason (e.g. 'The system cannot find the file specified', 'logon failure')."
causes = ["Service executable missing or path wrong", "Service account password changed or account lacks 'Log on as a service'", "Dependency or configuration error"]
steps = ["Read the error text at the end of the message", "Check the service's image path and log-on account in services.msc", "Look at the service's own log for startup errors"]

[[entry]]
id = "event-scm-7001"
providers = ["Service Control Manager"]
event_ids = [7001, 7003]
noise = "important"
title = "A service could not start because a dependency failed"
explanation = "The service depends on another service or driver that failed to start or does not exist."
causes = ["The dependency service failed (see its own 7000/7009/7023 event)", "A dependency was removed or disabled"]
steps = ["Find the failing dependency named in the message and fix it first"]

[[entry]]
id = "event-scm-7009"
providers = ["Service Control Manager"]
event_ids = [7009, 7011, 7022]
noise = "important"
title = "A service did not respond in time"
explanation = "The service took longer than the allowed time (default 30 s) to start or to answer a control request."
causes = ["Slow startup work (database, network, large initialisation)", "Machine overloaded during boot", "A hang inside the service"]
steps = ["Check the service's log for what it was doing at startup", "Move heavy initialisation off the start path or report progress", "Only if justified, raise ServicesPipeTimeout"]

[[entry]]
id = "event-scm-7023"
providers = ["Service Control Manager"]
event_ids = [7023, 7024]
noise = "important"
title = "A service stopped with an error"
explanation = "The service terminated and reported an error code (7023: Windows error; 7024: service-specific error)."
causes = ["Startup or runtime failure inside the service", "Missing configuration, permissions or dependency"]
steps = ["Look up the error code in the message", "Check the service's own log at that time"]

[[entry]]
id = "event-scm-7031"
providers = ["Service Control Manager"]
event_ids = [7031, 7034]
noise = "important"
title = "A service terminated unexpectedly"
explanation = "The service process ended without being asked to (a crash). 7031 also says which recovery action was taken (e.g. restart)."
causes = ["The service process crashed — usually with an Application Error 1000 / .NET Runtime 1026 at the same time", "Out of memory or killed by another process"]
steps = ["Find the crash event at the same second (Application Error 1000, .NET Runtime 1026)", "Check how often it happens: repeated 7031/7034 = crash loop", "Read the service log just before termination"]

[[entry]]
id = "event-scm-7026"
providers = ["Service Control Manager"]
event_ids = [7026]
noise = "normal"
title = "A boot-start or system-start driver failed to load"
explanation = "One or more drivers listed in the message did not load during startup."
causes = ["Driver for hardware that is no longer present", "Driver blocked or corrupted"]
steps = ["If the driver belongs to removed hardware/software it is usually harmless", "Otherwise reinstall or update the driver"]

[[entry]]
id = "event-scm-7036"
providers = ["Service Control Manager"]
event_ids = [7036, 7040, 7042]
noise = "benign"
title = "A service changed state"
explanation = "Informational record of a service starting, stopping or changing start type."
causes = ["Normal operation"]
steps = ["Useful as a timeline marker; no action needed"]

[[entry]]
id = "event-scm-7045"
providers = ["Service Control Manager"]
event_ids = [7045]
noise = "important"
title = "A new service was installed"
explanation = "A service was registered on the system. Expected after software installs; unexpected ones deserve attention (persistence technique)."
causes = ["Software installation or update", "Possible unauthorised persistence if the service is unknown"]
steps = ["Check the service name, image path and account", "Verify it belongs to software you installed"]

# ---------------------------------------------------------------- IIS / WAS
[[entry]]
id = "event-was-5002"
providers = ["WAS"]
event_ids = [5002]
noise = "important"
title = "IIS application pool disabled (rapid-fail protection)"
explanation = "The application pool's worker process failed too many times in a short period, so IIS disabled the pool. The site returns 503 until it is started again."
causes = ["Worker process keeps crashing (look for 5009/5011 and Application Error 1000 / .NET 1026 events)", "Bad configuration or identity (wrong password) preventing startup"]
steps = ["Find the first worker-process failure before this event", "Fix the cause, then start the application pool", "Temporarily relaxing rapid-fail protection only hides the problem"]

[[entry]]
id = "event-was-5011"
providers = ["WAS"]
event_ids = [5009, 5011]
noise = "important"
title = "IIS worker process terminated unexpectedly"
explanation = "The w3wp.exe process serving an application pool ended unexpectedly (crash) or had a fatal communication error."
causes = ["Unhandled exception or crash in the web application (stack overflow is common)", "Native module / ISAPI crash"]
steps = ["Look for Application Error 1000 / .NET Runtime 1026 / WER 1001 at the same time", "Capture a crash dump with DebugDiag or ProcDump if needed"]

[[entry]]
id = "event-was-5010"
providers = ["WAS"]
event_ids = [5010, 5013]
noise = "important"
title = "IIS worker process unresponsive / slow to shut down"
explanation = "5010: the worker process did not respond to IIS health pings in time. 5013: it took too long to shut down and was killed."
causes = ["Requests blocked (deadlock, thread-pool starvation, slow dependency)", "Very high load or CPU"]
steps = ["Check request durations and long-running requests in IIS logs", "Capture a hang dump while it happens"]

[[entry]]
id = "event-was-recycle"
providers = ["WAS"]
event_ids = [5074, 5076, 5077, 5079, 5080, 5081, 5117, 5186]
noise = "normal"
title = "IIS application pool recycle / idle shutdown"
explanation = "The worker process was recycled or shut down for a configured reason (scheduled time, memory limit, configuration change, idle timeout). Requests right after it are slower (warm-up)."
causes = ["Recycling settings of the application pool (time, requests, memory limits)", "Idle timeout", "Configuration change"]
steps = ["If latency spikes line up with recycles, review recycle settings / enable preload", "Memory-based recycles may indicate a leak"]

# ---------------------------------------------------------------- shutdown, reboot, hardware
[[entry]]
id = "event-kernel-power-41"
providers = ["Microsoft-Windows-Kernel-Power", "Kernel-Power"]
event_ids = [41]
noise = "important"
title = "Unexpected reboot (system did not shut down cleanly)"
explanation = "Windows restarted without a clean shutdown: power loss, hard reset, blue screen or a hang that required a reset. BugcheckCode in the data is non-zero after a blue screen (in decimal)."
causes = ["Power loss or forced reset", "Blue screen (look for BugCheck 1001)", "Hardware, driver or overheating problems"]
steps = ["Check for BugCheck 1001 / WHEA events just after boot", "Look at the time of the previous shutdown in EventLog 6008", "If no crash dump exists, suspect power or hardware"]

[[entry]]
id = "event-eventlog-6008"
providers = ["EventLog"]
event_ids = [6008]
noise = "important"
title = "The previous shutdown was unexpected"
explanation = "Logged at boot when the last shutdown was not clean; it states when the machine went down."
causes = ["Crash, power loss or hard reset before this boot"]
steps = ["Use the reported time to look at what happened just before the outage"]

[[entry]]
id = "event-eventlog-boot"
providers = ["EventLog"]
event_ids = [6005, 6006, 6009, 6013]
noise = "benign"
title = "Event log service start/stop (boot or shutdown marker)"
explanation = "6005/6009 mark a boot, 6006 a clean shutdown, 6013 reports uptime."
causes = ["Normal startup or shutdown"]
steps = ["Useful as reboot markers on a timeline"]

[[entry]]
id = "event-user32-1074"
providers = ["User32"]
event_ids = [1074]
noise = "normal"
title = "Planned restart or shutdown"
explanation = "A user or process initiated the restart/shutdown; the message names the process, user and reason."
causes = ["Windows Update, an installer or an administrator restarted the machine"]
steps = ["Read the process and reason to know who restarted it"]

[[entry]]
id = "event-bugcheck-1001"
providers = ["Microsoft-Windows-WER-SystemErrorReporting", "BugCheck"]
event_ids = [1001]
noise = "important"
title = "Blue screen (bug check)"
explanation = "The computer crashed with a stop error; the message has the bug-check code and the dump location."
causes = ["Faulty or outdated driver", "Hardware problems (memory, storage, overheating)"]
steps = ["Look up the bug-check code", "Analyse the memory dump (WinDbg !analyze -v) or check recently updated drivers"]

[[entry]]
id = "event-whea"
providers = ["Microsoft-Windows-WHEA-Logger"]
event_ids = [1, 17, 18, 19, 46, 47]
noise = "important"
title = "Hardware error reported (WHEA)"
explanation = "The CPU, memory, PCIe bus or another component reported a hardware error (corrected or fatal)."
causes = ["Failing hardware, unstable overclock, firmware/driver problems"]
steps = ["Update BIOS/firmware and chipset drivers", "Run hardware diagnostics; repeated errors on the same component point to it"]

[[entry]]
id = "event-disk-errors"
providers = ["disk", "Disk"]
event_ids = [7, 11, 51, 52, 153]
noise = "important"
title = "Disk I/O error or retry"
explanation = "7: bad block; 11: controller error; 51: error during paging; 153: I/O was retried. These explain slowness, hangs and corruption."
causes = ["Failing disk, cable, controller or storage path (SAN/VM host)"]
steps = ["Check the disk's health (SMART / storage vendor tools)", "On VMs check the host's storage latency", "Back up important data"]

[[entry]]
id = "event-ntfs"
providers = ["Ntfs", "Microsoft-Windows-Ntfs"]
event_ids = [55, 137, 140]
noise = "important"
title = "File system problem (NTFS)"
explanation = "NTFS detected corruption or failed to write metadata; the volume may need checking."
causes = ["Unexpected shutdown, failing storage or driver bugs"]
steps = ["Schedule 'chkdsk /f' (or check the volume) for the drive named", "Investigate disk errors at the same time"]

[[entry]]
id = "event-ntfs-health"
providers = ["Ntfs", "Microsoft-Windows-Ntfs"]
event_ids = [98]
noise = "normal"
title = "Volume health check result (NTFS)"
explanation = "NTFS reports the result of a volume check when a volume is mounted. At Information level it says the volume is healthy and nothing needs doing; at Warning or Error level it says the volume must be checked (chkdsk) to repair corruption."
causes = ["Information: routine mount of a healthy volume", "Warning/Error: corruption found after an unexpected shutdown or a storage fault"]
steps = ["Information level: no action", "Warning/Error level: run 'chkdsk /f' on the named volume and check the disk's own events around the same time"]

[[entry]]
id = "event-resource-exhaustion-2004"
providers = ["Microsoft-Windows-Resource-Exhaustion-Detector"]
event_ids = [2004]
noise = "important"
title = "Windows is low on virtual memory"
explanation = "Commit charge reached its limit; the message lists the processes using the most memory."
causes = ["A memory leak in one of the listed processes", "Page file too small for the workload"]
steps = ["Note the top consumers in the message and check whether one keeps growing", "Increase the page file only after excluding a leak"]

[[entry]]
id = "event-application-popup-26"
providers = ["Application Popup"]
event_ids = [26]
noise = "normal"
title = "System or application pop-up message"
explanation = "Windows showed a pop-up (for example 'Delayed Write Failed' or an application error box); the text is in the message."
causes = ["Depends on the pop-up text"]
steps = ["Read the message; 'Delayed Write Failed' points to storage or network-share problems"]

[[entry]]
id = "event-kernel-general-1"
providers = ["Microsoft-Windows-Kernel-General"]
event_ids = [1]
noise = "normal"
title = "System time changed"
explanation = "The clock was changed. Correlating logs across this moment can be misleading because timestamps jump."
causes = ["Time synchronisation correction", "Manual change or VM time sync"]
steps = ["Keep the jump in mind when comparing timestamps from different logs"]

# ---------------------------------------------------------------- network, TLS, name resolution
[[entry]]
id = "event-schannel"
providers = ["Schannel"]
event_ids = [36874, 36887, 36888, 36882, 36870]
noise = "normal"
title = "TLS/SSL handshake problem (Schannel)"
explanation = "A secure connection failed: unsupported protocol/cipher (36874), fatal alert received/generated (36887/36888), certificate problem (36882) or private key access error (36870)."
causes = ["Client and server have no common TLS version or cipher (e.g. TLS 1.0/1.1 disabled)", "Invalid, expired or untrusted certificate", "Service account cannot read the certificate's private key"]
steps = ["Check the alert code in the message", "Compare enabled TLS versions/ciphers on both sides", "Verify the certificate chain and private-key permissions"]

[[entry]]
id = "event-dns-1014"
providers = ["Microsoft-Windows-DNS-Client"]
event_ids = [1014]
noise = "normal"
title = "DNS name resolution timed out"
explanation = "None of the configured DNS servers answered for the name in the message."
causes = ["DNS server down or unreachable", "Network interruption or VPN change"]
steps = ["Check configured DNS servers and connectivity at that time", "Frequent occurrences explain intermittent connection failures in applications"]

[[entry]]
id = "event-tcpip-ports"
providers = ["Tcpip"]
event_ids = [4227, 4231]
noise = "important"
title = "TCP port exhaustion"
explanation = "The system ran out of (or could not reuse) ephemeral ports for outgoing connections."
causes = ["An application opens many short-lived outbound connections without reuse (e.g. new HttpClient per request)", "Connections stuck in TIME_WAIT"]
steps = ["Run 'netstat -ano' to find the process holding most ports", "Reuse connections (HttpClient factory / keep-alive)"]

[[entry]]
id = "event-netlogon-5719"
providers = ["NETLOGON"]
event_ids = [5719, 5783]
noise = "important"
title = "Cannot reach a domain controller"
explanation = "The computer could not set up a secure session with a domain controller; domain logons and authentication may fail."
causes = ["Network not ready at boot", "DC unreachable, DNS misconfiguration or broken computer account trust"]
steps = ["If only at boot it is often harmless", "Otherwise check DNS settings and connectivity to domain controllers"]

[[entry]]
id = "event-time-service"
providers = ["Microsoft-Windows-Time-Service"]
event_ids = [129, 134, 36, 47]
noise = "normal"
title = "Time synchronisation problem"
explanation = "Windows Time could not reach its time source. Clock drift breaks Kerberos (5-minute tolerance) and log correlation."
causes = ["NTP server unreachable (firewall UDP 123)", "Wrong time source configuration"]
steps = ["Run 'w32tm /query /status' and check the source", "Allow UDP 123 to the time source"]

[[entry]]
id = "event-grouppolicy"
providers = ["Microsoft-Windows-GroupPolicy"]
event_ids = [1129, 1085, 1096, 1030]
noise = "normal"
title = "Group Policy processing failed"
explanation = "Group Policy could not be applied completely (no connectivity to the domain, unreadable policy file or a client-side extension failure)."
causes = ["No network/DC connectivity", "Corrupted or inaccessible policy files in SYSVOL"]
steps = ["Run 'gpresult /h report.html' and check the failing extension", "Verify DC connectivity"]

# ---------------------------------------------------------------- installs & updates
[[entry]]
id = "event-msi-failed"
providers = ["MsiInstaller"]
event_ids = [11708, 1033, 11724]
noise = "normal"
title = "Windows Installer result"
explanation = "11708: installation failed. 1033: install finished — the 'status' value matters (0 = success, 1603 = fatal error, 1618 = another install running). 11724: product removed."
causes = ["Custom action failure, missing prerequisites, files in use or permissions (for failures)"]
steps = ["Re-run the installer with a verbose log: msiexec /i package.msi /l*v install.log", "In the log, search for 'Return value 3' — the lines above it show the failing action"]

[[entry]]
id = "event-msi-ok"
providers = ["MsiInstaller"]
event_ids = [11707, 1040, 1042, 11728, 1035]
noise = "benign"
title = "Windows Installer activity"
explanation = "Installation, reconfiguration or transaction start/end record."
causes = ["Software installation or update"]
steps = ["Useful as a 'what changed' marker on a timeline"]

[[entry]]
id = "event-windows-update"
providers = ["Microsoft-Windows-WindowsUpdateClient"]
event_ids = [19, 20, 43, 44]
noise = "normal"
title = "Windows Update activity"
explanation = "19: update installed; 20: installation failed (with an error code); 43/44: installation/download started."
causes = ["Scheduled updates"]
steps = ["For failures look up the error code", "Updates are a common 'what changed before the problem' cause — check the time"]

[[entry]]
id = "event-vss"
providers = ["VSS"]
event_ids = [8193, 8194, 12289, 12293, 13]
noise = "normal"
title = "Volume Shadow Copy (backup) error"
explanation = "The Volume Shadow Copy service or a VSS writer failed; backups or restore points may be incomplete."
causes = ["Insufficient shadow storage, permission problems, a failing writer (SQL, Exchange…)"]
steps = ["Run 'vssadmin list writers' and look for writers in a failed state", "Check backup software logs at the same time"]

[[entry]]
id = "event-dcom-10016"
providers = ["Microsoft-Windows-DistributedCOM", "DCOM"]
event_ids = [10016]
noise = "benign"
title = "DCOM permission warning (usually harmless)"
explanation = "A component asked for COM activation permission it was not granted. Microsoft documents most 10016 events as expected and safe to ignore."
causes = ["Built-in Windows components by design"]
steps = ["No action needed unless a specific application fails at the same time"]

[[entry]]
id = "event-dcom-10010"
providers = ["Microsoft-Windows-DistributedCOM", "DCOM"]
event_ids = [10010, 10005]
noise = "normal"
title = "COM server did not start / register in time"
explanation = "A COM server failed to start or did not register with DCOM within the timeout."
causes = ["The server process failed or started slowly", "Service disabled"]
steps = ["Identify the CLSID/AppID in the message and the program behind it"]

[[entry]]
id = "event-perflib"
providers = ["Microsoft-Windows-Perflib", "Perflib"]
event_ids = [1008, 1023, 2003, 2004]
noise = "benign"
title = "Performance counter DLL problem (usually harmless)"
explanation = "A performance counter library could not be loaded or opened. It only affects monitoring tools that read those counters."
causes = ["Counter registration left behind by uninstalled software", "Corrupted counter registry"]
steps = ["Usually ignore; if monitoring is affected, rebuild counters with 'lodctr /r' (elevated)"]

# ---------------------------------------------------------------- security
[[entry]]
id = "event-security-4625"
providers = ["Microsoft-Windows-Security-Auditing"]
event_ids = [4625]
noise = "important"
title = "Failed logon"
explanation = "An account failed to log on. Status/SubStatus explain why (e.g. 0xC000006A wrong password, 0xC0000064 unknown user, 0xC0000234 locked out); Logon Type tells how (2 interactive, 3 network, 10 remote desktop)."
causes = ["Wrong or stale saved password (services, scheduled tasks, mapped drives)", "Brute-force or password-spray attempt", "Disabled, expired or locked account"]
steps = ["Group failures by account and source IP/workstation", "Many accounts from one source = attack; one account repeatedly = stale credential", "Check 4740 lockout events"]

[[entry]]
id = "event-security-4624"
providers = ["Microsoft-Windows-Security-Auditing"]
event_ids = [4624, 4634, 4647, 4672]
noise = "benign"
title = "Logon / logoff / special privileges assigned"
explanation = "Normal authentication records. 4672 marks logons with administrative privileges."
causes = ["Normal activity"]
steps = ["Use Logon ID to follow one session; a successful logon right after many failures deserves attention"]

[[entry]]
id = "event-security-4740"
providers = ["Microsoft-Windows-Security-Auditing"]
event_ids = [4740]
noise = "important"
title = "Account locked out"
explanation = "An account was locked after too many bad passwords; 'Caller Computer Name' says where the bad attempts came from."
causes = ["Stale credentials on a device or service", "Password guessing"]
steps = ["Go to the caller computer and look for 4625 events / saved credentials there"]

[[entry]]
id = "event-security-kerberos"
providers = ["Microsoft-Windows-Security-Auditing"]
event_ids = [4771, 4776]
noise = "normal"
title = "Kerberos pre-authentication failure / NTLM validation"
