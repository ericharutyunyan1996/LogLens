causes = ["Bad or stale password", "Clock skew for Kerberos"]
steps = ["Check the failure/error code and the client address"]

[[entry]]
id = "event-security-1102"
providers = ["Microsoft-Windows-Eventlog", "Eventlog"]
event_ids = [1102, 104]
noise = "important"
title = "An event log was cleared"
explanation = "The audit log (1102) or another log (104) was cleared. Evidence before this point is gone."
causes = ["Administrative maintenance", "Attempt to hide activity"]
steps = ["Confirm who cleared it (user in the event) and whether it was expected"]

[[entry]]
id = "event-security-account-changes"
providers = ["Microsoft-Windows-Security-Auditing"]
event_ids = [4720, 4722, 4724, 4728, 4732, 4756, 4697, 4698, 4719]
noise = "important"
title = "Security-relevant change (account, group, service, task or audit policy)"
explanation = "A user was created/enabled/reset (4720/4722/4724), added to a privileged group (4728/4732/4756), a service or scheduled task was installed (4697/4698) or audit policy changed (4719)."
causes = ["Administrative work", "Possible unauthorised change"]
steps = ["Verify the change was expected and made by an authorised account"]

# ---------------------------------------------------------------- crash / error codes
[[entry]]
id = "code-access-violation"
codes = ["0xc0000005"]
noise = "important"
title = "0xC0000005 — access violation"
explanation = "The program read or wrote memory it is not allowed to access (null or dangling pointer, buffer overrun)."
causes = ["Bug in native code (the faulting module)", "Memory corruption", "Incompatible native library or driver"]
steps = ["Note the faulting module and offset", "Update or repair that module; capture a dump if it repeats"]

[[entry]]
id = "code-stack-buffer-overrun"
codes = ["0xc0000409"]
noise = "important"
title = "0xC0000409 — stack buffer overrun / fail-fast"
explanation = "The process terminated itself on purpose: a security check detected stack corruption, or the code called fail-fast (also used by some runtimes for fatal unhandled errors)."
causes = ["Memory corruption in native code", "Fatal error deliberately raised by the runtime/library"]
steps = ["Check the faulting module; look for .NET 1026 or related events at the same time"]

[[entry]]
id = "code-heap-corruption"
codes = ["0xc0000374"]
noise = "important"
title = "0xC0000374 — heap corruption"
explanation = "The memory heap was found damaged, typically long after the actual bug happened."
causes = ["Double free, use-after-free or buffer overflow in native code"]
steps = ["Enable PageHeap (gflags) for the process to catch the corruption at the source"]

[[entry]]
id = "code-stack-overflow"
codes = ["0xc00000fd"]
noise = "important"
title = "0xC00000FD — stack overflow"
explanation = "The thread used up its stack, almost always due to infinite or very deep recursion."
causes = ["Recursive call without exit condition (e.g. property calling itself)", "Very deep object graphs being serialised"]
steps = ["Look for repeating frames in the stack trace or dump"]

[[entry]]
id = "code-clr-exception"
codes = ["0xe0434352"]
noise = "important"
title = "0xE0434352 — unhandled .NET exception"
explanation = "Generic code for a .NET (CLR) exception that was not caught. The real exception is in the '.NET Runtime 1026' event or the application's log."
causes = ["Unhandled exception in managed code"]
steps = ["Find the .NET Runtime 1026 event at the same time for type, message and stack"]

[[entry]]
id = "code-cpp-exception"
codes = ["0xe06d7363"]
noise = "important"
title = "0xE06D7363 — unhandled C++ exception"
explanation = "A C++ exception (throw) was not caught."
causes = ["Unhandled exception in native C++ code"]
steps = ["Debug with a dump to see the thrown type"]

[[entry]]
id = "code-breakpoint"
codes = ["0x80000003"]
noise = "important"
title = "0x80000003 — breakpoint / assertion"
explanation = "The process hit a breakpoint instruction — often an assertion or a deliberate crash in a release build."
causes = ["Failed assertion or debug break left in code"]
steps = ["Look at the faulting module and recent changes"]

[[entry]]
id = "code-dll-not-found"
codes = ["0xc0000135"]
noise = "important"
title = "0xC0000135 — required DLL not found"
explanation = "The program could not start because a DLL it needs was not found (often a runtime such as Visual C++ or .NET)."
causes = ["Missing runtime or dependency", "Wrong PATH or partial installation"]
steps = ["Install the required runtime; use a dependency viewer to find the missing DLL"]

[[entry]]
id = "code-dll-init-failed"
codes = ["0xc0000142"]
noise = "important"
title = "0xC0000142 — DLL initialisation failed"
explanation = "A DLL failed to initialise while the process started. On servers this is commonly desktop-heap exhaustion when many processes start non-interactively."
causes = ["Desktop heap exhausted (many service/scheduled processes)", "Corrupted dependency"]
steps = ["If many processes start at once under services, review desktop heap settings"]

[[entry]]
id = "code-sqlexception"
codes = ["0x80131904"]
noise = "important"
title = "0x80131904 — SqlException"
explanation = "HRESULT of a .NET SqlException; the SQL Server error number and message in the same entry say what went wrong (e.g. 1205 deadlock, -2 timeout, 18456 login failed, 4060 database unavailable)."
causes = ["Database-side error, timeout or connection problem"]
steps = ["Read the SQL error number and message next to it"]

[[entry]]
id = "code-cbs-source-missing"
codes = ["0x800f081f", "0x800f0906", "0x800f0907"]
noise = "important"
title = "Windows component source files not found"
explanation = "DISM/Windows Update could not find the files needed to install or repair a feature (common for .NET 3.5 and repairs)."
causes = ["No internet/WSUS access to download sources", "Group Policy blocks Windows Update as a source"]
steps = ["Provide a source: DISM /Online /Enable-Feature ... /Source:<install media>\\sources\\sxs", "Allow repair content from Windows Update in Group Policy"]

[[entry]]
id = "code-msi-1603"
codes = ["0x80070643"]
patterns = ['\berror 1603\b', 'exit code[: ]+1603\b']
noise = "important"
title = "1603 — fatal error during installation"
explanation = "Generic Windows Installer failure; the cause is the failing custom action or step in the verbose MSI log."
causes = ["Files in use, missing prerequisites, permissions, a failing custom action"]
steps = ["Create a verbose log (msiexec /l*v) and search for 'Return value 3'"]

[[entry]]
id = "code-out-of-memory-hresult"
codes = ["0x8007000e"]
noise = "important"
title = "0x8007000E — out of memory"
explanation = "Not enough memory (or address space in 32-bit processes) to complete the operation."
causes = ["Memory leak, very large data, 32-bit process limits"]
steps = ["Check the process' memory growth over time", "Consider 64-bit builds for large workloads"]

[[entry]]
id = "code-sharing-violation"
codes = ["0x80070020"]
noise = "normal"
title = "0x80070020 — file in use by another process"
explanation = "Another process holds the file open without sharing (antivirus, backup, a second instance)."
causes = ["Antivirus or backup scanning", "Another instance or process locking the file"]
steps = ["Use Resource Monitor / handle.exe to find the process holding the file"]

[[entry]]
id = "code-winhttp-timeout"
codes = ["0x80072ee2", "0x80072efd", "0x80072ee7"]
noise = "normal"
title = "WinHTTP connection failure (timeout / cannot connect / name not resolved)"
explanation = "0x80072EE2: timed out; 0x80072EFD: cannot connect; 0x80072EE7: server name could not be resolved."
causes = ["Network, proxy or firewall problem", "Target service down", "DNS failure"]
steps = ["Test connectivity to the target from the same machine and account (proxy settings!)"]

[[entry]]
id = "code-logon-substatus"
codes = ["0xc000006a", "0xc0000064", "0xc0000234", "0xc0000072", "0xc000006f", "0xc0000071", "0xc0000193", "0xc0000133", "0xc000006d", "0xc0000224"]
noise = "normal"
title = "Logon failure reason code"
explanation = "0xC000006A wrong password · 0xC0000064 user does not exist · 0xC0000234 account locked · 0xC0000072 account disabled · 0xC000006F outside allowed hours · 0xC0000071 password expired · 0xC0000193 account expired · 0xC0000133 clock skew · 0xC000006D bad user name or authentication info · 0xC0000224 must change password."
causes = ["See the code meaning"]
steps = ["Combine with account name and source address to find stale credentials or attacks"]

# ---------------------------------------------------------------- common error messages (.NET, SQL, HTTP, network, IO)
[[entry]]
id = "text-out-of-memory"
patterns = ['OutOfMemoryException', 'Insufficient memory', 'out of memory']
noise = "important"
title = "Out of memory"
explanation = "The process could not allocate memory. In .NET this often means very large objects/strings, a leak, or a 32-bit process limit — not necessarily that the machine is out of RAM."
causes = ["Memory leak (growing caches, event handlers, static collections)", "Loading huge data into memory at once", "32-bit process address-space limit"]
steps = ["Track the process' private bytes over time", "Stream data instead of loading it whole", "Take a memory dump when usage is high"]

[[entry]]
id = "text-null-reference"
patterns = ['NullReferenceException', 'Object reference not set to an instance of an object']
noise = "important"
title = "NullReferenceException"
explanation = "Code used an object reference that was null. The stack trace's first frame from your code shows where."
causes = ["Missing data/configuration not checked for null", "Object used before initialisation or after disposal"]
steps = ["Open the first stack frame in your code and check which reference can be null there"]

[[entry]]
id = "text-sql-deadlock"
patterns = ['deadlocked on lock', 'chosen as the deadlock victim', 'SQL error 1205', 'Number:\s*1205']
noise = "important"
title = "SQL Server deadlock (error 1205)"
explanation = "Two transactions waited for each other's locks; SQL Server killed one of them (the 'victim'). Usually safe to retry."
causes = ["Transactions touching the same tables in different order", "Long transactions or missing indexes causing large lock ranges"]
steps = ["Retry the transaction with backoff", "Get the deadlock graph from the system_health Extended Events session", "Access tables in a consistent order; add indexes"]

[[entry]]
id = "text-sql-timeout"
patterns = ['Execution Timeout Expired', 'The timeout period elapsed prior to completion of the operation', 'Timeout expired\.\s+The timeout period elapsed']
noise = "important"
title = "SQL command or connection timeout"
explanation = "A query or connection did not complete within the timeout (default 30 s for commands, 15 s for connections)."
causes = ["Slow query (missing index, blocking, large scans)", "Blocking by another transaction", "Connection pool exhausted or server overloaded"]
steps = ["Find the query and check its execution plan", "Look for blocking sessions at that time", "Check whether the pool is exhausted (many concurrent long requests)"]

[[entry]]
id = "text-sql-login-failed"
patterns = ['Login failed for user', 'Error:\s*18456']
noise = "important"
title = "SQL Server login failed (18456)"
explanation = "SQL Server rejected the login. The State number in the SQL Server error log says why (e.g. 8 wrong password, 38 database not accessible)."
causes = ["Wrong password or user", "Database in connection string does not exist / no access", "Windows account not mapped"]
steps = ["Check the connection string and account", "Read the SQL Server ERRORLOG entry with the State number"]

[[entry]]
id = "text-sql-network"
patterns = ['A network-related or instance-specific error occurred while establishing a connection to SQL Server', 'error: 40 - Could not open a connection to SQL Server', 'error: 26 - Error Locating Server']
noise = "important"
title = "Cannot connect to SQL Server"
explanation = "The client could not reach the SQL Server instance."
causes = ["Server/instance name wrong or server down", "Firewall blocks the port (1433 / SQL Browser UDP 1434)", "TCP/IP protocol disabled on the server"]
steps = ["Test connectivity (Test-NetConnection server -Port 1433)", "Check SQL Server Configuration Manager and firewall"]

[[entry]]
id = "text-timeout"
patterns = ['TimeoutException', 'The operation has timed out', 'timed out after', 'Request timed out']
noise = "normal"
title = "Operation timed out"
explanation = "A call to another component did not finish within its timeout."
causes = ["Slow or overloaded dependency", "Network problems", "Timeout too short for the workload"]
steps = ["Find which dependency the call targets and check its health at that time", "Compare with the dependency's own logs and latency"]

[[entry]]
id = "text-task-canceled"
patterns = ['TaskCanceledException', 'A task was canceled', 'The request was canceled due to the configured HttpClient\.Timeout']
noise = "normal"
title = "Task canceled — often an HttpClient timeout"
explanation = "In .NET, HttpClient reports its timeout (default 100 s) as TaskCanceledException; it can also mean the caller canceled the request."
causes = ["Remote service too slow", "Client-side timeout too low", "Request cancelled because the caller went away"]
steps = ["Check the remote service's latency at that time", "Distinguish timeout vs. user cancel via the inner exception"]

[[entry]]
id = "text-tls-certificate"
patterns = ['The remote certificate is invalid', 'The SSL connection could not be established', 'Could not establish trust relationship for the SSL/TLS secure channel', 'certificate has expired', 'certificate verify failed', 'RemoteCertificateNameMismatch', 'RemoteCertificateChainErrors']
noise = "important"
title = "TLS / certificate validation failed"
explanation = "A secure connection was refused because the server's certificate was not trusted, expired, or issued for another name — or no common TLS version exists."
causes = ["Expired or self-signed certificate", "Missing intermediate/root CA on the client", "Host name does not match the certificate", "TLS version mismatch (see Schannel events)"]
steps = ["Inspect the certificate (expiry, chain, subject alternative names)", "Check the client's trusted root store and TLS settings"]

[[entry]]
id = "text-connection-reset"
patterns = ['An existing connection was forcibly closed by the remote host', 'Connection reset by peer', '10054']
noise = "normal"
title = "Connection reset by the remote side"
explanation = "The other side (or a firewall/load balancer in between) dropped the TCP connection."
causes = ["Server crashed or restarted", "Idle timeout on a firewall/load balancer", "TLS mismatch closing the connection"]
steps = ["Check the remote service's logs at that time", "Look for idle timeouts on network devices"]

[[entry]]
id = "text-connection-refused"
patterns = ['No connection could be made because the target machine actively refused it', 'Connection refused', 'ECONNREFUSED', '10061']
noise = "important"
title = "Connection refused"
explanation = "Nothing was listening on the target port, or a firewall rejected the connection."
causes = ["Target service not running / wrong port", "Firewall rule"]
steps = ["Verify the service is running and listening (netstat -ano)", "Test the port from the client machine"]

[[entry]]
id = "text-connection-failed"
patterns = ['Unable to connect to the remote server', 'The underlying connection was closed', 'A connection attempt failed because the connected party did not properly respond']
noise = "normal"
title = "Could not connect to a remote server"
explanation = "The network call failed before a response arrived."
causes = ["Server unreachable, proxy/firewall, DNS or TLS problems"]
steps = ["Check the inner exception for the precise reason", "Test connectivity from the same machine and account"]

[[entry]]
id = "text-dns"
patterns = ['The remote name could not be resolved', 'No such host is known', 'Name or service not known', 'getaddrinfo failed', 'ENOTFOUND']
noise = "important"
title = "Host name could not be resolved (DNS)"
explanation = "DNS lookup for the host failed."
causes = ["Typo in host name/configuration", "DNS server unreachable or missing record", "VPN/split DNS issues"]
steps = ["nslookup the host from the same machine", "Look for DNS Client 1014 events at that time"]

[[entry]]
id = "text-file-in-use"
patterns = ['being used by another process', 'IOException: The process cannot access the file', 'sharing violation']
noise = "normal"
title = "File in use by another process"
explanation = "The file is locked by another process (antivirus, backup, another instance, an editor)."
causes = ["Antivirus or backup scanning the file", "Two processes writing the same file", "File not closed by the application"]
steps = ["Find the locking process (Resource Monitor → CPU → Associated Handles)", "Retry with backoff or use shared access"]

[[entry]]
id = "text-access-denied"
patterns = ['UnauthorizedAccessException', 'Access to the path .* is denied', 'Access is denied', 'Permission denied', 'EACCES']
noise = "important"
title = "Access denied"
explanation = "The account running the code lacks permission for the file, registry key or resource."
causes = ["Service/app pool identity lacks rights", "File locked read-only or by policy", "UAC: not running elevated"]
steps = ["Check which account the process runs as", "Grant the minimum required permission to that account"]

[[entry]]
id = "text-disk-full"
patterns = ['There is not enough space on the disk', 'No space left on device', 'disk full', 'ENOSPC']
noise = "important"
title = "Disk full"
explanation = "A write failed because the volume has no free space."
causes = ["Logs, temp files or data growing without cleanup"]
steps = ["Free space and find what grew (e.g. log folders)", "Add retention/rotation"]

[[entry]]
id = "text-assembly-load"
patterns = ['Could not load file or assembly', "The located assembly's manifest definition does not match", 'FileLoadException', 'BadImageFormatException']
noise = "important"
title = ".NET assembly could not be loaded"
explanation = "A required .NET assembly is missing, has the wrong version, or the wrong architecture (32/64-bit)."
causes = ["Missing DLL in deployment", "Version mismatch without a binding redirect", "32-bit vs 64-bit mismatch (BadImageFormatException)"]
steps = ["Read the assembly name/version in the message", "Check deployed DLL versions and binding redirects", "Use fusion logging (FUSLOGVW) to see probing paths"]

[[entry]]
id = "text-stack-overflow"
patterns = ['StackOverflowException', 'Stack overflow']
noise = "important"
title = "Stack overflow"
explanation = "Infinite or too-deep recursion; the process is terminated immediately in .NET."
causes = ["Recursive call without exit condition"]
steps = ["Find repeating frames in the stack trace / dump"]

[[entry]]
id = "text-thread-abort"
patterns = ['ThreadAbortException', 'Thread was being aborted']
noise = "normal"
title = "Thread was aborted"
explanation = "In classic ASP.NET this is often raised by Response.Redirect/Response.End or an app-domain recycle — not always a real error."
causes = ["Response.Redirect(url) / Response.End", "Application pool recycle or request timeout"]
steps = ["If caused by Redirect, use Redirect(url, false)", "Check for recycles at the same time"]

[[entry]]
id = "text-http-401-403"
patterns = ['\(401\) Unauthorized', '\(403\) Forbidden', '\b401 Unauthorized\b', '\b403 Forbidden\b', 'StatusCode: 401', 'StatusCode: 403']
noise = "important"
title = "HTTP 401 / 403 — not authenticated or not allowed"
explanation = "401: credentials missing, invalid or expired (token, key, password). 403: authenticated but not permitted."
causes = ["Expired token or rotated secret", "Wrong scopes/permissions for the account", "Clock skew invalidating tokens"]
steps = ["Check token expiry and the credentials configured", "Verify the account's permissions on the remote service"]

[[entry]]
id = "text-http-429"
patterns = ['\(429\) Too Many Requests', '\b429 Too Many Requests\b', 'StatusCode: 429', 'rate limit']
noise = "normal"
title = "HTTP 429 — rate limited"
explanation = "The remote service is throttling requests."
causes = ["Too many requests in a short period", "Shared quota used by other clients"]
steps = ["Honour the Retry-After header and back off", "Reduce concurrency or batch requests"]

[[entry]]
id = "text-http-5xx"
patterns = ['\(500\) Internal Server Error', '\(502\) Bad Gateway', '\(503\) Server Unavailable', '\(503\) Service Unavailable', '\(504\) Gateway Timeout', '\b50[0234] (Internal Server Error|Bad Gateway|Service Unavailable|Gateway Timeout)\b']
noise = "important"
title = "HTTP 5xx from a remote service"
explanation = "500: the server failed processing the request. 502/504: a gateway/proxy could not get a (timely) answer from the upstream server. 503: service unavailable or overloaded (in IIS often a stopped application pool)."
causes = ["Server-side bug or crash (500)", "Upstream down or too slow behind a proxy/load balancer (502/504)", "Service overloaded or stopped (503)"]
steps = ["Check the remote service's logs and health at that time", "For your own IIS: look for WAS 5002/5011 events and stopped app pools", "Retry idempotent calls with backoff"]

# ---------------------------------------------------------------- more common Windows events (found on real machines)
[[entry]]
id = "event-dns-registration"
providers = ["Microsoft-Windows-DNS-Client"]
event_ids = [8015, 8016, 8018, 8019, 8020]
noise = "normal"
title = "DNS dynamic registration of this computer failed"
explanation = "The computer could not register or update its own name/IP in DNS (dynamic update). Name resolution *of other hosts* is not affected; other machines may not find this one by name if records are stale."
causes = ["DNS server does not accept (secure) dynamic updates from this client", "Network adapter registration enabled where DHCP/administrators manage records", "DNS server unreachable at that moment"]
steps = ["If this computer is reachable by name, it is usually harmless (DHCP or admins register the record)", "Otherwise check the adapter's 'Register this connection's addresses in DNS' setting and the zone's dynamic-update policy", "ipconfig /registerdns retries the registration"]

[[entry]]
id = "event-gpp-4098"
providers = ["Group Policy"]
event_ids = [4098]
noise = "normal"
title = "A Group Policy preference item could not be applied"
explanation = "A Group Policy Preferences item (drive map, local user/group, registry, file, scheduled task…) failed; the message names the item and an error code."
causes = ["Item targets something that does not exist on this computer (user, group, path)", "Insufficient rights or the item's target is in use", "Misconfigured preference item in the GPO"]
steps = ["Read the item name and error code in the message", "Run 'gpresult /h report.html' to see which GPO contains the item", "Fix or narrow the item (item-level targeting) in the GPO"]

[[entry]]
id = "event-dotnet-profiler-1022"
providers = [".NET Runtime"]
event_ids = [1022]
noise = "normal"
title = ".NET profiler failed to load"
explanation = "A .NET process tried to load a profiler (usually an APM/monitoring or security agent configured via COR_PROFILER / CORECLR_PROFILER environment variables) and failed. The application itself keeps running without it."
causes = ["Monitoring/APM agent partly uninstalled while its environment variables remain", "Profiler DLL missing or wrong architecture (32/64-bit)"]
steps = ["Check COR_ENABLE_PROFILING / COR_PROFILER (and CORECLR_*) environment variables for the process or app pool", "Repair or remove the monitoring agent named by the CLSID"]

[[entry]]
id = "event-iis-apphostsvc-9009"
providers = ["Microsoft-Windows-IIS-APPHOSTSVC"]
event_ids = [9009]
noise = "benign"
title = "IIS configuration history cleanup failed (usually harmless)"
explanation = "The IIS Application Host Helper Service keeps backup copies of applicationHost.config in the history folder and could not delete an old copy."
causes = ["A file in the history folder is locked or permissions were changed", "Antivirus or backup holding the folder"]
steps = ["Usually ignore", "If it repeats, check permissions on %SystemDrive%\\inetpub\\history"]

[[entry]]
id = "event-volsnap-limit"
providers = ["Volsnap"]
event_ids = [25, 36]
noise = "normal"
title = "Shadow copies deleted or aborted (storage limit reached)"
explanation = "Volume Shadow Copy storage could not grow because of its configured maximum (or free space), so shadow copies were deleted (25) or aborted (36). Restore points / backups from that time may be missing."
causes = ["Shadow storage maximum too small for the change rate", "Low free disk space"]
steps = ["Check limits with 'vssadmin list shadowstorage'", "Increase the maximum or free disk space if backups depend on shadow copies"]

[[entry]]
id = "event-application-defined"
providers = ["*"]
event_ids = [0]
noise = "normal"
title = "Event written by the application itself"
explanation = "Event ID 0 means the program (not Windows) wrote this entry, typically through EventLog.WriteEntry without an event ID. It has no Windows-wide meaning — the message text is the information."
causes = ["Application logging its own status or errors to the Windows event log"]
steps = ["Read the message (and its exception/stack trace, if any)", "Look at the same time in the application's own log file for more context"]

# ==== kb-expansion-2026-11 ====
# Entries below were researched from public vendor documentation and well-known troubleshooting guides (each group
# names its sources). Text is written in our own words; patterns are anchored on distinctive wording. Everything here
# describes widely used platforms (Windows, .NET, IIS, SQL Server, Java, Python, Node.js, PostgreSQL, MySQL, nginx,
# Apache, Linux, Kubernetes) — nothing is specific to one company's application.

# ---------------------------------------------------------------- Windows: Schannel (TLS)
# src: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-server-2012-r2-and-2012/dn786445(v=ws.11)
# src: https://github.com/MicrosoftDocs/SupportArticles-docs/blob/main/support/azure/virtual-machines/windows/event-id-troubleshoot-vm-rdp-connecton.md
[[entry]]
id = "event-schannel-credential"
providers = ["Schannel"]
event_ids = [36871, 36872, 36873]
noise = "normal"
title = "Schannel could not create a TLS credential (36871 / 36872 / 36873)"
explanation = "Windows' TLS provider failed to build a client or server credential (36871), could not retrieve the chain of the certificate it was given (36872), or found no cipher suite it may use for an outgoing connection (36873). Common on hardened machines where old TLS versions or ciphers were switched off; the 'internal error state' number in the message narrows it down."
causes = ["TLS versions or cipher suites disabled by policy/registry while an application still asks for an older one", "The certificate's private key cannot be used by the service account, or its intermediate CA is missing", "Legacy software (old .NET Framework apps, agents) requesting SSL 3.0 / TLS 1.0"]
steps = ["Note the process and time and look for the failing connection in that application's log", "Compare the enabled protocols under HKLM\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\SCHANNEL\\Protocols with what the application needs", "For .NET Framework apps enable SchUseStrongCrypto / SystemDefaultTlsVersions so they negotiate TLS 1.2+", "If nothing is broken and it only appears at boot, it is usually safe to ignore"]

[[entry]]
id = "event-schannel-cert-validation"
providers = ["Schannel"]
event_ids = [36876, 36877, 36881, 36883, 36884]
noise = "important"
title = "TLS certificate rejected by Schannel (invalid, expired, revoked or wrong name)"
explanation = "Windows refused a certificate during a TLS handshake: it did not validate (36876 server / 36877 client certificate), it expired (36881), it was revoked (36883) or it does not contain the expected host name (36884). The connection failed."
causes = ["Expired or revoked certificate on the other side", "The name used to connect (alias, IP address, short name) is not in the certificate's subject / SAN list", "Missing intermediate or root CA on this machine", "A service still using a cached old certificate after renewal"]
steps = ["Inspect the remote (or client) certificate: validity dates, SAN entries and chain", "Connect using a name that is listed in the certificate", "Install missing intermediate/root CAs; restart services that cache certificates after a renewal"]

[[entry]]
id = "event-schannel-no-default-credential"
providers = ["Schannel"]
event_ids = [36886]
noise = "benign"
title = "No default TLS server certificate on this machine (usually harmless)"
explanation = "Schannel found no certificate for services that rely on the machine's default credential — typical on domain controllers without an LDAPS certificate. Applications that choose their own certificate (IIS, SQL Server) are not affected."
causes = ["No enterprise CA, or no server-authentication certificate enrolled for this machine", "The machine certificate expired and was not renewed"]
steps = ["Ignore unless LDAPS (port 636) or another default-credential service is needed", "Otherwise enroll a server-authentication certificate for the machine (e.g. via autoenrollment)"]

[[entry]]
id = "event-schannel-36885"
providers = ["Schannel"]
event_ids = [36885]
noise = "normal"
title = "Trusted CA list sent to TLS clients was truncated"
explanation = "When a server asks clients for a certificate it sends the CAs it trusts. This machine trusts so many root CAs that the list was cut short, so clients may not offer a suitable certificate and client-certificate authentication can fail."
causes = ["Many certificates in the Trusted Root store (auto-updated roots, third-party installers)"]
steps = ["If client-certificate logins fail, prune unneeded roots or stop sending the issuer list (SendTrustedIssuerList = 0)", "Otherwise no action is needed"]

[[entry]]
id = "event-schannel-info"
providers = ["Schannel"]
event_ids = [36864, 36867, 36868, 36875, 36880]
noise = "benign"
title = "Schannel informational record (verbose TLS logging)"
explanation = "Informational TLS events: package loaded, credential created, private-key properties, 'no client certificate available, trying anonymously', handshake completed. They mostly appear when verbose Schannel logging is switched on."
causes = ["EventLogging under the SCHANNEL registry key set higher than the default"]
steps = ["No action; set EventLogging back to 1 after troubleshooting to cut the noise"]

# ---------------------------------------------------------------- Windows: Service Control Manager (more)
# src: https://learn.microsoft.com/en-us/troubleshoot/sql/database-engine/startup-shutdown/gmsa-service-startup-failures
# src: https://learn.microsoft.com/en-us/troubleshoot/sql/database-engine/startup-shutdown/error-1069-service-cannot-start
# src: https://www.geoffchappell.com/studies/windows/win32/services/scm/events/eventlog.htm
[[entry]]
id = "event-scm-logon-failure"
providers = ["Service Control Manager"]
event_ids = [7038, 7041]
noise = "important"
title = "A service could not log on with its configured account"
explanation = "The service did not start because its account could not log on: bad or expired password, disabled/locked account or unreachable domain (7038), or the account lacks the 'Log on as a service' right (7041). Usually paired with 7000 and error 1069."
causes = ["Service account password changed or expired while the service still has the old one", "Account disabled, locked out or deleted", "'Log on as a service' removed by Group Policy", "Domain controller unreachable at boot, or a gMSA password cannot be retrieved"]
steps = ["Check the account named in the message (enabled, not locked, password not expired)", "Re-enter the password on the service's Log On tab, or re-install the gMSA (Install-ADServiceAccount)", "Check the effective 'Log on as a service' assignment with gpresult / secpol.msc"]

[[entry]]
id = "event-scm-7043"
providers = ["Service Control Manager"]
event_ids = [7043]
noise = "normal"
title = "A service did not shut down properly after the preshutdown notification"
explanation = "During shutdown a service that asked for early notice did not stop in time, so Windows continued without it. Shutdowns get slower and the service may not have flushed its data."
causes = ["Slow stop logic (flushing data, waiting on network or a database)", "A hang in the service while stopping"]
steps = ["Read the service's own log around the shutdown time", "Update the product if it happens on every shutdown"]

[[entry]]
id = "event-scm-7032"
providers = ["Service Control Manager"]
event_ids = [7032]
noise = "normal"
title = "Service recovery action failed"
explanation = "After a service stopped unexpectedly, the Service Control Manager tried the configured recovery action (usually a restart) and that action failed."
causes = ["The service crashes again straight after the restart", "The configured recovery program or command does not exist"]
steps = ["Find the preceding 7031/7034 and the crash event for the real cause", "Review the recovery settings with 'sc qfailure <service>'"]

[[entry]]
id = "event-scm-7030"
providers = ["Service Control Manager"]
event_ids = [7030]
noise = "benign"
title = "Service marked as interactive, but interactive services are not allowed"
explanation = "The service is configured to interact with the desktop, which modern Windows does not allow. It usually still runs; only its own windows would be invisible."
causes = ["Older software installed with 'Allow service to interact with desktop'"]
steps = ["Usually ignore; clear the interactive flag on the service's Log On tab to silence it"]

# ---------------------------------------------------------------- Windows: Kerberos, KDC, NTLM and audit records
# src: https://learn.microsoft.com/en-us/troubleshoot/windows-server/windows-security/event-id-27-kdc-errors
# src: https://learn.microsoft.com/en-us/troubleshoot/windows-server/windows-security/kdc-event-16-27-des-encryption-disabled
# src: https://techcommunity.microsoft.com/blog/askds/what-happened-to-kerberos-authentication-after-installing-the-november-2022oob-u/3696351
[[entry]]
id = "event-kdc-etype"
providers = ["Microsoft-Windows-Kerberos-Key-Distribution-Center", "KDC"]
event_ids = [14, 16, 26, 27, 42]
patterns = ['\bKDC_ERR_ETYPE_NOTSUPP\b', '\bKDC has no support for encryption type\b']
noise = "important"
title = "Kerberos encryption type mismatch"
explanation = "The KDC could not issue a ticket because the account has no key for any encryption type the request allows (KDC events 14/16/26/27, KDC_ERR_ETYPE_NOTSUPP), or an account lacks strong AES keys (42). Clients fail to authenticate or fall back to NTLM."
causes = ["Account password not reset since AES was introduced, so only RC4/DES keys exist", "msDS-SupportedEncryptionTypes or the 'encryption types allowed for Kerberos' policy excludes what the account has", "Security updates that changed the default encryption types", "Keytab on a non-Windows system created with an unsupported encryption type"]
steps = ["Read the requested and available etypes in the message (17/18 = AES, 23 = RC4, 1/3 = DES)", "Check msDS-SupportedEncryptionTypes on the service account and the domain's Kerberos policy", "Reset the account's password to create AES keys (krbtgt: twice, with replication in between); regenerate keytabs"]

# src: https://learn.microsoft.com/en-us/sql/relational-databases/errors-events/mssqlserver-18456-database-engine-error
# src: https://strongwind.dev/Kerberos/security/troubleshooting/
[[entry]]
id = "event-kdc-duplicate-spn"
providers = ["Microsoft-Windows-Kerberos-Key-Distribution-Center", "KDC"]
event_ids = [11]
noise = "important"
title = "Duplicate service principal name (SPN) in Active Directory"
explanation = "The KDC found the same SPN on more than one account, so it cannot tell whose key to use. Kerberos to that service fails or silently falls back to NTLM."
causes = ["The same SPN registered on a computer account and on a service account", "A service moved to a new account without removing the old SPN"]
steps = ["List duplicates with 'setspn -X' (or check one name with 'setspn -Q <spn>')", "Keep the SPN only on the account that really runs the service ('setspn -D' on the other)"]

[[entry]]
id = "event-kerberos-ap-err-modified"
providers = ["Microsoft-Windows-Security-Kerberos"]
event_ids = [4]
patterns = ['\bKRB_AP_ERR_MODIFIED\b']
noise = "important"
title = "Kerberos ticket could not be decrypted by the target (KRB_AP_ERR_MODIFIED)"
explanation = "The server could not decrypt the Kerberos ticket the client presented, because the ticket was made for a different account than the one the service runs under. The client then fails or falls back to NTLM."
causes = ["SPN registered on another account than the service account (or duplicated)", "DNS / hosts entry sends the name to a different machine", "Machine or service account password out of sync (restored or cloned VM)"]
steps = ["Check which account holds the SPN with 'setspn -Q <spn>'", "Verify the name resolves to the intended server (nslookup, hosts file)", "Repair an out-of-sync computer account (Test-ComputerSecureChannel -Repair)"]

[[entry]]
id = "net-kerberos-principal-unknown"
patterns = ['\bKDC_ERR_S_PRINCIPAL_UNKNOWN\b', '\bKDC_ERR_C_PRINCIPAL_UNKNOWN\b']
noise = "normal"
title = "Kerberos principal not found (KDC_ERR_S/C_PRINCIPAL_UNKNOWN)"
explanation = "The KDC does not know the requested service name (S_PRINCIPAL: no SPN registered for it) or client name (C_PRINCIPAL). Windows clients usually fall back to NTLM, which breaks delegation scenarios."
causes = ["Missing SPN for the service account (e.g. MSSQLSvc/host:1433 or HTTP/host)", "Client connects via an alias or IP address that has no SPN", "Client account does not exist in that realm"]
steps = ["Register the SPN on the account that runs the service ('setspn -S')", "Connect with the name the SPN was registered for", "Occasional entries can be ignored when NTLM fallback is acceptable"]

[[entry]]
id = "net-kerberos-clock-skew"
patterns = ['\bKRB_AP_ERR_SKEW\b', '\bClock skew too great\b']
noise = "important"
title = "Kerberos rejected: clock skew too great"
explanation = "Client and server clocks differ by more than the allowed tolerance (5 minutes by default), so Kerberos tickets are refused."
causes = ["Time synchronisation broken (blocked UDP 123, VM host sync fighting domain time)", "Wrong time zone or manually changed clock"]
steps = ["Compare clocks with 'w32tm /stripchart /computer:<dc>'", "Fix the time source: members follow the domain hierarchy, the PDC emulator uses reliable NTP"]

[[entry]]
id = "net-kerberos-logon-rejected"
patterns = ['\bKDC_ERR_PREAUTH_FAILED\b', '\bKDC_ERR_CLIENT_REVOKED\b', '\bKDC_ERR_KEY_EXPIRED\b']
noise = "normal"
title = "Kerberos logon rejected (bad password, disabled/locked or expired account)"
explanation = "PREAUTH_FAILED means a wrong password; CLIENT_REVOKED means the account is disabled, expired or locked out; KEY_EXPIRED means the password expired and must be changed."
causes = ["Stale password in a service, scheduled task, keytab or mapped drive", "Account locked out after repeated failures"]
steps = ["Find the client sending the failing requests (4768/4771 events on the domain controller)", "Update the stored password or keytab, then unlock the account if needed"]

# src: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4768
# src: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4769
[[entry]]
id = "event-security-4768-4769"
providers = ["Microsoft-Windows-Security-Auditing"]
event_ids = [4768, 4769]
noise = "normal"
title = "Kerberos ticket requested (TGT 4768 / service ticket 4769)"
explanation = "Domain controllers record each Kerberos ticket request. Result Code 0x0 is success; common failures: 0x6 unknown user, 0x7 unknown service (missing SPN), 0x12 account disabled/locked/expired, 0x17 password expired, 0x18 wrong password, 0x25 clock skew, 0xE encryption type not supported."
causes = ["Normal authentication traffic (successes)", "Stale credentials, missing SPNs or encryption-type mismatches (failures)"]
steps = ["Filter on non-zero Result Codes and group them by account and client address", "For 0x7 register the SPN; for 0xE compare encryption types (see KDC events 14/16/27)"]

# src: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4798
# src: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-5379
# src: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-5156
[[entry]]
id = "event-security-noise"
providers = ["Microsoft-Windows-Security-Auditing"]
event_ids = [4798, 4799, 5058, 5059, 5061, 5379, 5156, 5158]
noise = "benign"
title = "High-volume audit record (usually harmless)"
explanation = "Routine audit events: group membership enumerated (4798/4799), key file and cryptographic operations (5058/5059/5061), Credential Manager credentials read (5379), firewall allowed a connection or bind (5156/5158). Healthy systems log them constantly."
causes = ["Normal Windows and application activity with detailed auditing enabled"]
steps = ["Filter them out when hunting for problems", "Only look closer if the process or account involved is unexpected"]

[[entry]]
id = "event-security-wfp-blocked"
providers = ["Microsoft-Windows-Security-Auditing"]
event_ids = [5152, 5157]
noise = "normal"
title = "Windows Filtering Platform blocked a packet or connection"
explanation = "The Windows firewall dropped a packet (5152) or blocked a connection (5157); the record names the process, direction, addresses and ports."
causes = ["A firewall rule or the default block policy", "Scans or unsolicited inbound traffic (often expected)"]
steps = ["If an application cannot connect, look for its process and port here at that time", "Fix or add the specific firewall rule instead of disabling the firewall"]

[[entry]]
id = "event-security-account-maintenance"
providers = ["Microsoft-Windows-Security-Auditing"]
event_ids = [4723, 4725, 4726, 4738, 4767]
noise = "normal"
title = "User account changed, disabled, deleted or unlocked"
explanation = "4723: password change attempt; 4725: account disabled; 4726: account deleted; 4738: account properties changed; 4767: account unlocked."
causes = ["Help-desk or administrative work, identity-management tooling", "Possible unauthorised change"]
steps = ["Check the Subject (who made the change) against expected administrators", "Correlate with 4740 lockouts and 4625 failed logons for the same account"]

[[entry]]
id = "event-eventlog-1104"
providers = ["Microsoft-Windows-Eventlog", "Eventlog"]
event_ids = [1104]
noise = "important"
title = "The Security log is full"
explanation = "The Security event log reached its maximum size and is set not to overwrite events, so new audit events are no longer recorded."
causes = ["Retention set to 'Do not overwrite events' with a small maximum size", "Unusually high audit volume"]
steps = ["Archive and clear the log, or switch retention to overwrite / archive automatically", "Raise the maximum size and trim noisy audit subcategories"]

# src: https://learn.microsoft.com/en-us/previous-versions/windows/it-pro/windows-10/security/threat-protection/auditing/event-4625
[[entry]]
id = "code-logon-substatus-more"
codes = ["0xc000015b", "0xc000005e", "0xc0000413", "0xc0000070", "0xc000006e", "0xc000018c", "0xc0000192", "0xc00000dc"]
noise = "normal"
title = "Logon failure reason code (rights, policy or domain problem)"
explanation = "0xC000015B logon type not granted (no 'Log on as a batch job/service/remotely' right) · 0xC000005E no logon servers available · 0xC0000413 blocked by an authentication firewall (selective authentication) · 0xC0000070 workstation restriction or authentication policy silo · 0xC000006E account restriction (e.g. blank password, Protected Users) · 0xC000018C trust with the other domain failed · 0xC0000192 Netlogon service not started · 0xC00000DC SAM server in the wrong state."
causes = ["User-rights assignment or authentication policy changed", "Domain controller or trust unreachable"]
steps = ["Combine the code with the logon type and account in the same event", "For 0xC000015B review User Rights Assignment (gpresult /h); for 0xC000005E / 0xC000018C check DC connectivity and trusts"]

# ---------------------------------------------------------------- Windows: Netlogon and domain membership
# src: https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/event-id-5722-logged-on-domain-controller
# src: https://jeffpar.github.io/kbarchive/kb/150/Q150518/
[[entry]]
id = "event-netlogon-trust"
providers = ["NETLOGON"]
event_ids = [3210, 5722, 5723, 5805]
patterns = ['trust relationship between this workstation and the primary domain failed']
codes = ["0xc000018d", "0x800706fd"]
noise = "important"
title = "Computer account secure channel broken (trust relationship failed)"
explanation = "The machine-account password no longer matches the one in Active Directory, so the computer cannot authenticate to the domain (3210 on the member; 5722/5723/5805 on the domain controller). Domain logons on that machine fail with 'The trust relationship between this workstation and the primary domain failed'."
causes = ["Machine restored from an old snapshot/backup, or a cloned VM", "Computer account reset or deleted, or another machine joined with the same name", "Replication delay right after a machine password change"]
steps = ["Check with 'nltest /sc_query:<domain>' or Test-ComputerSecureChannel", "Repair with 'Test-ComputerSecureChannel -Repair -Credential <admin>' (or netdom resetpwd); rejoin the domain if that fails", "Look for duplicate computer names in the directory"]

# src: https://support.microsoft.com/en-us/topic/how-to-manage-the-changes-in-netlogon-secure-channel-connections-associated-with-cve-2020-1472-f7e8cc17-0309-1d6a-304e-5ba73cd1a11e
[[entry]]
id = "event-netlogon-secure-rpc"
providers = ["NETLOGON"]
event_ids = [5827, 5828, 5829, 5830, 5831]
noise = "important"
title = "Vulnerable Netlogon secure channel connection (CVE-2020-1472 hardening)"
explanation = "A device used the Netlogon protocol without secure RPC. 5827/5828: the domain controller denied it (machine / trust account); 5829: it was allowed (only before enforcement); 5830/5831: allowed because of an explicit exception policy."
causes = ["Old or third-party devices (NAS, appliances, non-Windows domain members) without secure RPC support", "An exception group policy is still in place"]
steps = ["Identify the account/device named in the event and update or replace it", "Remove the allow-list exception once every device is compliant"]

[[entry]]
id = "event-netlogon-dc-dns"
providers = ["NETLOGON"]
event_ids = [5774, 5775, 5781]
noise = "important"
title = "Domain controller could not register its DNS records"
explanation = "Netlogon on a domain controller failed to register (5774/5781) or remove (5775) the SRV/A records that clients use to find domain controllers, so clients may not locate this DC."
causes = ["The DC points to a DNS server that does not host or accept updates for the AD zone", "DNS server unreachable, or the zone does not allow secure dynamic updates"]
steps = ["Check the DC's own DNS client settings (AD-integrated DNS servers only)", "Run 'dcdiag /test:dns' and re-register with 'nltest /dsregdns'"]

[[entry]]
id = "event-netlogon-5807"
providers = ["NETLOGON"]
event_ids = [5807]
noise = "normal"
title = "Clients connect from subnets that are not mapped to an AD site"
explanation = "Over the last hours clients connected from IP addresses that belong to no subnet defined in Active Directory Sites and Services, so they may authenticate against distant domain controllers. The addresses are listed in %SystemRoot%\\debug\\netlogon.log."
causes = ["New office, VPN or cloud subnets not added to AD Sites and Services"]
steps = ["Read netlogon.log for the client addresses", "Add the missing subnets to the correct site"]

# ---------------------------------------------------------------- Windows: Group Policy and time service
# src: https://learn.microsoft.com/en-us/troubleshoot/windows-server/group-policy/applying-group-policy-troubleshooting-guidance
# src: https://learn.microsoft.com/en-us/troubleshoot/windows-server/group-policy/userenv-errors-occur-events-are-logged
[[entry]]
id = "event-grouppolicy-dc-access"
providers = ["Microsoft-Windows-GroupPolicy"]
event_ids = [1058, 1053, 1054, 1055, 1006]
noise = "normal"
title = "Group Policy could not reach the domain controller or SYSVOL"
explanation = "Policy processing failed because Windows could not read a GPO's gpt.ini from SYSVOL (1058), resolve the user/computer name (1053/1055), find a domain controller (1054) or bind to Active Directory (1006). Policies are not refreshed until it works again."
causes = ["Network not ready yet at boot or logon, VPN not connected", "DNS pointing to non-domain DNS servers", "SYSVOL replication problems or wrong permissions on the GPO folder", "Kerberos problems (clock skew)"]
steps = ["Open the gpt.ini path from the 1058 message as the failing user/computer to reproduce", "Check DNS settings and DC connectivity (nltest /dsgetdc:<domain>)", "Run 'gpupdate /force' and 'gpresult /h report.html' once connectivity is fixed"]

[[entry]]
id = "event-grouppolicy-success"
providers = ["Microsoft-Windows-GroupPolicy"]
event_ids = [1500, 1501, 1502, 1503]
noise = "benign"
title = "Group Policy applied successfully"
explanation = "The computer or user policy was processed without errors: 1500/1501 found no changes since the last run, 1502/1503 applied new settings."
causes = ["Normal periodic or logon-time policy processing"]
steps = ["No action; useful as a marker that connectivity to the domain worked at that time"]

# src: https://learn.microsoft.com/en-us/troubleshoot/windows-server/active-directory/windows-time-service-event-ids-24-29-38
# src: https://learn.microsoft.com/en-us/windows-server/networking/windows-time-service/windows-time-service-tech-ref
[[entry]]
id = "event-time-service-no-source"
providers = ["Microsoft-Windows-Time-Service"]
event_ids = [24, 29, 38]
noise = "normal"
title = "Windows Time cannot reach a usable time source"
explanation = "NtpClient got no valid answer from its domain controller (24) or NTP peer (38), or none of its configured sources are reachable (29). The clock runs unsynchronised until a source answers."
causes = ["Network not ready at boot (harmless when a 35/37 event follows)", "UDP 123 blocked, wrong peer configured or the PDC emulator not serving time", "VM host time synchronisation conflicting with domain time"]
steps = ["Check for a later 35/37 event confirming synchronisation", "Run 'w32tm /query /status' and 'w32tm /query /source'", "On virtual domain controllers disable host time sync and use the domain hierarchy"]

[[entry]]
id = "event-time-service-50"
providers = ["Microsoft-Windows-Time-Service"]
event_ids = [50]
noise = "normal"
title = "Large clock difference detected — time service no longer synchronised"
explanation = "The clock deviated from its source by more than the threshold (5 s by default) for a long period, so Windows Time considers itself unsynchronised and stops serving time to other machines."
causes = ["Unreliable or distant time source, poor network", "VM pauses, snapshots or host time sync", "Hardware clock drift"]
steps = ["Measure the offset with 'w32tm /stripchart /computer:<source>'", "Give the PDC emulator reliable NTP sources; let members follow the domain hierarchy"]

[[entry]]
id = "event-time-service-pdc-12"
providers = ["Microsoft-Windows-Time-Service"]
event_ids = [12]
noise = "normal"
title = "PDC emulator has no time source above it"
explanation = "This machine is the forest-root PDC emulator but is set to follow the domain hierarchy, which has nothing above it, so it uses its own clock — and the whole forest follows that clock."
causes = ["External NTP never configured on the PDC emulator, or the role moved to another DC"]
steps = ["Configure external peers: w32tm /config /manualpeerlist:<ntp servers> /syncfromflags:manual /reliable:yes /update", "Restart the Windows Time service and verify with 'w32tm /query /status'"]

[[entry]]
id = "event-time-service-ok"
providers = ["Microsoft-Windows-Time-Service"]
event_ids = [35, 37]
noise = "benign"
title = "Windows Time is synchronising"
explanation = "The time service found a working source (35: now synchronising with it; 37: receiving valid time data). Often follows earlier 'no source' warnings, meaning they resolved."
causes = ["Normal operation"]
steps = ["No action needed"]

# ---------------------------------------------------------------- Windows: storage
# src: https://learn.microsoft.com/en-us/troubleshoot/windows-server/backup-and-storage/troubleshoot-data-corruption-and-disk-errors
# src: https://askbob.tech/understanding-storage-timeouts-and-event-129-errors/
[[entry]]
id = "event-storport-129"
providers = ["storahci", "stornvme", "storvsc", "storport", "iaStorA", "iaStorV", "LSI_SAS", "megasas"]
event_ids = [129]
noise = "important"
title = "Storage request timed out — device reset issued (event 129)"
explanation = "Storport sent a request to the disk and got no answer within the timeout, so it reset the device and retried all outstanding I/O. The provider is only the controller driver; the fault can be anywhere on the storage path. Expect freezes and slow I/O at these times."
causes = ["Failing or overloaded disk/SSD, firmware problems", "SAN, HBA or multipath issues; host storage latency for VMs", "Power management of the controller or device"]
steps = ["Look for disk 153/154 and WHEA events at the same time", "Update storage controller driver, disk firmware and BIOS", "For VMs and SANs check latency on the host or array at that moment"]

[[entry]]
id = "event-disk-hardware"
providers = ["disk"]
event_ids = [15, 154]
noise = "important"
title = "Disk not ready, or I/O failed with a hardware error"
explanation = "15: the device was not ready for access. 154: an I/O at a logical block address failed because of a hardware error. Data on that disk is at risk."
causes = ["Failing disk or SSD, loose cable or backplane", "Controller or SAN path failure"]
steps = ["Check SMART / vendor health tools and the controller log", "Back up the data and plan a replacement if the errors repeat"]

[[entry]]
id = "event-disk-157"
providers = ["disk"]
event_ids = [157]
noise = "normal"
title = "Disk was surprise-removed"
explanation = "A disk disappeared without being ejected: USB drive unplugged, SAN LUN unmapped, VM disk detached, or a storage path dropped."
causes = ["Removable disk unplugged", "Backup software attaching and detaching snapshot volumes (often harmless)", "Storage path failure"]
steps = ["If it was an internal or SAN disk, check cabling and storage paths", "Correlate with storport 129 and disk 153 events"]

[[entry]]
id = "event-ntfs-write-failed"
providers = ["Ntfs", "Microsoft-Windows-Ntfs"]
event_ids = [50, 57]
noise = "important"
title = "Delayed write failed / NTFS could not flush data"
explanation = "Windows could not write cached data to the volume (50 'Delayed Write Failed') or could not flush the NTFS transaction log (57). Recently written data may be lost and the volume may need checking."
causes = ["Disk or USB device removed or failing", "Network or SAN path lost for the volume", "Write caching enabled on removable media"]
steps = ["Check device and disk events at the same time", "Run chkdsk on the affected volume", "Eject removable drives safely; consider disabling write caching for them"]

[[entry]]
id = "event-ntfs-repaired"
providers = ["Ntfs", "Microsoft-Windows-Ntfs"]
event_ids = [130]
noise = "normal"
title = "NTFS repaired the file system structure"
explanation = "Self-healing NTFS fixed a corruption on the volume. The repair worked, but the corruption came from somewhere."
causes = ["Earlier unclean shutdown or storage errors"]
steps = ["Look for disk or storport errors around that time", "Run 'chkdsk /scan' if it keeps happening"]

# src: https://learn.microsoft.com/en-us/answers/questions/6060634/bsod-and-unexpected-shutdowns-with-volmgr-errors-4
# src: https://learn.microsoft.com/en-us/answers/questions/5893224/how-to-fix-dump-file-creation-failed-due-to-error
[[entry]]
id = "event-volmgr-dump"
providers = ["volmgr"]
event_ids = [45, 46, 49, 161]
noise = "normal"
title = "Crash dump could not be set up or written"
explanation = "Windows could not prepare or write a memory dump: 46 crash dump initialisation failed, 49 no suitable page file for dumps, 161 dump file creation failed during a crash. It is a symptom — the crash itself shows up as Kernel-Power 41 / BugCheck 1001."
causes = ["Page file disabled or too small for the selected dump type", "Not enough free space on the system drive", "Storage failing during the crash"]
steps = ["Check Startup and Recovery settings and that the system drive has a page file", "Free disk space or choose a smaller dump type", "Investigate the crash itself (drivers, power, storage)"]

# ---------------------------------------------------------------- Windows: Microsoft Defender Antivirus
# src: https://learn.microsoft.com/en-us/defender-endpoint/troubleshoot-microsoft-defender-antivirus
[[entry]]
id = "event-defender-detection"
providers = ["Microsoft-Windows-Windows Defender", "Microsoft Antimalware"]
event_ids = [1006, 1015, 1116]
noise = "important"
title = "Microsoft Defender detected malware or suspicious behaviour"
explanation = "The antivirus found malware or potentially unwanted software (1116, older platforms 1006) or suspicious behaviour (1015). The message names the threat, file path, process and user."
causes = ["A real infection or a downloaded/unpacked malicious file", "Potentially unwanted software or a false positive on an in-house tool"]
steps = ["Check whether a matching 1117 (action taken) follows; without it the threat may still be present", "Investigate the file path and process named in the event", "Submit false positives to Microsoft rather than adding broad exclusions"]

[[entry]]
id = "event-defender-action"
providers = ["Microsoft-Windows-Windows Defender", "Microsoft Antimalware"]
event_ids = [1007, 1117]
noise = "normal"
title = "Microsoft Defender took action on a threat"
explanation = "The antivirus quarantined, removed or allowed a detected item. An 'Allow' action means it was detected but not remediated because of the configured policy."
causes = ["Follow-up to a detection (1116/1006)"]
steps = ["Confirm the action is what you expect (quarantine/remove vs allow)", "Repeated detections of the same threat suggest something keeps re-creating it"]

[[entry]]
id = "event-defender-action-failed"
providers = ["Microsoft-Windows-Windows Defender", "Microsoft Antimalware"]
event_ids = [1008, 1118, 1119]
noise = "important"
title = "Microsoft Defender could not remediate a threat"
explanation = "Taking action on a detected threat failed (1118) or failed critically (1119; 1008 on older platforms). The item may still be active."
causes = ["The file is in use by a running process", "The threat sits inside an archive or container", "A restart is pending to finish the removal"]
steps = ["Restart if requested and run a full or offline scan", "Look for a later 1117 for the same threat, which means a retry worked"]

[[entry]]
id = "event-defender-protection-off"
providers = ["Microsoft-Windows-Windows Defender", "Microsoft Antimalware"]
event_ids = [5001, 5010, 5012]
noise = "important"
title = "Microsoft Defender protection was turned off"
explanation = "Real-time protection (5001), antispyware scanning (5010) or antivirus scanning (5012) was disabled."
causes = ["Administrator or policy change, another antivirus product taking over", "Possible tampering by malware"]
steps = ["Confirm whether a third-party antivirus is meant to be active", "Check who/what changed it (5007 configuration events) and re-enable protection"]

[[entry]]
id = "event-defender-config"
providers = ["Microsoft-Windows-Windows Defender", "Microsoft Antimalware"]
event_ids = [5007, 5013]
noise = "normal"
title = "Microsoft Defender configuration changed (or change blocked)"
explanation = "A Defender setting changed (5007, with old and new values) or tamper protection blocked a change (5013). New exclusions added unexpectedly are a classic sign of attacker evasion."
causes = ["Policy refresh (Intune/GPO), administrator change", "Possible tampering"]
steps = ["Read the changed registry path and new value", "Investigate unexpected exclusions or disabled features"]

[[entry]]
id = "event-defender-update-failed"
providers = ["Microsoft-Windows-Windows Defender", "Microsoft Antimalware"]
event_ids = [2001, 2003, 2004, 2006]
noise = "normal"
title = "Microsoft Defender update failed"
explanation = "Security intelligence (2001), engine (2003) or platform (2006) update failed, or the definitions could not be loaded and were reverted to the last good set (2004)."
causes = ["No access to the update source (proxy, firewall, WSUS approval)", "Disk space or corrupted update files"]
steps = ["Read the error code in the event", "Test 'MpCmdRun -SignatureUpdate' and the configured update sources"]

[[entry]]
id = "event-defender-rtp-error"
providers = ["Microsoft-Windows-Windows Defender", "Microsoft Antimalware"]
event_ids = [3002]
noise = "normal"
title = "Microsoft Defender real-time protection feature failed"
explanation = "A real-time protection component hit an error. A single 3002 followed by 3007 (recovered) is a transient fault; repeated ones mean protection is degraded."
causes = ["Conflict with another security product or filter driver", "Outdated or damaged Defender platform"]
steps = ["Check for a 3007 recovery event shortly after", "Update the Defender platform; remove conflicting security software"]

[[entry]]
id = "event-defender-status"
providers = ["Microsoft-Windows-Windows Defender", "Microsoft Antimalware"]
event_ids = [1000, 1001, 1002, 1150, 1151, 2000, 2002, 5000]
noise = "benign"
title = "Microsoft Defender routine status"
explanation = "Scan started/finished/stopped (1000/1001/1002), service healthy or health report (1150/1151), definitions or engine updated (2000/2002), real-time protection enabled (5000)."
causes = ["Normal operation"]
steps = ["No action needed"]

# ---------------------------------------------------------------- Windows: Windows Update and certificate enrollment
# src: https://patchreporter.com/docs/windows-update-event-ids-event-viewer
# src: https://learn.microsoft.com/en-us/troubleshoot/windows-client/installing-updates-features-roles/automatic-updates-cannot-download-updates-event-16
[[entry]]
id = "event-wu-scan-download-failed"
providers = ["Microsoft-Windows-WindowsUpdateClient"]
event_ids = [16, 25, 31]
noise = "normal"
title = "Windows Update could not connect, scan or download"
explanation = "16: the update service could not be reached. 25: checking for updates failed. 31: downloading an update failed. The error code in the message tells why (LogLens explains it below when known)."
causes = ["Proxy, firewall or DNS blocking the update source (Windows Update, WSUS, Configuration Manager)", "WSUS server problems or a stale client registration", "BITS or local download folder problems"]
steps = ["Look up the error code in the message", "Test the update source URL from the machine with the system proxy settings", "Check BITS and the SoftwareDistribution folder if downloads keep failing"]

[[entry]]
id = "event-wu-restart-required"
providers = ["Microsoft-Windows-WindowsUpdateClient"]
event_ids = [21, 22]
noise = "normal"
title = "Windows Update needs a restart"
explanation = "Installed updates need a restart to finish (21), or the restart is scheduled within minutes (22). Until then new updates are not installed."
causes = ["Updates installed that replace in-use files"]
steps = ["Plan the restart; a later User32 1074 / EventLog 6006 marks when it happened"]

# src: https://www.gradenegger.eu/en/details-of-the-event-with-id-64-of-the-source-microsoft-windows-certificate-services-client-autoenrollment/
# src: https://dev.to/adminpackstudio/certificate-autoenrollment-not-working-a-read-first-gpo-template-permission-ca-and-dcom-triage-4h86
[[entry]]
id = "event-cert-autoenroll-failed"
providers = ["Microsoft-Windows-CertificateServicesClient-AutoEnrollment"]
event_ids = [6, 13]
noise = "normal"
title = "Certificate autoenrollment failed"
explanation = "Automatic certificate enrollment for the machine or user failed (6), or a request for a specific template failed (13). The error code shows the reason, e.g. 0x800706BA when the CA cannot be reached over RPC."
causes = ["CA unreachable (network, firewall, DCOM permissions)", "No enroll/autoenroll permission on the certificate template", "Template not published on any CA"]
steps = ["Test the CA with 'certutil -ping'", "Check template permissions and that the template is issued by a CA", "Run 'certutil -pulse' to retry"]

[[entry]]
id = "event-cert-expiring"
providers = ["Microsoft-Windows-CertificateServicesClient-AutoEnrollment"]
event_ids = [64]
noise = "normal"
title = "A machine or user certificate is about to expire (or has expired)"
explanation = "A certificate in the local store is close to (or past) its expiry date and was not renewed automatically. The thumbprint is in the message."
causes = ["Certificate not issued from an autoenrollment template (manual or self-signed)", "Autoenrollment renewal failing"]
steps = ["Find the certificate by thumbprint (certlm.msc) and see which service uses it", "Renew or replace it before expiry; delete it if no longer used"]

# ---------------------------------------------------------------- Windows: IIS, WAS, HTTP.sys, ASP.NET events
# src: https://mvolo.com/where-did-my-iis7-server-go-troubleshooting-503-quotservice-unavailablequot-errors/
# src: https://github.com/lavanack/laurentvanacker.com/blob/master/Windows%20Powershell/IIS/IISEventIdLink.csv
[[entry]]
id = "event-was-identity"
providers = ["WAS"]
event_ids = [5021, 5057]
noise = "important"
title = "IIS application pool identity is invalid"
explanation = "WAS could not log on the application pool's identity (5021) and therefore disabled the pool (5057). The site returns 503 until fixed."
causes = ["Password of the custom identity changed or expired", "Account disabled/locked or missing the 'Log on as a batch job' right"]
steps = ["Re-enter the identity's credentials in the application pool's Advanced Settings", "Check the account status and its batch-logon right, then start the pool"]

[[entry]]
id = "event-was-5059"
providers = ["WAS"]
event_ids = [5059]
noise = "important"
title = "IIS application pool disabled after worker process start failures"
explanation = "WAS hit a failure while starting a worker process for the pool and disabled the pool; requests get 503."
causes = ["A global module or configuration error stops w3wp.exe from starting (see IIS-W3SVC-WP events)", "Identity or permission problems"]
steps = ["Look at Application log IIS-W3SVC-WP / WAS events just before this one", "Fix the cause, then start the application pool"]

[[entry]]
id = "event-was-config"
providers = ["WAS"]
event_ids = [5172, 5189]
noise = "important"
title = "IIS could not read or generate its configuration"
explanation = "WAS could not read applicationHost.config (5172) or could not write the per-pool configuration file (5189). Affected application pools cannot start."
causes = ["Malformed XML after a manual edit or failed deployment", "Permissions or antivirus locking the config or temp\\appPools folder"]
steps = ["Read the file and line number in the message; restore from %SystemDrive%\\inetpub\\history if needed", "Check permissions on %SystemDrive%\\inetpub\\temp\\appPools and antivirus exclusions"]

# src: https://guidesharepoint.wordpress.com/2020/01/15/eventid-2280-http-error-503-the-service-is-unavailable/
# src: https://mskb.pkisolutions.com/kb/970259
[[entry]]
id = "event-iis-module-load"
providers = ["Microsoft-Windows-IIS-W3SVC-WP"]
event_ids = [2276, 2280, 2281, 2282]
noise = "important"
title = "IIS worker process could not load a module"
explanation = "A native module listed in IIS configuration failed to load (2280/2282) or the worker process could not initialise (2276/2281). The application pool usually stops and the site returns 503."
causes = ["Module listed in <globalModules> but its DLL is missing or uninstalled", "32-bit application pool loading a 64-bit-only module (missing bitness precondition)", "Module installed to a different path after a reinstall"]
steps = ["Read the DLL path and error in the message (0x7E = file not found, 0xC1 = bitness mismatch)", "Install/repair the feature that provides the module, or remove the stale <globalModules> entry", "Add a bitness64/bitness32 precondition when pools of both bitness share the server"]

[[entry]]
id = "event-iis-config-read"
providers = ["Microsoft-Windows-IIS-W3SVC-WP"]
event_ids = [2297, 2307]
noise = "important"
title = "IIS worker process could not read configuration"
explanation = "The worker process for an application pool could not read global module configuration (2297) or its configuration file (2307). Requests to that pool fail."
causes = ["Malformed web.config / applicationHost.config", "Access denied on the configuration or temp appPools folder (0x80070005)"]
steps = ["Read the error text and file path in the message", "Fix the XML or the folder permissions, then recycle the pool"]

# src: https://www.veritas.com/support/en_US/article.100032931
# src: http://blog.tofte-it.dk/event-15021-an-error-occurred-while-using-ssl-configuration-for-endpoint-0-0-0-0443/
[[entry]]
id = "event-httpevent-binding"
providers = ["HttpEvent", "Microsoft-Windows-HttpEvent"]
event_ids = [15005, 15021]
noise = "important"
title = "HTTP.sys could not bind an endpoint or use its TLS configuration"
explanation = "15005: HTTP.sys could not bind to an IP/port (another process holds it, or the IP listen list names a missing address). 15021: the SSL binding for an endpoint is broken (certificate missing, private key inaccessible). HTTPS on that endpoint fails."
causes = ["Another program listening on the port, or a stale IP listen list", "Certificate referenced by the SSL binding was deleted, renewed or lacks a private key"]
steps = ["Check bindings with 'netsh http show sslcert' and 'netsh http show iplisten'", "Re-bind the renewed certificate in IIS or with netsh", "Find the port owner with 'netstat -ano'"]

# src: https://learn.microsoft.com/en-us/troubleshoot/developer/webapps/iis/site-behavior-performance/http-error-500-when-you-visit-web-site
[[entry]]
id = "event-aspnet-1310"
providers = ["ASP.NET"]
event_ids = [1310]
noise = "important"
title = "ASP.NET configuration error"
explanation = "An ASP.NET (Framework) application could not start or process requests because of a configuration error; the message shows the file, line and reason."
causes = ["Invalid web.config (typo, unknown section, missing assembly for a section handler)", "Config transform or deployment produced wrong values"]
steps = ["Read the 'Exception information' and file/line in the message", "Validate web.config and the referenced assemblies, then recycle the pool"]

[[entry]]
id = "event-app-error-1005"
providers = ["Application Error"]
event_ids = [1005]
noise = "important"
title = "Program closed because Windows could not access its file"
explanation = "Windows closed a program because it could not read an executable or DLL it needed — a network, disk or storage-driver problem, or the disk disappeared."
causes = ["Program runs from a network share that dropped", "Disk or storage path failing"]
steps = ["Check network-share availability and disk/storport events at that time", "Run programs from local disk where possible"]

# ---------------------------------------------------------------- Windows: Task Scheduler
# src: https://docs.dynatrace.com/docs/observe/infrastructure-observability/extensions/windows-scheduled-tasks
# src: https://mnaoumov.wordpress.com/2014/05/15/task-scheduler-event-ids/
[[entry]]
id = "event-task-start-failed"
providers = ["Microsoft-Windows-TaskScheduler"]
event_ids = [101, 103, 104, 203]
noise = "important"
title = "Scheduled task could not start"
explanation = "Task Scheduler could not start the task (101), its action (103/203) or log on its account (104). The 'Error Value' is usually a Windows error code (e.g. 2147942402 = 0x80070002 file not found, 2147943726 = 0x8007052E bad user name or password)."
causes = ["Stored password of the task account changed or expired", "Program path or working directory wrong / missing", "Account lacks 'Log on as a batch job'"]
steps = ["Convert the error value to hex and look it up", "Re-enter the task's credentials and check the action path", "Run the action manually as the same account to reproduce"]

[[entry]]
id = "event-task-skipped"
providers = ["Microsoft-Windows-TaskScheduler"]
event_ids = [322, 332]
noise = "normal"
title = "Scheduled task launch was skipped"
explanation = "The trigger fired but the task did not start: an instance was still running (322) or the user was not logged on (332)."
causes = ["Previous run takes longer than the schedule interval", "Task set to run only when the user is logged on"]
steps = ["Check the duration of previous runs (events 100/102)", "Adjust 'If the task is already running' or 'Run whether user is logged on or not'"]

[[entry]]
id = "event-task-terminated"
providers = ["Microsoft-Windows-TaskScheduler"]
event_ids = [111, 329]
noise = "normal"
title = "Scheduled task was terminated (time limit or stop)"
explanation = "Task Scheduler stopped a running instance because it exceeded its time limit (329) or because it was terminated (111)."
causes = ["Task runs longer than 'Stop the task if it runs longer than'", "Hung action"]
steps = ["Find out why the run took longer (the action's own log)", "Raise the time limit only if the duration is legitimate"]

[[entry]]
id = "event-task-completed"
providers = ["Microsoft-Windows-TaskScheduler"]
event_ids = [201, 202]
noise = "normal"
title = "Scheduled task action finished — check the return code"
explanation = "The action completed (201) or failed (202). The return code matters: 0 is success; large numbers are HRESULTs in decimal (2147942401 = 0x80070001, 2147942402 = 0x80070002 file not found); other values are the program's own exit code."
causes = ["Normal completion, or the program reported a failure through its exit code"]
steps = ["Treat non-zero return codes as failures and check the program's own log", "Convert large values to hex to look them up"]

[[entry]]
id = "event-task-info"
providers = ["Microsoft-Windows-TaskScheduler"]
event_ids = [100, 102, 106, 107, 110, 129, 140, 141, 200]
noise = "benign"
title = "Scheduled task lifecycle record"
explanation = "Informational Task Scheduler events: task registered/updated/deleted (106/140/141), triggered (107/110), process created (129), action/task started (200/100) and completed (102)."
causes = ["Normal operation"]
steps = ["Useful for building a timeline of what ran when"]

