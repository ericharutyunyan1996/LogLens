[[entry]]
id = "event-ad-ldap-signing"
providers = ["Microsoft-Windows-ActiveDirectory_DomainService"]
event_ids = [2886, 2887, 2889]
noise = "normal"
title = "Clients use unsigned or clear-text LDAP binds"
explanation = "The domain controller does not require LDAP signing (2886), counted unsigned / clear-text binds in the last 24 hours (2887), or logged the client doing one (2889, with diagnostic logging enabled). These clients break once signing is enforced."
causes = ["Applications or appliances binding over plain LDAP (port 389) with simple binds"]
steps = ["Enable LDAP interface diagnostic logging to get 2889 with client IPs", "Move those clients to LDAPS or signed SASL binds before enforcing signing"]

# src: https://learn.microsoft.com/en-us/troubleshoot/windows-server/networking/dfsr-event-id-2213
# src: https://learn.microsoft.com/en-us/troubleshoot/windows-server/networking/troubleshoot-missing-sysvol-and-netlogon-shares
[[entry]]
id = "event-dfsr-stopped"
providers = ["DFSR"]
event_ids = [2213, 4012]
noise = "important"
title = "DFS Replication stopped on a volume or folder"
explanation = "2213: DFSR stopped replicating on a volume after an unexpected shutdown (dirty database) and waits for manual resume. 4012: replication of a folder stopped because this member was disconnected longer than MaxOfflineTimeInDays. SYSVOL / shared folders are no longer kept in sync."
causes = ["Unclean shutdown or crash of the server (2213)", "Server offline or replication broken for weeks (4012)"]
steps = ["For 2213 resume with the WMI command given in the event message", "For 4012 perform a non-authoritative sync of the folder (or authoritative if this is the only good copy)", "Check 'dfsrdiag backlog' afterwards"]

[[entry]]
id = "event-dfsr-partner"
providers = ["DFSR"]
event_ids = [5002, 5008, 5014]
noise = "normal"
title = "DFS Replication cannot talk to a partner"
explanation = "DFSR hit an error communicating with a replication partner (5002/5008) or the connection was interrupted and will be retried (5014). Short outages self-heal."
causes = ["Network, firewall or RPC problems between members", "Partner offline or rebooting"]
steps = ["If it persists, test RPC connectivity to the partner and check its DFSR log", "Watch the backlog with 'dfsrdiag backlog'"]

# src: https://learn.microsoft.com/en-us/answers/questions/1381751/how-to-fix-hyper-v-event-id-18590
# src: https://learn.microsoft.com/en-us/troubleshoot/windows-server/virtualization/vm-shutdown-actions-not-run
[[entry]]
id = "event-hyperv-guest-crash"
providers = ["Microsoft-Windows-Hyper-V-Worker"]
event_ids = [18560, 18590]
noise = "important"
title = "Hyper-V virtual machine crashed or was reset by a fatal guest error"
explanation = "The guest OS reported a fatal error (18590, with the guest's bug-check code in ErrorCode0) or the VM was reset after an unrecoverable processor fault such as a triple fault (18560)."
causes = ["Blue screen / kernel panic inside the guest (drivers, memory, disk)", "Unsupported guest OS configuration or integration services", "Host hardware problems"]
steps = ["Read ErrorCode0 as a bug-check code and analyse the guest's own crash dump", "Check the guest's event log / kernel log after it restarts", "Look for host WHEA or storage errors at the same time"]

# src: https://learn.microsoft.com/en-us/troubleshoot/windows-server/licensing-and-activation/troubleshoot-activation-error-codes
[[entry]]
id = "code-activation-failed"
providers = ["Microsoft-Windows-Security-SPP"]
event_ids = [8198]
codes = ["0xc004f074", "0xc004f038", "0xc004c003", "0xc004f050"]
patterns = ['No Key Management Service \(KMS\) could be contacted']
noise = "normal"
title = "Windows activation failed"
explanation = "License activation failed. 0xC004F074: no KMS host could be contacted; 0xC004F038: the KMS host does not have enough activation requests yet (count too low); 0xC004C003: product key blocked; 0xC004F050: invalid product key."
causes = ["KMS host unreachable (DNS _vlmcs SRV record, firewall TCP 1688)", "Too few clients for KMS to start activating", "Wrong or blocked product key"]
steps = ["Run 'slmgr /dlv' and 'slmgr /ato' to see the current state", "Check 'nslookup -type=srv _vlmcs._tcp' and connectivity to the KMS host on TCP 1688"]

# ---------------------------------------------------------------- Windows error codes (Win32 / HRESULT / NTSTATUS)
# src: https://learn.microsoft.com/en-us/windows/win32/debug/system-error-codes--0-499-
# src: https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-erref/1bc92ddf-b79e-413c-bbaa-99a5281a6c90
# src: https://learn.microsoft.com/en-us/troubleshoot/windows-client/installing-updates-features-roles/common-windows-update-errors
[[entry]]
id = "code-rpc-unavailable"
codes = ["0x800706ba", "0x800706d9"]
patterns = ['The RPC server is unavailable', 'There are no more endpoints available from the endpoint mapper']
noise = "important"
title = "RPC server unavailable / no endpoints available"
explanation = "A remote procedure call could not reach the target: the machine or service is down, the name resolves wrongly, or a firewall blocks TCP 135 or the dynamic RPC ports (0x800706BA). 0x800706D9 means the endpoint mapper knows no listener for the requested service."
causes = ["Target computer offline or the service (e.g. a CA, WMI, DCOM server) not running", "Firewall blocking TCP 135 and the dynamic port range 49152-65535", "DNS returning a wrong address for the target"]
steps = ["Test 'Test-NetConnection <host> -Port 135' and resolve the name with nslookup", "Check that the target service is running", "Allow RPC endpoint mapper and dynamic ports between the two machines"]

[[entry]]
id = "code-rpc-call-failed"
codes = ["0x800706be", "0x800706bf"]
patterns = ['The remote procedure call failed']
noise = "normal"
title = "Remote procedure call failed"
explanation = "An RPC call reached the server but failed while running, or the connection broke mid-call (0x800706BE); 0x800706BF means it failed and did not execute."
causes = ["Server process crashed or restarted during the call", "Network interruption or RPC traffic filtered mid-session", "Corrupted component (Windows servicing reports this for broken update packages)"]
steps = ["Check the server side for crashes at that time", "Retry; if it repeats, trace the specific operation (e.g. DISM/CBS log for servicing)"]

[[entry]]
id = "code-class-not-registered"
codes = ["0x80040154"]
patterns = ['\bClass not registered\b']
noise = "important"
title = "COM class not registered"
explanation = "A program asked COM for a component (CLSID) that is not registered for its architecture. Classic case: a 64-bit process needs a COM component that is only registered for 32-bit (or the reverse)."
causes = ["Component not installed or its registration removed", "32-bit vs 64-bit mismatch between caller and component (IIS 'Enable 32-Bit Applications', AnyCPU builds)"]
steps = ["Find the CLSID in the error and check HKCR\\CLSID and HKCR\\WOW6432Node\\CLSID", "Install/register the component for the caller's bitness, or run the caller in the matching bitness"]

[[entry]]
id = "code-e-fail"
codes = ["0x80004005"]
noise = "normal"
title = "0x80004005 — unspecified failure (E_FAIL)"
explanation = "A generic 'something failed' HRESULT with no specific reason. In .NET it is the HResult of Win32Exception and SocketException, so the real cause is in the accompanying message or native error code."
causes = ["Depends entirely on the component reporting it"]
steps = ["Read the text and any inner exception or native error code next to it", "Look at the component's own detailed log (e.g. CBS.log, setupact.log, application log)"]

[[entry]]
id = "code-access-denied-hresult"
codes = ["0x80070005", "0xc0000022"]
noise = "important"
title = "Access denied (0x80070005 / STATUS_ACCESS_DENIED)"
explanation = "The calling account lacks permission on a file, registry key, service, COM object or remote resource. In .NET this is UnauthorizedAccessException."
causes = ["Service/app pool account lacks rights", "UAC: process not elevated", "Antivirus or policy blocking the access", "Changed file system or registry permissions (Windows Update servicing)"]
steps = ["Identify the exact object (Process Monitor filtered on 'ACCESS DENIED' shows it)", "Grant the minimum required right to the account the process runs as"]

[[entry]]
id = "code-file-not-found-hresult"
codes = ["0x80070002", "0x80070003", "0xc0000034", "0xc000003a"]
noise = "normal"
title = "File or path not found (0x80070002 / 0x80070003)"
explanation = "The system could not find the file (0x80070002 / 0xC0000034) or a folder in the path (0x80070003 / 0xC000003A). Also the HResult of .NET FileNotFoundException / DirectoryNotFoundException."
causes = ["Wrong path in configuration, missing deployment files", "Relative path resolved against an unexpected working directory", "Drive mapping not available for a service account"]
steps = ["Log the full path the program tried", "Use UNC or absolute paths for services and scheduled tasks"]

[[entry]]
id = "code-invalid-argument"
codes = ["0x80070057"]
noise = "normal"
title = "0x80070057 — the parameter is incorrect (E_INVALIDARG)"
explanation = "A function received an invalid argument. In .NET this is the HResult of ArgumentException; in Windows tools it often means bad input such as an invalid path, product key or setting."
causes = ["Invalid value passed by the caller or read from configuration"]
steps = ["Check the parameter named in the message or exception", "Validate the configuration value being used"]

[[entry]]
id = "code-bad-image-format"
codes = ["0x8007000b", "0x800700c1", "0xc000007b"]
patterns = ['is not a valid Win32 application', 'An attempt was made to load a program with an incorrect format']
noise = "important"
title = "Wrong binary architecture (32-bit / 64-bit mismatch)"
explanation = "A program tried to load an executable or DLL built for another architecture or a damaged binary (0x8007000B / 0x800700C1 / 0xC000007B 'The application was unable to start correctly'). In .NET this is BadImageFormatException."
causes = ["64-bit process loading a 32-bit native DLL or the reverse (IIS 'Enable 32-Bit Applications')", "Mixed versions of a native dependency on PATH", "Corrupted or partially downloaded file"]
steps = ["Check the bitness of the process and of the DLL (dumpbin /headers or a dependency viewer)", "Install the matching runtime/driver bitness or change the process bitness"]

[[entry]]
id = "code-module-not-found"
codes = ["0x8007007e", "0xc06d007e"]
patterns = ['The specified module could not be found']
noise = "important"
title = "DLL (module) could not be found"
explanation = "A DLL that the program loads directly or that one of its dependencies needs was not found on the search path (0x8007007E; 0xC06D007E for delay-loaded DLLs)."
causes = ["Missing Visual C++ / native runtime or a dependency of a native library", "PATH differences between the user and the service account", "Wrong-bitness copy found first"]
steps = ["Find the missing dependency with a dependency viewer or Process Monitor (NAME NOT FOUND on .dll)", "Install the required runtime or ship the DLL next to the executable"]

[[entry]]
id = "code-procedure-not-found"
codes = ["0x8007007f", "0xc0000139", "0xc06d007f"]
patterns = ['The specified procedure could not be found']
noise = "important"
title = "Entry point / procedure not found in a DLL"
explanation = "A DLL was found but does not export the function the program expects — usually a version mismatch between the program and that DLL."
causes = ["Older or newer version of a DLL picked up from PATH or the system folder", "Partially updated application or runtime"]
steps = ["Check which copy of the DLL is loaded (Process Monitor / listdlls)", "Reinstall the application or runtime so all files match"]

[[entry]]
id = "code-insufficient-resources"
codes = ["0xc000009a", "0x800705aa", "0x800705af", "0xc000012d", "0x80070008", "0xc0000017"]
patterns = ['Insufficient system resources exist to complete the requested service', 'The paging file is too small for this operation to complete', 'Not enough memory resources are available to process this command']
noise = "important"
title = "Windows ran out of memory or kernel resources"
explanation = "The system could not allocate memory or kernel resources: commit limit reached / page file too small (0x800705AF, 0xC000012D), insufficient system resources such as paged/nonpaged pool or handles (0xC000009A, 0x800705AA), or not enough memory (0x80070008, 0xC0000017)."
causes = ["A process or driver leaking memory, handles or pool", "Page file too small or disabled for the workload", "32-bit process address-space exhaustion"]
steps = ["Check commit charge and the top processes (Resource-Exhaustion-Detector 2004 events list them)", "Look for growing handle counts or pool usage (Task Manager, poolmon)", "Size the page file properly before adding RAM"]

[[entry]]
id = "code-io-device-error"
codes = ["0x8007045d", "0xc0000185", "0x80070017", "0xc000009c", "0xc0000006", "0x80070571", "0x80070570"]
patterns = ['The request could not be performed because of an I/O device error', 'Data error \(cyclic redundancy check\)', 'The disk structure is corrupted and unreadable', 'The file or directory is corrupted and unreadable']
noise = "important"
title = "I/O device error or disk/file corruption"
explanation = "Reading or writing failed at the storage level: I/O device error (0x8007045D / 0xC0000185), CRC data error (0x80070017 / 0xC000009C), paging I/O failed (0xC0000006), or the file system structure / file is corrupted (0x80070571 / 0x80070570)."
causes = ["Failing disk, cable, controller or USB device", "Network share dropped while a program ran from it (in-page errors)", "File system corruption after crashes"]
steps = ["Check disk, storport and Ntfs events at the same time", "Run chkdsk on the volume and check drive health", "Copy important data off the device first"]

[[entry]]
id = "code-semaphore-timeout"
codes = ["0x80070079"]
patterns = ['The semaphore timeout period has expired']
noise = "normal"
title = "Semaphore timeout — network or storage path did not respond"
explanation = "Despite the name, this (Win32 error 121) usually means an SMB/network connection or storage path stopped responding during an operation."
causes = ["Network drop, VPN or Wi-Fi interruption, NIC offload or driver issues", "Overloaded file server or SAN"]
steps = ["Check network stability and NIC drivers on both ends", "Look at the file server / storage latency at that time"]

[[entry]]
id = "code-network-path"
codes = ["0x80070035", "0x80070043", "0x800704cf", "0x80070040"]
patterns = ['The network path was not found', 'The network name cannot be found', 'The network location cannot be reached', 'The specified network name is no longer available']
noise = "normal"
title = "Network path / share not reachable"
explanation = "A UNC path or share could not be reached: the server name was not found (0x80070035), the share does not exist (0x80070043), the location is unreachable (0x800704CF), or an open connection was dropped (0x80070040)."
causes = ["File server down, wrong server/share name, DNS failure", "SMB blocked by firewall (TCP 445)", "Connection dropped by the server or network mid-operation"]
steps = ["Test 'Test-NetConnection <server> -Port 445' and open the UNC path as the same account", "Check share names and DNS records for the server"]

[[entry]]
id = "code-logon-failure-win32"
codes = ["0x8007052e", "0x80070569", "0x80070534", "0x80070532"]
patterns = ['The user name or password is incorrect', 'unknown user name or bad password', 'has not been granted the requested logon type', 'No mapping between account names and security IDs was done']
noise = "important"
title = "Logon failed: bad credentials, missing logon right or unknown account"
explanation = "Windows refused a logon: wrong user name or password (0x8007052E), the account lacks the needed logon right such as batch or service logon (0x80070569), an account name could not be translated to a SID (0x80070534), or the password expired (0x80070532)."
causes = ["Stale password stored in a service, task, app pool or connection string", "User-rights assignment removed by Group Policy", "Account deleted/renamed or domain unreachable"]
steps = ["Verify the account and update the stored password", "Check 'Log on as a service / batch job' assignments with gpresult", "For SID mapping errors confirm the account still exists and the domain is reachable"]

[[entry]]
id = "code-service-control"
codes = ["0x80070422", "0x8007041d", "0x8007042c", "0x8007042d", "0x80070424"]
patterns = ['The service cannot be started, either because it is disabled', 'The service did not respond to the start or control request in a timely fashion', 'The dependency service or group failed to start', 'The service did not start due to a logon failure', 'The specified service does not exist as an installed service']
noise = "normal"
title = "Windows service could not be controlled (disabled, timeout, dependency, logon, missing)"
explanation = "Starting or controlling a service failed: it is disabled (1058 / 0x80070422, e.g. Windows Update), did not respond in time (1053), a dependency failed (1068), its account could not log on (1069) or it is not installed (1060)."
causes = ["Service disabled by policy or hardening scripts", "Slow or hung service start", "Broken dependency or service account password"]
steps = ["Check the service's start type and state (services.msc / sc qc <name>)", "See Service Control Manager events 7000/7009/7038 for details"]

[[entry]]
id = "code-wait-timeout"
codes = ["0x80070102", "0x800705b4"]
patterns = ['The wait operation timed out', 'This operation returned because the timeout period expired']
noise = "normal"
title = "Wait operation timed out (Win32 258 / 1460)"
explanation = "An operation waited longer than its timeout. In SQL client stacks 'Win32Exception (258): The wait operation timed out' is the network-level part of a query or connection timeout."
causes = ["Slow or blocked remote side (database, service)", "Network latency or packet loss", "Timeout configured too short"]
steps = ["Find what the caller was waiting for (inner exception / surrounding lines)", "Check the remote side's load and blocking at that time"]

[[entry]]
id = "code-operation-aborted"
codes = ["0x800703e3", "0x800704c7"]
patterns = ['The I/O operation has been aborted because of either a thread exit or an application request']
noise = "normal"
title = "Operation aborted or cancelled (Win32 995 / 1223)"
explanation = "Pending I/O was cancelled because the socket/handle was closed or the thread ended (995), or the operation was cancelled by the user/caller (1223). Often a side effect of shutdown, a client disconnect or a timeout elsewhere."
causes = ["Client disconnected or the request was cancelled", "Application shutting down / recycling while I/O was pending"]
steps = ["Check what closed the connection first (client, timeout, recycle)", "Treat as noise if it only happens during shutdown"]

# src: https://learn.microsoft.com/en-us/troubleshoot/windows-client/installing-updates-features-roles/common-windows-update-errors
# src: https://learn.microsoft.com/en-us/windows/deployment/update/windows-update-error-reference
[[entry]]
id = "code-wu-network"
codes = ["0x8024402c", "0x8024401c", "0x80244022", "0x8024401b", "0x80244017", "0x80244018", "0x80244019", "0x8024401f", "0x80244021", "0x80244023", "0x80240438", "0x80244007", "0x80244010", "0x80246007", "0x80200053", "0x80d02002"]
noise = "normal"
title = "Windows Update could not talk to its update source"
explanation = "Windows Update's HTTP layer failed: proxy/host name not resolved (0x8024402C), HTTP status from the server or proxy (0x80244017 401, 0x80244018 403, 0x80244019 404, 0x8024401B 407 proxy auth, 0x8024401C 408, 0x8024401F 500, 0x80244021 502, 0x80244022 503, 0x80244023 504), endpoint unreachable (0x80240438), WSUS SOAP fault (0x80244007), too many round trips (0x80244010) or a failed/invalid download (0x80246007, 0x80200053, 0x80D02002)."
causes = ["Proxy or firewall blocking the update endpoints", "WSUS / Configuration Manager server overloaded or misconfigured", "Content filtering devices altering downloads"]
steps = ["Check the WinHTTP proxy ('netsh winhttp show proxy') and reachability of the update source", "On WSUS check the IIS app pool (WsusPool) and server health", "Retry after fixing; 'Get-WindowsUpdateLog' gives the detailed client log"]

[[entry]]
id = "code-wu-policy"
codes = ["0x8024002e"]
noise = "normal"
title = "Windows Update access is disabled by policy"
explanation = "Access to the update service is disabled (0x8024002E), usually by a policy that forbids contacting Windows Update directly while a managed source is expected."
causes = ["Group Policy / MDM settings such as 'Do not connect to any Windows Update Internet locations' or 'Remove access to use all Windows Update features'"]
steps = ["Review applied Windows Update policies with gpresult", "Point the client at its managed source or relax the policy"]

[[entry]]
id = "code-wu-component-store"
codes = ["0x80073712", "0x800f0831", "0x80073701", "0x8007371b", "0x800f0825"]
patterns = ['The component store has been corrupted']
noise = "important"
title = "Windows component store is corrupted"
explanation = "Servicing found missing or damaged components in the component store (WinSxS), so updates or features cannot be installed or removed."
causes = ["Interrupted or partially installed earlier update", "Disk or file corruption", "Manual cleanup of WinSxS"]
steps = ["Run 'DISM /Online /Cleanup-Image /RestoreHealth' then 'sfc /scannow'", "If DISM cannot find sources, give it matching installation media with /Source", "Check CBS.log for the first failing component"]

[[entry]]
id = "code-wu-reboot-pending"
codes = ["0x80070bc9", "0x80242014", "0x80070bc2"]
noise = "normal"
title = "Update operation waits for (or failed because of) a pending restart"
explanation = "A previous update needs a restart to finish (0x80242014, 0x80070BC2) or the operation failed and requires a restart to roll back (0x80070BC9). New installs are blocked until the machine restarts."
causes = ["Restart postponed after updates", "TrustedInstaller start type forced to Manual by policy, so pending operations never complete"]
steps = ["Restart the machine and retry", "If it keeps coming back, check that the TrustedInstaller service start type is not forced by Group Policy"]

[[entry]]
id = "code-wu-install-failed"
codes = ["0x80240022", "0x800f0922", "0x800f0821", "0x800f0920"]
noise = "normal"
title = "Windows update installation failed"
explanation = "0x80240022: all updates in the batch failed (often antivirus blocking servicing folders). 0x800F0922: installers failed (e.g. too small system-reserved partition, licensing folder permissions, VPN). 0x800F0821 / 0x800F0920: the servicing operation took too long and was aborted."
causes = ["Security software interfering with servicing", "Too few resources (CPU/RAM/disk) on the machine or VM", "Low space on the system reserved / EFI partition"]
steps = ["Check CBS.log and WindowsUpdate logs for the first error", "Temporarily exclude servicing folders from antivirus and give the VM more resources", "Retry after a clean restart"]

# src: https://github.com/dotnet/runtime/blob/main/src/libraries/Common/src/System/HResults.cs
[[entry]]
id = "code-dotnet-hresults"
codes = ["0x80131500", "0x80131501", "0x80131502", "0x80131505", "0x80131508", "0x80131509", "0x80131513", "0x80131515", "0x80131516", "0x80131522", "0x80131530", "0x80131534", "0x80131537", "0x80131539", "0x8013153b", "0x80131577", "0x80131604", "0x80131620", "0x80131622", "0x80004002", "0x80004003", "0x80020012", "0x800703e9"]
noise = "normal"
title = ".NET exception HResult"
explanation = "HResult of a .NET exception: 0x80131500 Exception, 0x80131501 SystemException, 0x80131502 ArgumentOutOfRange, 0x80131505 Timeout, 0x80131508 IndexOutOfRange, 0x80131509 InvalidOperation, 0x80131513 MissingMethod, 0x80131515 NotSupported, 0x80131516 Overflow, 0x80131522 TypeLoad, 0x80131530 ThreadAbort, 0x80131534 TypeInitialization, 0x80131537 Format, 0x80131539 PlatformNotSupported, 0x8013153B OperationCanceled / TaskCanceled, 0x80131577 KeyNotFound, 0x80131604 TargetInvocation (see inner exception), 0x80131620 IOException, 0x80131622 ObjectDisposed, 0x80004002 InvalidCast, 0x80004003 NullReference, 0x80020012 DivideByZero, 0x800703E9 StackOverflow."
causes = ["The exception named by the code was thrown and logged"]
steps = ["Use the exception type and message next to it; for TargetInvocation look at the inner exception", "Find the first stack frame from your own code"]

[[entry]]
id = "code-dotnet-assembly-load"
codes = ["0x80131040", "0x80131621"]
noise = "important"
title = ".NET assembly version mismatch / load failure"
explanation = "0x80131040: the located assembly's manifest does not match the requested reference (version, culture or public key). 0x80131621: the assembly was found but could not be loaded (FileLoadException)."
causes = ["A different version of a DLL deployed than the one referenced", "Missing or wrong binding redirect (.NET Framework)", "Strong-name or publisher policy mismatch"]
steps = ["Compare the requested and found versions in the message", "Fix the deployment or add a binding redirect; enable fusion logging to see probing"]

# ---------------------------------------------------------------- Windows bug checks (blue screens)
# src: https://learn.microsoft.com/en-us/windows-hardware/drivers/debugger/bug-check-code-reference2
# Matches the 'The bugcheck was: 0x...' text of BugCheck 1001, WinDbg 'BugCheck XX, {...}' lines, the decimal
# BugcheckCode of Kernel-Power 41 event data and the symbolic names.
[[entry]]
id = "code-bugcheck-driver-fault"
patterns = ['\bbug ?check(?: was| code)?:? *(?:0x0*|(?=[0-9a-f]+, \{))(?:a|d1|1e|3b|7e|8e|50)\b', 'BugcheckCode"?\s*[:=]\s*"?(?:10|209|30|59|126|142|80)\b', '\b(?:DRIVER_)?IRQL_NOT_LESS_OR_EQUAL\b', '\b(?:SYSTEM_THREAD|KMODE|KERNEL_MODE)_EXCEPTION_NOT_HANDLED\b', '\bSYSTEM_SERVICE_EXCEPTION\b', '\bPAGE_FAULT_IN_NONPAGED_AREA\b']
noise = "important"
title = "Blue screen caused by a kernel-mode fault (usually a driver)"
explanation = "Bug checks 0xA / 0xD1 (IRQL_NOT_LESS_OR_EQUAL), 0x1E / 0x7E / 0x8E (exception not handled), 0x3B (SYSTEM_SERVICE_EXCEPTION) and 0x50 (PAGE_FAULT_IN_NONPAGED_AREA) mean kernel code accessed invalid memory or raised an unhandled exception. A driver is the usual suspect; faulty RAM is the second."
causes = ["Buggy, outdated or incompatible driver (often recently installed/updated: antivirus, VPN, storage, graphics)", "Faulty memory or unstable overclock", "Corrupted system files"]
steps = ["Analyse the dump (WinDbg '!analyze -v') to see the faulting module", "Update or roll back the driver named there; check what changed recently", "Run a memory test if different drivers are blamed each time"]

[[entry]]
id = "code-bugcheck-memory-corruption"
patterns = ['\bbug ?check(?: was| code)?:? *(?:0x0*|(?=[0-9a-f]+, \{))(?:1a|19|c2|c5)\b', 'BugcheckCode"?\s*[:=]\s*"?(?:26|25|194|197)\b', '\bMEMORY_MANAGEMENT\b', '\bBAD_POOL_(?:HEADER|CALLER)\b', '\bDRIVER_CORRUPTED_EXPOOL\b']
noise = "important"
title = "Blue screen from memory-management or pool corruption"
explanation = "Bug checks 0x1A (MEMORY_MANAGEMENT), 0x19 (BAD_POOL_HEADER), 0xC2 (BAD_POOL_CALLER) and 0xC5 (DRIVER_CORRUPTED_EXPOOL) mean kernel memory structures were found damaged."
causes = ["A driver corrupting pool memory", "Faulty RAM", "Disk/page file errors"]
steps = ["Run a thorough memory test", "Analyse the dump; enable Driver Verifier on suspect third-party drivers if the culprit is unclear"]

[[entry]]
id = "code-bugcheck-power-state"
patterns = ['\bbug ?check(?: was| code)?:? *(?:0x0*|(?=[0-9a-f]+, \{))9f\b', 'BugcheckCode"?\s*[:=]\s*"?159\b', '\bDRIVER_POWER_STATE_FAILURE\b']
noise = "important"
title = "Blue screen: DRIVER_POWER_STATE_FAILURE (0x9F)"
explanation = "A driver did not complete a power transition (sleep, hibernate, resume, shutdown) in time."
causes = ["Network, storage, USB or graphics driver hanging during a power change", "Firmware/BIOS issues"]
steps = ["Analyse the dump ('!analyze -v' shows the blocked device / IRP)", "Update the driver and firmware; disable selective suspend for the device as a workaround"]

[[entry]]
id = "code-bugcheck-critical-process"
patterns = ['\bbug ?check(?: was| code)?:? *(?:0x0*|(?=[0-9a-f]+, \{))(?:ef|f4)\b', 'BugcheckCode"?\s*[:=]\s*"?(?:239|244)\b', '\bCRITICAL_PROCESS_DIED\b', '\bCRITICAL_OBJECT_TERMINATION\b']
noise = "important"
title = "Blue screen: a critical system process died (0xEF / 0xF4)"
explanation = "A process Windows cannot live without (e.g. csrss, wininit, lsass, smss) terminated, so the system stopped."
causes = ["Storage failure making system files unreadable", "Corrupted system files or failed update", "Security software or malware killing a system process"]
steps = ["Check disk/storport events before the crash", "Run 'sfc /scannow' and 'DISM /RestoreHealth'", "Review recent updates and security software"]

[[entry]]
id = "code-bugcheck-hardware"
patterns = ['\bbug ?check(?: was| code)?:? *(?:0x0*|(?=[0-9a-f]+, \{))(?:124|9c|101)\b', 'BugcheckCode"?\s*[:=]\s*"?(?:292|156|257)\b', '\bWHEA_UNCORRECTABLE_ERROR\b', '\bMACHINE_CHECK_EXCEPTION\b', '\bCLOCK_WATCHDOG_TIMEOUT\b']
noise = "important"
title = "Blue screen from a hardware error (WHEA / machine check / CPU watchdog)"
explanation = "Bug checks 0x124 (WHEA_UNCORRECTABLE_ERROR), 0x9C (MACHINE_CHECK_EXCEPTION) and 0x101 (CLOCK_WATCHDOG_TIMEOUT) are raised when the CPU or platform reports a fatal hardware error or a processor stops responding."
causes = ["CPU, memory, motherboard or power-supply faults", "Overheating or unstable overclock/undervolt", "Outdated BIOS/microcode"]
steps = ["Check WHEA-Logger events for the failing component", "Update BIOS/firmware, reset overclocking, check temperatures and run hardware diagnostics"]

[[entry]]
id = "code-bugcheck-dpc-watchdog"
patterns = ['\bbug ?check(?: was| code)?:? *(?:0x0*|(?=[0-9a-f]+, \{))133\b', 'BugcheckCode"?\s*[:=]\s*"?307\b', '\bDPC_WATCHDOG_VIOLATION\b']
noise = "important"
title = "Blue screen: DPC_WATCHDOG_VIOLATION (0x133)"
explanation = "A driver spent too long at high priority (DPC/ISR), so the watchdog stopped the system. Storage and network drivers and SSD firmware are frequent causes."
causes = ["Storage controller driver or SSD firmware issues", "Network or other device driver stuck in a DPC"]
steps = ["Analyse the dump for the driver involved", "Update storage controller drivers and SSD firmware first"]

[[entry]]
id = "code-bugcheck-storage"
patterns = ['\bbug ?check(?: was| code)?:? *(?:0x0*|(?=[0-9a-f]+, \{))(?:7a|77|7b|ed)\b', 'BugcheckCode"?\s*[:=]\s*"?(?:122|119|123|237)\b', '\bKERNEL_(?:DATA|STACK)_INPAGE_ERROR\b', '\bINACCESSIBLE_BOOT_DEVICE\b', '\bUNMOUNTABLE_BOOT_VOLUME\b']
noise = "important"
title = "Blue screen from storage problems (in-page error / boot device)"
explanation = "Bug checks 0x7A / 0x77 (kernel data/stack in-page error) mean kernel data could not be read back from the page file or disk; 0x7B / 0xED mean the boot volume could not be accessed or mounted."
causes = ["Failing disk/SSD, cable or controller", "Storage driver or controller-mode change (AHCI/RAID) before boot", "File system corruption on the boot volume"]
steps = ["Check disk health and storage events before the crash", "Run chkdsk; revert recent storage driver / controller-mode changes"]

[[entry]]
id = "code-bugcheck-security-check"
patterns = ['\bbug ?check(?: was| code)?:? *(?:0x0*|(?=[0-9a-f]+, \{))139\b', 'BugcheckCode"?\s*[:=]\s*"?313\b', '\bKERNEL_SECURITY_CHECK_FAILURE\b']
noise = "important"
title = "Blue screen: KERNEL_SECURITY_CHECK_FAILURE (0x139)"
explanation = "The kernel detected corruption of a critical data structure (such as a linked list or stack cookie) and stopped to prevent exploitation; usually a driver bug or bad memory."
causes = ["Incompatible or buggy driver", "Faulty RAM"]
steps = ["Analyse the dump for the responsible module", "Update drivers and test memory"]

[[entry]]
id = "code-bugcheck-video"
patterns = ['\bbug ?check(?: was| code)?:? *(?:0x0*|(?=[0-9a-f]+, \{))(?:116|117)\b', 'BugcheckCode"?\s*[:=]\s*"?(?:278|279)\b', '\bVIDEO_TDR_(?:FAILURE|TIMEOUT_DETECTED)\b']
noise = "important"
title = "Display driver stopped responding (VIDEO_TDR, 0x116 / 0x117)"
explanation = "The graphics driver did not recover after a GPU timeout (0x116 crash) or a timeout was detected and a live dump captured (0x117)."
causes = ["Graphics driver bug or overheating GPU", "Unstable GPU overclock or power delivery"]
steps = ["Update or clean-install the graphics driver", "Check GPU temperatures and power"]

[[entry]]
id = "code-bugcheck-manual"
patterns = ['\bbug ?check(?: was| code)?:? *(?:0x0*|(?=[0-9a-f]+, \{))e2\b', 'BugcheckCode"?\s*[:=]\s*"?226\b', '\bMANUALLY_INITIATED_CRASH\b']
noise = "normal"
title = "Crash triggered on purpose (MANUALLY_INITIATED_CRASH, 0xE2)"
explanation = "Someone forced a crash dump deliberately (keyboard crash, NMI or debugger), typically to capture the state of a hung machine."
causes = ["Administrator capturing a dump of a hang"]
steps = ["Analyse the dump for what the system was waiting on at that moment"]

# ---------------------------------------------------------------- TLS / certificates (any platform)
# src: https://learn.microsoft.com/en-us/troubleshoot/sql/database-engine/connect/certificate-chain-not-trusted
# src: https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-erref/705fb797-2175-4a90-b5a3-3918024b10b8
# src: https://nodejs.org/api/tls.html
# src: https://docs.python.org/3/library/ssl.html
[[entry]]
id = "tls-untrusted-issuer"
patterns = ['unable to get local issuer certificate', '\bUNABLE_TO_GET_ISSUER_CERT_LOCALLY\b', 'unable to verify the first certificate', '\bUNABLE_TO_VERIFY_LEAF_SIGNATURE\b', 'certificate signed by unknown authority']
noise = "important"
title = "TLS: certificate issuer not trusted / chain incomplete"
explanation = "The client could not build a chain from the server's certificate to a trusted root: either the server does not send its intermediate certificate, or the issuing CA (often a private corporate CA) is not in the client's trust store."
causes = ["Server configured without the intermediate certificate", "Private/internal CA not installed in the client's (or container's / runtime's) CA bundle", "TLS-inspecting proxy re-signing traffic with its own CA"]
steps = ["Check the chain with 'openssl s_client -connect host:443 -showcerts'", "Fix the server to send the full chain, or add the CA to the trust store the runtime uses (OS store, certifi, NODE_EXTRA_CA_CERTS, Java cacerts)", "Never disable certificate validation as a fix"]

[[entry]]
id = "tls-self-signed-chain"
patterns = ['self[- ]signed certificate in certificate chain', '\bSELF_SIGNED_CERT_IN_CHAIN\b', '\bDEPTH_ZERO_SELF_SIGNED_CERT\b']
noise = "important"
title = "TLS: self-signed certificate not trusted"
explanation = "The server presented a self-signed certificate (DEPTH_ZERO) or a chain ending in a root the client does not trust — very often a corporate TLS-inspection proxy or an internal test certificate."
causes = ["Corporate proxy / firewall intercepting TLS with its own root CA", "Development or appliance certificate that was never replaced"]
steps = ["Identify who issued the certificate the client sees", "Add the proxy's or internal root CA to the runtime's trust store, or replace the server certificate with one from a trusted CA"]

[[entry]]
id = "tls-hostname-mismatch"
codes = ["0x800b010f"]
patterns = ['does not match certificate.s altnames', '\bERR_TLS_CERT_ALTNAME_INVALID\b', 'x509: certificate is valid for .{1,300}, not ', 'No subject alternative (?:DNS )?names? matching', 'Hostname mismatch, certificate is not valid for', 'no alternative certificate subject name matches target host name']
noise = "important"
title = "TLS: certificate does not match the host name"
explanation = "The certificate is valid but issued for other names than the one the client connected to (checked against the Subject Alternative Names)."
causes = ["Connecting by IP address, short name or an alias not listed in the certificate", "Wrong certificate bound to the site / SNI misconfiguration", "Load balancer serving a default certificate"]
steps = ["Compare the host name used with the certificate's SAN list", "Use a listed name, or reissue the certificate including the needed names", "Check SNI / binding configuration on the server or load balancer"]

[[entry]]
id = "tls-wrong-version-number"
patterns = ['\bwrong version number\b', '\bWRONG_VERSION_NUMBER\b', 'The plain HTTP request was sent to HTTPS port']
noise = "important"
title = "TLS spoken to a non-TLS port (wrong version number)"
explanation = "One side expected TLS but received something else — typically an https:// URL pointing at a plain-HTTP port, or plain HTTP sent to an HTTPS port."
causes = ["Wrong scheme or port in the URL / proxy setting", "Proxy configured as https:// while it only speaks HTTP CONNECT on a plain port"]
steps = ["Check scheme and port of the target and of any proxy (HTTPS_PROXY values usually start with http://)", "Test with 'curl -v' to see what the server answers"]

[[entry]]
id = "tls-protocol-mismatch"
codes = ["0x80090331", "0x80090326", "0x80090302"]
patterns = ['tlsv1 alert protocol version', '\bTLSV1_ALERT_PROTOCOL_VERSION\b', 'sslv3 alert handshake failure', '\bSSLV3_ALERT_HANDSHAKE_FAILURE\b', 'no shared cipher', 'no cipher suites in common', 'SSL routines.{0,60}unsupported protocol', 'do not possess a common algorithm']
noise = "important"
title = "TLS handshake failed: no common protocol version or cipher"
explanation = "Client and server could not agree on a TLS version or cipher suite (on Windows: 'The client and server cannot communicate, because they do not possess a common algorithm', 0x80090331). 0x80090326 'message unexpected or badly formatted' is a related handshake failure."
causes = ["One side only allows TLS 1.0/1.1 while the other requires TLS 1.2+", "Hardened cipher-suite lists with no overlap", "Old runtimes (.NET Framework without strong crypto, old Java/OpenSSL)"]
steps = ["Test the server with 'openssl s_client -tls1_2' / '-tls1_3' or an SSL scanner", "Enable TLS 1.2+ on the older side (registry/SCHANNEL, runtime settings) and align cipher suites", "Check Schannel 36874/36888 events on Windows servers"]

[[entry]]
id = "tls-revocation-check"
codes = ["0x80092012", "0x80092013", "0x80092010"]
patterns = ['The revocation function was unable to check revocation', '\bRevocationStatusUnknown\b', '\bOfflineRevocation\b', '\bCRYPT_E_REVOCATION_OFFLINE\b', '\bCRYPT_E_NO_REVOCATION_CHECK\b']
noise = "important"
title = "Certificate revocation check failed (or certificate revoked)"
explanation = "The client could not check whether a certificate was revoked because the CRL/OCSP server was unreachable (0x80092012 / 0x80092013, RevocationStatusUnknown / OfflineRevocation), or the certificate is actually revoked (0x80092010)."
causes = ["Server with no internet access cannot reach CRL/OCSP URLs", "Internal CA's CRL expired or not published", "Certificate revoked by the CA"]
steps = ["Run 'certutil -urlfetch -verify <cert file>' to test the CRL/OCSP URLs", "Allow access to the CRL distribution points or publish a fresh CRL", "Replace revoked certificates"]

[[entry]]
id = "tls-cert-expired"
codes = ["0x80090328", "0x800b0101"]
patterns = ['\bCERT_HAS_EXPIRED\b', '\bCertificateExpiredException\b', 'alert certificate expired', '\bNotTimeValid\b']
noise = "important"
title = "TLS: certificate expired or not yet valid"
explanation = "A certificate in the chain is outside its validity period (0x80090328 / 0x800B0101 on Windows, CERT_HAS_EXPIRED in Node.js, CertificateExpiredException in Java, NotTimeValid in .NET chain status)."
causes = ["Certificate not renewed in time", "Wrong system clock on the client", "Old intermediate/root still cached or bundled"]
steps = ["Check the dates of every certificate in the chain and the client's clock", "Renew and redeploy the certificate (and the full chain)"]

[[entry]]
id = "code-sec-untrusted-root"
codes = ["0x80090325", "0x800b0109", "0x800b010a"]
patterns = ['The certificate chain was issued by an authority that is not trusted', 'terminated in a root certificate which is not trusted']
noise = "important"
title = "Certificate chain issued by an untrusted authority (Windows)"
explanation = "Windows could not chain the certificate to a trusted root (0x80090325 / 0x800B0109 / 0x800B010A). Common with SQL Server clients since Microsoft.Data.SqlClient 4.0 encrypts by default: the server's (often self-signed) certificate is not trusted."
causes = ["Self-signed or internal-CA certificate on the server", "Missing intermediate/root CA in the client's Windows certificate store", "SQL client now defaulting to Encrypt=True"]
steps = ["Install the issuing CA in the client's Trusted Root store or give the server a trusted certificate", "For SQL Server only as a temporary measure: TrustServerCertificate=True in the connection string"]

[[entry]]
id = "code-sec-wrong-principal"
codes = ["0x80090322"]
patterns = ['The target principal name is incorrect', 'Cannot generate SSPI context']
noise = "important"
title = "Kerberos target principal name incorrect / cannot generate SSPI context"
explanation = "Integrated (Kerberos) authentication failed because the SPN the client used belongs to a different account than the one the service runs as, or is missing/duplicated — typical for SQL Server and IIS with domain service accounts."
causes = ["SPN registered on the wrong account or missing after a service account change", "Duplicate SPNs", "DNS alias / name mismatch"]
steps = ["List SPNs with 'setspn -L <service account>' and find duplicates with 'setspn -X'", "Register the correct SPN (e.g. MSSQLSvc/host.domain:1433) on the service account"]

[[entry]]
id = "code-sec-auth-failed"
codes = ["0x8009030c", "0x8009030e", "0x80090311", "0x80090304"]
patterns = ['No authority could be contacted for authentication', 'The Local Security Authority cannot be contacted']
noise = "normal"
title = "Windows authentication (SSPI) failed"
explanation = "0x8009030C: the logon attempt failed; 0x8009030E: no credentials available (normal first step of an NTLM/Negotiate challenge); 0x80090311: no domain controller could be contacted; 0x80090304: the Local Security Authority could not be contacted."
causes = ["Wrong or expired credentials", "Domain controller unreachable, or secure channel / time problems", "Normal NTLM challenge-response round trip (0x8009030E alone)"]
steps = ["Check whether a successful attempt follows (challenge-response is normal)", "Verify DC connectivity (nltest /sc_query:<domain>) and time sync", "Check the account in Security event 4625 on the server"]

[[entry]]
id = "code-sec-key-access"
codes = ["0x80090016", "0x8009030d"]
patterns = ['Keyset does not exist']
noise = "important"
title = "Certificate private key missing or not accessible"
explanation = "The certificate's private key could not be opened: it is missing (imported without key), or the account using it has no permission on the key file (0x80090016 'Keyset does not exist', 0x8009030D credentials not recognised)."
causes = ["App pool / service account lacks read access to the private key", "Certificate imported without its private key or into the wrong store"]
steps = ["In certlm.msc use 'Manage Private Keys' to grant the service account read access", "Re-import the PFX with the private key into the Local Machine store"]

[[entry]]
id = "code-winhttp-tls"
codes = ["0x80072f8f", "0x80072f7d", "0x80072f0d", "0x80072f06", "0x80072f05"]
patterns = ['An error occurred in the secure channel support']
noise = "important"
title = "WinHTTP / WinINet TLS or certificate failure"
explanation = "0x80072F8F: secure failure (certificate problem, TLS version mismatch or wrong clock); 0x80072F7D: error in the secure channel support (TLS negotiation failed); 0x80072F0D: invalid certificate authority; 0x80072F06: certificate name does not match; 0x80072F05: certificate date invalid."
causes = ["TLS 1.2 not enabled for WinHTTP on older systems", "System clock wrong", "TLS-inspecting proxy or untrusted CA"]
steps = ["Check date/time and TLS 1.2 settings (WinHTTP DefaultSecureProtocols)", "Verify the server certificate chain from this machine"]

[[entry]]
id = "code-winhttp-connection"
codes = ["0x80072efe", "0x80072f78"]
patterns = ['The connection with the server was terminated abnormally', 'The server returned an invalid or unrecognized response']
noise = "normal"
title = "WinHTTP connection dropped or invalid response"
explanation = "0x80072EFE: the connection was closed abnormally mid-transfer; 0x80072F78: the server returned an invalid or unrecognised response."
causes = ["Proxy, firewall or load balancer cutting the connection", "Content filtering altering responses", "Server crash or protocol mismatch"]
steps = ["Test the same URL through the same proxy from that machine", "Check proxy/firewall logs for resets at that time"]

# ---------------------------------------------------------------- Network errors (sockets, any platform)
# src: https://learn.microsoft.com/en-us/windows/win32/winsock/windows-sockets-error-codes-2
# src: https://nodejs.org/api/errors.html#common-system-errors
# src: https://man7.org/linux/man-pages/man3/errno.3.html
[[entry]]
id = "net-address-in-use"
patterns = ['\bEADDRINUSE\b', '\bWSAEADDRINUSE\b', '\bAddress already in use\b', 'Only one usage of each socket address', 'port is already allocated', '\bPort \d+ was already in use\b', '\b(?:WinError|SocketException|error) ?\(?10048\b']
noise = "important"
title = "Port already in use (cannot bind)"
explanation = "A server tried to listen on an IP/port that another socket already holds (EADDRINUSE / WSAEADDRINUSE 10048, Docker 'port is already allocated'). The process usually fails to start."
causes = ["A second instance of the same service, or an old process still running", "Another program using that port", "Port still held by a socket that is closing"]
steps = ["Find the owner: 'netstat -ano | findstr :<port>' (Windows) or 'ss -ltnp' (Linux)", "Stop the other process or move one of them to another port"]

[[entry]]
id = "net-connection-aborted"
patterns = ['An established connection was aborted by the software in your host machine', '\bWSAECONNABORTED\b', '\bECONNABORTED\b', 'Software caused connection abort']
noise = "normal"
title = "Connection aborted locally (10053 / ECONNABORTED)"
explanation = "The local network stack aborted an established connection — after a data-transmission timeout, a protocol error, or because local software (firewall, antivirus, VPN) cut it."
causes = ["Security software or VPN dropping the connection", "Retransmission timeout on an unstable network", "Peer went away while data was being sent"]
steps = ["Check security/VPN software logs at that time", "Look for network instability; retry idempotent calls"]

[[entry]]
id = "net-connection-timed-out"
patterns = ['\bETIMEDOUT\b', '\bWSAETIMEDOUT\b', '\[Errno 110\]', '\bConnection timed out\b', '\b(?:WinError|SocketException|error) ?\(?10060\b']
noise = "normal"
title = "Connection timed out (ETIMEDOUT / 10060)"
explanation = "No answer came back from the remote host within the TCP timeout — packets are dropped silently somewhere (firewall, routing, host down), unlike 'connection refused' which is an active rejection."
causes = ["Firewall or security group silently dropping traffic", "Host down or wrong IP address", "Network congestion or routing problems"]
steps = ["Test the port from the same machine (Test-NetConnection / nc -vz)", "Check firewall rules along the path and the target's listening state"]

[[entry]]
id = "net-unreachable"
patterns = ['\bEHOSTUNREACH\b', '\bENETUNREACH\b', '\bNo route to host\b', '\bNetwork is unreachable\b', 'A socket operation was attempted to an unreachable (?:host|network)', '\bWSAE(?:HOST|NET)UNREACH\b']
noise = "important"
title = "Host or network unreachable"
explanation = "The local system has no route to the destination (ENETUNREACH / 10051) or the host could not be reached (EHOSTUNREACH / 10065, 'No route to host' — on Linux also returned when a firewall rejects with ICMP host-prohibited)."
causes = ["Missing route, VPN down, wrong default gateway", "Firewall rejecting with ICMP unreachable", "IPv6 address used where only IPv4 works"]
steps = ["Check routes ('route print' / 'ip route') and the VPN state", "Trace the path (tracert / traceroute) and check firewalls"]

[[entry]]
id = "net-no-buffer-space"
patterns = ['\bWSAENOBUFS\b', '\bENOBUFS\b', 'lacked sufficient buffer space or because a queue was full', 'No buffer space available']
noise = "important"
title = "No buffer space available (often ephemeral port exhaustion)"
explanation = "The socket operation failed because the system lacked buffer space or a queue was full (WSAENOBUFS 10055). On Windows this commonly means all outbound ephemeral ports are in use."
causes = ["Application opening many short-lived outbound connections without reuse", "Socket/handle leak", "Too few ephemeral ports configured"]
steps = ["Count connections per process ('netstat -ano'); look for thousands in TIME_WAIT/ESTABLISHED", "Reuse connections (HttpClient factory, connection pooling); fix leaks", "See Tcpip 4227/4231 events"]

[[entry]]
id = "net-socket-forbidden"
patterns = ['access a socket in a way forbidden by its access permissions', '\bWSAEACCES\b']
noise = "important"
title = "Socket access forbidden (10013)"
explanation = "Windows refused the bind/connect (WSAEACCES 10013). For a listening port this usually means the port is in an excluded range reserved by Hyper-V/WinNAT/WSL, or another program holds it with exclusive access."
causes = ["Port inside a reserved/excluded range ('netsh int ipv4 show excludedportrange protocol=tcp')", "Exclusive bind by another service", "Security software blocking the socket"]
steps = ["List excluded port ranges and pick a port outside them", "Find the process holding the port with 'netstat -ano'"]

[[entry]]
id = "net-address-not-available"
patterns = ['\bEADDRNOTAVAIL\b', '\bWSAEADDRNOTAVAIL\b', 'Cannot assign requested address', 'The requested address is not valid in its context']
noise = "important"
title = "Cannot assign requested address"
explanation = "The program tried to bind to an IP address that does not exist on this machine, or (on Linux) ran out of local ports for outgoing connections to the same destination."
causes = ["Binding to an IP configured for another host / interface not up yet", "Ephemeral port exhaustion for outgoing connections", "Connecting to address 0.0.0.0 or port 0"]
steps = ["Check the configured listen address against the machine's interfaces", "For outgoing exhaustion reuse connections or widen the local port range"]

[[entry]]
id = "net-dns-temporary"
patterns = ['Temporary failure in name resolution', '\bEAI_AGAIN\b', '\bWSATRY_AGAIN\b', 'usually a temporary error during hostname resolution', 'The requested name is valid, but no data of the requested type was found']
noise = "normal"
title = "Temporary DNS failure (EAI_AGAIN / 11002)"
explanation = "The resolver got no authoritative answer (server timeout or SERVFAIL), or the name exists but has no record of the requested type (11004). Unlike 'host not found' a retry may succeed."
causes = ["DNS server overloaded or unreachable", "Container/VM resolver misconfigured (/etc/resolv.conf)", "Name has only IPv6 / no A record"]
steps = ["Query the configured DNS servers directly (nslookup / dig @server)", "Check resolver configuration inside containers and VMs"]

[[entry]]
id = "net-econnreset"
patterns = ['\bECONNRESET\b', '\bWSAECONNRESET\b', '\bsocket hang up\b']
noise = "normal"
title = "Connection reset (ECONNRESET / socket hang up)"
explanation = "The other side or something in between closed the TCP connection abruptly. Node.js reports a request whose connection closed before a response as 'socket hang up'."
causes = ["Server crashed, restarted or timed out the request", "Keep-alive connection reused after the server or a load balancer closed it", "Proxy/firewall idle timeout"]
steps = ["Check the remote service's logs at that time", "Align client keep-alive timeouts below the server/load balancer idle timeout; retry idempotent requests"]

[[entry]]
id = "net-broken-pipe"
patterns = ['\bBroken pipe\b', '\bEPIPE\b', '\bBrokenPipeError\b']
noise = "normal"
title = "Broken pipe (write to a closed connection)"
explanation = "The program wrote to a socket or pipe whose reader had already gone away — typically the client disconnected before the response was complete."
causes = ["Client closed the connection (browser navigation, client timeout)", "Downstream process exited"]
steps = ["Usually harmless when clients cancel requests; investigate if it correlates with slow responses", "Make sure client timeouts are longer than normal response times"]

[[entry]]
id = "net-context-deadline"
patterns = ['context deadline exceeded']
noise = "normal"
title = "Deadline exceeded (Go context / gRPC timeout)"
explanation = "An operation in a Go program or gRPC call did not finish before its deadline. Common in Kubernetes, Docker and cloud tooling output."
causes = ["Slow or unreachable dependency (API server, registry, database)", "Deadline too short for the operation"]
steps = ["Find which call timed out from the surrounding lines", "Check the health and latency of that dependency"]

# src: https://www.rfc-editor.org/rfc/rfc9110.html#name-status-codes
# src: https://nginx.org/en/docs/http/ngx_http_core_module.html
[[entry]]
id = "net-http-access-5xx"
patterns = ['"(?:GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS) \S+ HTTP/[\d.]+" 50[0234]\b']
noise = "important"
title = "HTTP 5xx in a web server access log"
explanation = "The request line in this access-log entry got a server error: 500 the application failed; 502 the proxy got an invalid/no response from the upstream; 503 service unavailable or overloaded; 504 the upstream did not answer in time."
causes = ["Application exception (500)", "Upstream down, crashing or too slow behind the proxy (502/504)", "Overload, maintenance or stopped application (503)"]
steps = ["Match the timestamp with the web server's error log and the application's log", "For 502/504 check the upstream's health and the proxy's timeouts"]

[[entry]]
id = "net-http-access-client-limits"
patterns = ['"(?:GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS) \S+ HTTP/[\d.]+" (?:429|499)\b']
noise = "normal"
title = "HTTP 429 or 499 in a web server access log"
explanation = "429: the client was rate-limited. 499 (nginx): the client closed the connection before the server answered — usually because the server was too slow for the client's timeout."
causes = ["Client exceeding a configured rate limit (429)", "Slow upstream responses or short client timeouts (499)"]
steps = ["For 429 check rate-limit settings and the client's request rate", "For 499 compare request duration with the client/load balancer timeout"]

# ---------------------------------------------------------------- .NET exceptions
# src: https://learn.microsoft.com/en-us/dotnet/api/system.objectdisposedexception
# src: https://learn.microsoft.com/en-us/dotnet/api/system.net.http.httpclient.timeout
# src: https://learn.microsoft.com/en-us/dotnet/framework/data/adonet/sql-server-connection-pooling
# src: https://learn.microsoft.com/en-us/dotnet/standard/exceptions/best-practices-for-exceptions
[[entry]]
id = "dotnet-object-disposed"
patterns = ['\bObjectDisposedException\b', 'Cannot access a disposed (?:object|context instance)']
noise = "important"
title = ".NET ObjectDisposedException — object used after Dispose"
explanation = "Code used an object (stream, HttpClient, DbContext, CancellationTokenSource…) after it was disposed. Frequent with dependency injection when a scoped service is captured by a background task or a singleton."
causes = ["Object disposed by a 'using' block while async work still uses it", "Scoped service (e.g. DbContext) used after the request scope ended", "Shared instance disposed by one caller while others still use it"]
steps = ["Find the first frame from your code in the stack trace and check the object's lifetime", "Create a new scope (IServiceScopeFactory) for background work instead of capturing request services", "Await async work before leaving the 'using' block"]

[[entry]]
id = "dotnet-operation-canceled"
patterns = ['\bOperationCanceledException\b', '\bThe operation was canceled\.']
noise = "normal"
title = ".NET operation canceled"
explanation = "A CancellationToken was triggered: the caller cancelled, the HTTP client disconnected (RequestAborted), the host is shutting down, or a timeout implemented with a token fired."
causes = ["Client closed the connection or navigated away", "Application shutdown or recycle", "Timeout implemented through CancellationTokenSource.CancelAfter"]
steps = ["Check whether it coincides with client disconnects or a shutdown — then it is usually harmless", "If it is a timeout, find which dependency was slow"]

[[entry]]
id = "dotnet-http-request-failed"
patterns = ['Response status code does not indicate success: \d{3}', 'An error occurred while sending the request', 'Error while copying content to a stream']
noise = "normal"
title = ".NET HttpClient request failed"
explanation = "HttpRequestException: the server answered with a non-success status (EnsureSuccessStatusCode), or the request failed before a full response arrived (connection, TLS or proxy problem — see the inner exception), or the connection broke while reading/writing the body."
causes = ["Remote service returned 4xx/5xx", "Connection reset, DNS, TLS or proxy failure (inner exception tells which)", "Server or load balancer closed a pooled keep-alive connection"]
steps = ["Read the status code or the inner exception (SocketException / AuthenticationException / IOException)", "Check the remote service's logs and health at that time", "Retry idempotent requests with backoff; use IHttpClientFactory so pooled connections are recycled"]

[[entry]]
id = "dotnet-sql-pool-exhausted"
patterns = ['prior to obtaining a connection from the pool', 'max pool size was reached']
noise = "important"
title = "SQL connection pool exhausted"
explanation = "All connections in the ADO.NET pool (default Max Pool Size = 100) were in use and no connection was returned within the connection timeout. Usually a connection leak or slow queries holding connections, not a database outage."
causes = ["Connections not disposed (missing 'using' / Dispose, readers left open)", "Long-running queries or blocking holding connections", "Traffic spike larger than the pool"]
steps = ["Make sure every SqlConnection / DbContext is disposed promptly", "Check for blocking and slow queries on the server at that time", "Only raise Max Pool Size after leaks are excluded"]

[[entry]]
id = "dotnet-sql-transport-error"
patterns = ['A transport-level error has occurred when (?:receiving results from|sending the request to) the server', 'No process is on the other end of the pipe']
noise = "normal"
title = "SQL connection broken (transport-level error)"
explanation = "A pooled or open connection to SQL Server broke: the server, a failover, a firewall or a load balancer closed it. 'No process is on the other end of the pipe' (error 233) is the shared-memory/named-pipes variant, often seen when the server refuses the login."
causes = ["SQL Server restart or availability-group failover", "Idle connection killed by a firewall/NAT timeout", "Server rejected the connection (login failed, connection limit reached, protocol disabled)"]
steps = ["Check the SQL Server error log and failover history at that time", "Enable retry logic (e.g. EF Core EnableRetryOnFailure) for transient errors", "For error 233 look for login failures or the 'user connections' limit on the server"]

[[entry]]
id = "dotnet-common-bugs"
patterns = ['Collection was modified; enumeration operation may not execute', 'Sequence contains no (?:matching )?elements?\b', 'Sequence contains more than one (?:matching )?element', '\bKeyNotFoundException\b', 'The given key .{0,200}was not present in the dictionary', '\bArgumentNullException\b', '\bValue cannot be null\b', '\bInvalidCastException\b', 'Unable to cast object of type', '\bIndexOutOfRangeException\b', '\bArgumentOutOfRangeException\b', 'Index was outside the bounds of the array', 'An item with the same key has already been added', 'Nullable object must have a value', 'Input string (?:\S+ )?was not in a correct format']
noise = "important"
title = ".NET programming error (bug in the calling code)"
explanation = "A classic .NET bug exception: collection modified while iterating; First()/Single() on an empty or multi-item sequence; dictionary key missing or added twice; null argument; invalid cast; index out of range; reading .Value of an empty Nullable; parsing text that is not a number. The data that triggered it is usually unexpected input."
causes = ["Code path not handling empty, missing, duplicate or null data", "Concurrent modification of a shared collection from several threads", "Unexpected input format (culture, empty strings)"]
steps = ["Open the first stack frame from your own code to see which call failed", "Add the missing guard (TryGetValue, FirstOrDefault, TryParse, null checks) or fix the data", "For 'collection was modified' iterate over a copy or use a concurrent collection"]

[[entry]]
id = "dotnet-type-initializer"
patterns = ['The type initializer for \S+ threw an exception', '\bTypeInitializationException\b']
noise = "important"
title = ".NET static initialisation failed (TypeInitializationException)"
explanation = "A static constructor or static field initialiser threw; the type stays unusable for the life of the process, so every later use fails the same way. The real cause is the inner exception."
causes = ["Missing or invalid configuration read in a static initialiser", "Missing native/managed dependency loaded at type initialisation", "Bug in static field setup"]
steps = ["Read the InnerException — it holds the actual error", "Restart the process after fixing; move fragile setup out of static initialisers"]

[[entry]]
id = "dotnet-load-failure"
patterns = ['Unable to load (?:DLL|shared library) \S+', '\bDllNotFoundException\b', '\bMissingMethodException\b', 'Method not found: ', '\bTypeLoadException\b', 'Could not load type \S+ from assembly']
noise = "important"
title = ".NET could not load a native library, type or method"
explanation = "A native library used via P/Invoke was not found (DllNotFoundException / 'Unable to load DLL'), or a referenced method/type does not exist in the loaded assembly version (MissingMethodException, TypeLoadException) — a dependency version mismatch."
causes = ["Native DLL / .so missing, wrong architecture, or its own dependencies missing", "Two packages referencing different versions of the same assembly", "Partial deployment mixing old and new DLLs"]
steps = ["For native libraries check the file exists for the process architecture and its dependencies (Visual C++ runtime, libc)", "Compare the assembly versions deployed with those the code was built against; redeploy cleanly"]

[[entry]]
id = "dotnet-di-unresolved"
patterns = ['Unable to resolve service for type \S+ while attempting to activate']
noise = "important"
title = ".NET dependency injection could not create a service"
explanation = "The DI container was asked to build a class whose constructor needs a service that was never registered."
causes = ["Missing services.AddXxx(...) registration", "Registration in a different container/assembly than expected", "Injecting the concrete type while only the interface is registered (or the reverse)"]
steps = ["Register the missing service named in the message with the right lifetime", "Enable ValidateOnBuild / ValidateScopes in development to catch this at startup"]

[[entry]]
id = "dotnet-data-protection-key"
patterns = ['was not found in the key ring', 'The antiforgery token could not be decrypted', 'Error unprotecting the session cookie']
noise = "important"
title = "ASP.NET Core Data Protection key not found"
explanation = "A cookie, antiforgery token or other protected payload was encrypted with a key this instance does not have. Typical after a restart, deploy, slot swap or scale-out when keys are stored per machine or in a temporary folder."
causes = ["Keys stored in the default per-machine/per-container location", "Several instances not sharing one key ring or using different application names", "Keys encrypted for a different account (DPAPI)"]
steps = ["Persist keys to shared storage (file share, database, blob, Redis) and set the same application name everywhere", "Protect the shared keys with a certificate instead of machine DPAPI", "Users with old cookies may need to sign in again once keys are stable"]

[[entry]]
id = "dotnet-tls-transport"
patterns = ['Authentication failed because the remote party has closed the transport stream', 'Received an unexpected EOF or 0 bytes from the transport stream', 'Authentication failed because the remote party sent a TLS alert', 'Cannot determine the frame size or a corrupted frame was received']
noise = "important"
title = ".NET TLS handshake failed (AuthenticationException)"
explanation = "The TLS handshake failed: the remote side closed the connection or sent an alert during the handshake, or did not speak TLS at all. Usually a TLS version/cipher mismatch, an SNI/certificate problem on the server, or a plain-HTTP endpoint."
causes = ["Server requires a TLS version or cipher the client OS/runtime does not offer (or the reverse)", "Wrong port/scheme (TLS to a non-TLS endpoint)", "Proxy or firewall interrupting the handshake"]
steps = ["Test the endpoint with 'openssl s_client' or curl -v from the same machine", "Enable TLS 1.2+ for the runtime/OS and check cipher suites", "Check Schannel events on Windows servers at the same time"]

[[entry]]
id = "dotnet-jwt-validation"
patterns = ['\bIDX10223\b', '\bIDX10501\b', '\bIDX10503\b', '\bIDX10511\b', '\bIDX10214\b', '\bIDX10205\b', '\bIDX20803\b']
noise = "normal"
title = "JWT bearer token rejected (Microsoft.IdentityModel IDX error)"
explanation = "Token validation failed: IDX10223 token expired; IDX10501/10503/10511 signature validation failed (signing key not found); IDX10214 audience invalid; IDX10205 issuer invalid; IDX20803 the OpenID configuration/metadata could not be downloaded."
causes = ["Expired token or clock skew between servers", "Token issued for another API (audience) or tenant (issuer)", "Signing keys rotated or metadata endpoint unreachable through a proxy"]
steps = ["Decode the token and compare aud, iss, exp with the API's configuration", "Check that the server can reach the authority's /.well-known/openid-configuration", "Fix time synchronisation if many tokens appear expired"]

# src: https://learn.microsoft.com/en-us/aspnet/core/fundamentals/error-handling
# src: https://github.com/dotnet/aspnetcore/issues/46135
# src: https://learn.microsoft.com/en-us/dotnet/core/diagnostics/debug-threadpool-starvation
[[entry]]
id = "dotnet-aspnetcore-unhandled"
patterns = ['An unhandled exception has occurred while executing the request', 'An unhandled exception was thrown by the application']
noise = "important"
title = "ASP.NET Core request failed with an unhandled exception"
explanation = "An exception escaped the request pipeline; the client received a 500. The exception type and stack trace follow in the same entry."
causes = ["Application bug or failing dependency for this request"]
steps = ["Read the exception after this line and find the first frame from your code", "Match the request path and time with access logs"]

[[entry]]
id = "dotnet-aspnetcore-startup-failed"
patterns = ['Hosting failed to start', 'Application startup exception', 'Unable to start Kestrel', 'No server certificate was specified, and the default developer certificate could not be found']
noise = "important"
title = "ASP.NET Core host failed to start"
explanation = "The web host could not start: an exception during startup/configuration, Kestrel could not bind its endpoints, or HTTPS was configured without a certificate (the development certificate does not exist on servers)."
causes = ["Configuration or DI error at startup", "Port already in use or not permitted", "HTTPS endpoint without a configured certificate"]
steps = ["Read the inner exception printed with this message", "Check the URLs/ports and certificate configured for Kestrel", "Run the app from a console to see startup output"]

[[entry]]
id = "dotnet-threadpool-starvation"
patterns = ['the heartbeat has been running for', 'Heartbeat took longer than', 'could be caused by thread pool starvation']
noise = "important"
title = "Kestrel heartbeat slow — possible thread-pool starvation"
explanation = "Kestrel's 1-second housekeeping timer ran late, which usually means all thread-pool threads were blocked or the machine was CPU-starved. Requests queue up and latency spikes."
causes = ["Sync-over-async (.Result, .Wait(), GetAwaiter().GetResult()) on request threads", "Long blocking I/O or CPU-heavy work on thread-pool threads", "Overloaded or throttled VM/container"]
steps = ["Capture 'dotnet-counters' (ThreadPool queue length / thread count) or a dump while it happens", "Remove blocking calls in async code paths", "Check host CPU at the same time"]

# ---------------------------------------------------------------- IIS error pages and log rows
# src: https://learn.microsoft.com/en-us/troubleshoot/developer/webapps/iis/health-diagnostic-performance/http-status-code
# src: https://learn.microsoft.com/en-us/aspnet/core/test/troubleshoot-azure-iis
# src: https://learn.microsoft.com/en-us/windows/win32/http/types-of-errors-logged-by-the-http-server-api
# IIS W3C rows end with 'sc-status sc-substatus sc-win32-status time-taken'; those patterns anchor on that tail.
[[entry]]
id = "iis-500-19"
patterns = ['HTTP Error 500\.19\b', '\s500 19 \d+ \d+\s*$']
noise = "important"
title = "IIS 500.19 — configuration data is invalid"
explanation = "IIS could not read the configuration for the request: web.config or applicationHost.config is malformed, uses a section whose module is not installed (URL Rewrite, ASP.NET Core Module), or is locked/unreadable. The error page's 'Error Code' tells which: 0x8007000D malformed/unknown section, 0x80070005 access denied, 0x80070021 section locked."
causes = ["web.config uses a module that is not installed on this server", "XML syntax error after deployment", "Permissions on the site folder, or a section locked at server level"]
steps = ["Read the config file path, line and error code on the detailed error page", "Install the missing module (e.g. URL Rewrite, ASP.NET Core Hosting Bundle) or fix the XML", "Grant the app pool identity/IIS_IUSRS read access to the folder"]

[[entry]]
id = "iis-500-21-pipeline"
patterns = ['HTTP Error 500\.2[1-4]\b', 'has a bad module \S*ManagedPipelineHandler', '\s500 2[1-4] \d+ \d+\s*$']
noise = "important"
title = "IIS 500.21–500.24 — ASP.NET not registered / pipeline mode mismatch"
explanation = "500.21: a handler refers to a module IIS does not recognise (typically ASP.NET not registered, 'bad module ManagedPipelineHandler'). 500.22/500.23/500.24: the application's httpModules, httpHandlers or impersonation settings are not valid in Integrated pipeline mode."
causes = ["ASP.NET / .NET Framework feature not installed or registered in IIS", "Classic-mode web.config running in an Integrated-mode application pool"]
steps = ["Install the ASP.NET 4.x role feature (or run 'aspnet_regiis -i' on old systems)", "Migrate the config ('appcmd migrate config') or use a Classic pipeline pool for legacy apps"]

[[entry]]
id = "iis-403-14"
patterns = ['HTTP Error 403\.14\b', '\s403 14 \d+ \d+\s*$']
noise = "normal"
title = "IIS 403.14 — directory listing denied"
explanation = "The request mapped to a folder with no default document and directory browsing disabled. For applications it often means the app is not deployed where IIS points, or its handler is missing (ASP.NET Core without web.config, MVC routes not reached)."
causes = ["Wrong physical path or empty deployment folder", "Missing web.config / handler mapping for the application", "No default document configured"]
steps = ["Check the site's physical path and that the published files are there", "Make sure web.config (with the right handler) was deployed"]

[[entry]]
id = "iis-404-substatus"
patterns = ['HTTP Error 404\.(?:[1-9]|1\d|20)\b', '\s404 (?:[1-9]|1\d|20) \d+ \d+\s*$']
noise = "normal"
title = "IIS 404 sub-status — request blocked or not mapped"
explanation = "IIS returned 404 for a specific reason: 404.2 ISAPI/CGI restriction, 404.3 MIME type not configured, 404.4 no handler, 404.5/404.19 request-filtering rule, 404.6 verb denied, 404.7 extension denied, 404.8 hidden segment, 404.11 double escaping, 404.13 content length too large, 404.14 URL too long, 404.15 query string too long, 404.17 dynamic content mapped to the static handler."
causes = ["Request filtering limits (uploads, long URLs/query strings)", "Missing MIME type or handler mapping", "Application pool settings not matching handler preconditions (404.17)"]
steps = ["Use the sub-status to find the setting (requestFiltering, staticContent mimeMap, handlers)", "Raise limits only as far as needed (e.g. maxAllowedContentLength for 404.13)"]

[[entry]]
id = "iis-401-handshake"
patterns = ['\s401 2 5 \d+\s*$', '\s401 1 2148074254 \d+\s*$']
noise = "benign"
title = "IIS 401.2 / 401.1 handshake step (normal Windows authentication)"
explanation = "With Windows (NTLM/Negotiate) authentication the browser first sends an anonymous request (logged 401 2 5) and then a challenge step (401 1 2148074254 = 0x8009030E no credentials yet) before the authenticated request succeeds. These rows are expected."
causes = ["Normal challenge-response authentication"]
steps = ["Ignore unless the same client never gets a 200 afterwards"]

[[entry]]
id = "iis-401-failed"
patterns = ['HTTP Error 401\.[1-5]\b', '\s401 1 (?:1326|2148074252|2148074248) \d+\s*$']
noise = "normal"
title = "IIS 401 — authentication failed"
explanation = "401.1 logon failed (bad credentials: win32 1326, or 0x8009030C / 0x80090308 in the log row); 401.2 server configuration (no enabled authentication method matches the client); 401.3 NTFS permissions on the resource; 401.4/401.5 rejected by a filter or ISAPI/CGI application."
causes = ["Wrong credentials or account issues", "Authentication methods disabled or only Anonymous enabled", "Kerberos/SPN problems falling back to failed NTLM", "File permissions for the authenticated user"]
steps = ["Check which authentication providers are enabled for the site", "Look at Security 4625 events on the web server for the user", "For 401.3 check NTFS permissions for the user / app pool identity"]

[[entry]]
id = "iis-503-page"
patterns = ['HTTP Error 503\. The service is unavailable']
noise = "important"
title = "IIS 503 — the service is unavailable"
explanation = "HTTP.sys answered 503 because the application pool is stopped/disabled (rapid-fail protection, invalid identity), its request queue is full, or the URL reservation has no listener."
causes = ["Application pool stopped after repeated worker crashes (WAS 5002)", "Invalid pool identity (WAS 5021/5057)", "Queue full under load"]
steps = ["Check the application pool state in IIS Manager and WAS events in the System log", "Look at the HTTPERR log reason phrase (AppOffline, QueueFull, ...)"]

[[entry]]
id = "iis-502-3"
patterns = ['HTTP Error 502\.3\b', 'Forwarder Connection Error', '\s502 3 \d+ \d+\s*$']
noise = "important"
title = "IIS 502.3 — proxy/forwarder could not get a response"
explanation = "IIS acting as a reverse proxy (ARR, or the ASP.NET Core Module out-of-process) failed to get an answer from the back end. The win32 status tells why: 12002 timeout, 12029 cannot connect, 12030 connection aborted."
causes = ["Back-end process crashed, not listening or too slow (proxy timeout)", "Back-end certificate/TLS problems for HTTPS back ends"]
steps = ["Check the back-end application's log and health at that time", "Compare request duration with the ARR / ANCM requestTimeout"]

[[entry]]
id = "iis-ancm-start-failure"
patterns = ['HTTP Error 500\.30\b', 'In-Process Start Failure', 'ASP\.NET Core app failed to start', 'HTTP Error 502\.5\b', 'failed to start process with commandline', 'failed to load coreclr', 'hit unexpected managed exception']
noise = "important"
title = "ASP.NET Core app failed to start under IIS (500.30 / 502.5)"
explanation = "The ASP.NET Core Module started the application but it crashed or exited during startup (in-process 500.30, out-of-process 502.5). The Application event log and the stdout log hold the real exception."
causes = ["Exception in Program/Startup (configuration, database, missing secrets)", "Target .NET runtime version not installed", "Wrong bitness or missing files after deployment"]
steps = ["Read the IIS AspNetCore Module events in the Application log", "Enable stdoutLogEnabled in web.config temporarily, or run the app's exe/dll from a console on the server", "Verify the Hosting Bundle matches the app's target runtime"]

[[entry]]
id = "iis-ancm-config"
patterns = ['HTTP Error 500\.3[1-8]\b', 'ANCM (?:Failed to Find Native Dependencies|Failed to Load dll|Request Handler Load Failure|Mixed Hosting Models Not Supported|Multiple In-Process Applications in same Process|Out-Of-Process Handler Load Failure|Failed to Start Within Startup Time Limit|Application DLL Not Found)', 'Failed to load ASP\.NET Core runtime']
noise = "important"
title = "ASP.NET Core Module hosting error (500.31–500.38)"
explanation = "500.31 runtime not found; 500.32 wrong processor architecture; 500.33 request handler could not load; 500.34 in-process and out-of-process apps share a pool; 500.35 several in-process apps share a pool; 500.36 out-of-process handler missing (broken install); 500.37 startup exceeded the time limit (default 120 s); 500.38 single-file app hosted in-process."
causes = ["Missing or mismatched .NET runtime / Hosting Bundle", "Several applications sharing one application pool", "Slow startup (many apps starting at once, heavy initialisation)"]
steps = ["Install the Hosting Bundle for the app's runtime version and restart IIS", "Give each in-process app its own application pool", "For 500.37 find what makes startup slow or raise startupTimeLimit"]

[[entry]]
id = "iis-client-disconnected"
patterns = ['\s\d{3} \d+ (?:64|995|1236) \d+\s*$']
noise = "normal"
title = "IIS request ended with a client disconnect (win32 64 / 995 / 1236)"
explanation = "The response could not be completed because the network connection went away: 64 'network name no longer available', 995 'operation aborted', 1236 'connection aborted by the local system'. Usually the client gave up (closed the browser tab, timed out) — long time-taken values point to a slow server."
causes = ["Client or load balancer timeout shorter than the request duration", "Users navigating away", "Network interruptions"]
steps = ["Look at time-taken for these rows; if high, investigate the slow request", "Compare with the load balancer's idle/request timeout"]

[[entry]]
id = "iis-httperr-abandoned"
patterns = ['\bConnection_Abandoned_By_(?:AppPool|ReqQueue)\b']
noise = "important"
title = "HTTP.sys: request abandoned because the worker process went away"
explanation = "Requests were in flight or queued when the application pool's worker process crashed, hung or was recycled, so HTTP.sys dropped them (HTTPERR log)."
causes = ["Worker process crash (see WAS 5011 / Application Error 1000)", "Recycle or app pool stop while requests were running"]
steps = ["Correlate timestamps with WAS and crash events", "Capture a crash dump if it repeats"]

[[entry]]
id = "iis-httperr-pool-unavailable"
patterns = ['\s503 (?:-|\d+) (?:AppOffline|QueueFull|AppPoolTimer|AppShutdown|ConnLimit|Disabled|N/A)\b', '\bTimer_(?:AppPool|ReqQueue)\b']
noise = "important"
title = "HTTP.sys rejected or expired requests: application pool unavailable or too slow"
explanation = "HTTPERR reason phrases: AppOffline (pool disabled by rapid-fail protection), QueueFull (request queue full), AppPoolTimer (pool too busy), AppShutdown, ConnLimit (site connection limit), Disabled (taken offline by an administrator); Timer_AppPool / Timer_ReqQueue mean requests waited too long in the queue."
causes = ["Application pool stopped or crashing", "Requests processed too slowly for the incoming load (thread starvation, slow dependencies)", "Connection or queue limits configured too low"]
steps = ["Check application pool state and WAS events", "Look at request durations and worker-process CPU/threads", "Review queueLength and connection limits only after fixing slowness"]

[[entry]]
id = "iis-httperr-idle"
patterns = ['\bTimer_ConnectionIdle\b']
noise = "benign"
title = "HTTP.sys closed an idle connection (usually harmless)"
explanation = "A keep-alive connection stayed idle longer than the connection timeout (default 2 minutes) and was closed. Normal; browsers keep spare connections open."
causes = ["Normal keep-alive behaviour"]
steps = ["No action needed"]

[[entry]]
id = "iis-httperr-client"
patterns = ['\bTimer_(?:MinBytesPerSecond|EntityBody|HeaderWait)\b', '\bConnection_Dropped(?:_List_Full)?\b', '\bClient_Reset\b', '\s400 (?:-|\d+) (?:BadRequest|Hostname|Header|Verb|URL|URL_Length|RequestLength|FieldLength|Invalid_CR/LF|Number|Forbidden)\b']
noise = "normal"
title = "HTTP.sys: slow, dropped or malformed client request"
explanation = "HTTPERR entries caused by the client side: too slow to receive the response (Timer_MinBytesPerSecond) or send the body/headers (Timer_EntityBody / Timer_HeaderWait), disconnected (Connection_Dropped, Client_Reset), or sent a request HTTP.sys refused to parse (400 BadRequest, Hostname, URL_Length, RequestLength, FieldLength…)."
causes = ["Slow or mobile clients, scanners, abandoned uploads", "Requests with oversized headers (large cookies / Kerberos tokens) or invalid host names", "Load balancer health checks or resets"]
steps = ["Usually informational; investigate if real users report failures", "For RequestLength/FieldLength consider the size of cookies or Kerberos tokens (MaxFieldLength / MaxRequestBytes)"]

# ---------------------------------------------------------------- SQL Server error log and client messages
# src: https://learn.microsoft.com/en-us/sql/relational-databases/logs/troubleshoot-a-full-transaction-log-sql-server-error-9002
# src: https://learn.microsoft.com/en-us/sql/relational-databases/errors-events/mssqlserver-833-database-engine-error
# src: https://learn.microsoft.com/en-us/sql/relational-databases/errors-events/mssqlserver-17883-database-engine-error
# src: https://learn.microsoft.com/en-us/troubleshoot/sql/database-engine/performance/troubleshoot-sql-io-performance
# src: https://learn.microsoft.com/en-us/sql/relational-databases/errors-events/database-engine-events-and-errors
[[entry]]
id = "sql-log-full"
providers = ["MSSQLSERVER", "MSSQL$"]
event_ids = [9002]
patterns = ['The transaction log for database \S+ is full']
noise = "important"
title = "SQL Server transaction log is full (9002)"
explanation = "The database's log file cannot grow or be reused, so the database is effectively read-only until space is freed. The 'due to …' part (LOG_BACKUP, ACTIVE_TRANSACTION, AVAILABILITY_REPLICA, REPLICATION) says why the log cannot be truncated."
causes = ["FULL recovery model without regular log backups (LOG_BACKUP)", "A long-running open transaction", "Availability-group secondary or replication not keeping up", "Log file capped or disk full"]
steps = ["Check log_reuse_wait_desc in sys.databases for the database", "Take a log backup / resolve the blocking transaction or replica", "Add space or allow growth; schedule log backups"]

[[entry]]
id = "sql-filegroup-full"
providers = ["MSSQLSERVER", "MSSQL$"]
event_ids = [1101, 1105]
patterns = ['Could not allocate space for object .{1,300} because the \S+ filegroup is full', 'Could not allocate a new page for database']
noise = "important"
title = "SQL Server filegroup full (1105 / 1101)"
explanation = "A data file group (or tempdb) has no free space and cannot grow, so inserts and updates fail."
causes = ["Disk full or autogrowth disabled / max size reached", "Unexpected data growth or a runaway query filling tempdb"]
steps = ["Free disk space, add a file or raise MAXSIZE / enable autogrowth", "Find what grew (large tables, tempdb usage by sessions)"]

[[entry]]
id = "sql-slow-io"
providers = ["MSSQLSERVER", "MSSQL$"]
event_ids = [833]
patterns = ['I/O requests taking longer than 15 seconds to complete']
noise = "important"
title = "SQL Server I/O requests took longer than 15 seconds (833)"
explanation = "Reads or writes to a database file stalled for over 15 seconds. SQL Server is reporting a storage problem, not causing it; queries will be very slow."
causes = ["Overloaded or failing storage / SAN path", "Filter drivers (antivirus, backup, encryption) delaying I/O", "Frequent autogrowth or VM host contention"]
steps = ["Check Windows disk/storport events and storage latency at that time", "Exclude database files from antivirus scanning", "Involve the storage team with the file and timestamps"]

[[entry]]
id = "sql-non-yielding"
providers = ["MSSQLSERVER", "MSSQL$"]
event_ids = [17883, 17884, 17888]
patterns = ['appears to be non-yielding on Scheduler', 'have not been picked up by a worker thread in the last']
noise = "important"
title = "SQL Server scheduler stalled (non-yielding / deadlocked schedulers)"
explanation = "A SQL Server worker did not yield the CPU for a long time (17883) or no worker picked up new tasks (17884/17888 — worker exhaustion or blocking). SQL Server usually writes a memory dump."
causes = ["Stalled I/O or OS calls (storage, antivirus, memory paging)", "Massive blocking chain or worker-thread exhaustion", "A SQL Server or driver bug (check cumulative updates)"]
steps = ["Look at the dump and the SQL error log around the time", "Check for 833 I/O warnings and blocking", "Apply the latest cumulative update"]

[[entry]]
id = "sql-io-error"
providers = ["MSSQLSERVER", "MSSQL$"]
event_ids = [823, 824, 825]
patterns = ['The operating system returned error .{1,120} to SQL Server during a (?:read|write)', 'logical consistency-based I/O error', 'A read of the file .{1,300} succeeded after failing \d+ time']
noise = "important"
title = "SQL Server I/O error or page corruption (823 / 824 / 825)"
explanation = "823: Windows returned an error for a database file read/write. 824: a page was read but failed consistency checks (bad checksum, torn page). 825: a read succeeded only after retries — an early warning of failing storage."
causes = ["Failing disk, controller, driver or SAN path", "Power loss or write caching without battery protection"]
steps = ["Run DBCC CHECKDB on the affected database as soon as possible", "Check suspect_pages in msdb and storage health/events", "Restore damaged pages from backup if CHECKDB reports corruption"]

[[entry]]
id = "sql-memory-pressure"
providers = ["MSSQLSERVER", "MSSQL$"]
event_ids = [701, 17890]
patterns = ['There is insufficient system memory in resource pool', 'significant part of sql server process memory has been paged out']
noise = "important"
title = "SQL Server memory pressure (701 / 17890)"
explanation = "701: a query could not get the memory it needed. 17890: Windows paged out a large part of SQL Server's memory, which makes everything slow."
causes = ["max server memory too high (or unset) for the machine", "Other processes or the OS needing memory; memory-hungry queries", "Lock Pages in Memory not granted on systems with paging pressure"]
steps = ["Set 'max server memory' leaving room for the OS and other services", "Find large memory grants (sys.dm_exec_query_memory_grants)", "Consider Lock Pages in Memory for the service account"]

[[entry]]
id = "sql-data-integrity"
patterns = ['Violation of (?:PRIMARY KEY|UNIQUE KEY) constraint', 'Cannot insert duplicate key', 'statement conflicted with the (?:FOREIGN KEY|REFERENCE|CHECK) constraint', 'Cannot insert the value NULL into column', 'String or binary data would be truncated', 'Conversion failed when converting', 'Error converting data type', 'Arithmetic overflow error converting']
noise = "normal"
title = "SQL Server rejected data (constraint, truncation or conversion)"
explanation = "The statement violated a rule: duplicate key (2627/2601), foreign key or check constraint (547), NULL in a NOT NULL column (515), value longer than the column (8152/2628), or a value that cannot be converted (245/8114/8115)."
causes = ["Application sending invalid or duplicate data", "Schema and code out of sync (column length, nullability)", "Concurrent inserts racing for the same key"]
steps = ["Read the constraint/column named in the message", "Validate input in the application or adjust the schema deliberately", "For duplicates under concurrency use upsert logic or handle the error"]

[[entry]]
id = "sql-lock-timeout"
patterns = ['Lock request time out period exceeded']
noise = "normal"
title = "SQL Server lock request timed out (1222)"
explanation = "The statement waited longer than SET LOCK_TIMEOUT for a lock held by another session."
causes = ["Blocking by a long transaction", "Low LOCK_TIMEOUT setting in the client/tool"]
steps = ["Identify the blocking session (sys.dm_exec_requests / blocked process report)", "Shorten transactions or add indexes to reduce lock scope"]

[[entry]]
id = "sql-invalid-object"
patterns = ['Invalid object name ', 'Invalid column name ']
noise = "important"
title = "SQL Server invalid object or column name (208 / 207)"
explanation = "The query references a table/view or column that does not exist in the database it runs against."
causes = ["Database schema not migrated / deployment out of sync with code", "Wrong database or default schema in the connection", "Temporary table out of scope"]
steps = ["Check the connection's database and the object's schema name", "Run pending migrations / deploy the schema change"]

[[entry]]
id = "sql-cannot-open-database"
patterns = ['Cannot open database \S+ requested by the login', 'Cannot open user default database']
noise = "important"
title = "SQL Server login cannot open the requested database (4060 / 4064)"
explanation = "The login succeeded at server level but the database in the connection string (or the login's default database) does not exist, is offline/recovering, or the login has no user in it."
causes = ["Database name misspelled or not created", "Database offline, restoring or in recovery", "Login not mapped to a database user"]
steps = ["Check the database name and state (sys.databases)", "Create the database user for the login or fix the default database"]

[[entry]]
id = "sql-login-reason"
patterns = ['Reason: Password did not match that for the login provided', 'Reason: Could not find a login matching the name provided', 'Reason: Failed to open the (?:explicitly specified )?database', 'Token-based server access validation failed with an infrastructure error', 'Server is configured for Windows authentication only', 'Reason: The account is disabled', 'Reason: The password of the account (?:must be changed|has expired)']
noise = "normal"
title = "SQL Server login failure reason (error log)"
explanation = "The SQL Server error log states why a login failed: wrong password (state 8), unknown login (state 2/5), database could not be opened (state 38/40), server access check failed — often a Windows admin connecting without elevation or a DENY (state 11/12), SQL logins disabled (state 58), account disabled (state 7) or password must be changed/expired (state 18)."
causes = ["Stale or wrong credentials in the connection string", "Server in Windows-only authentication mode", "Missing permissions or default database problems"]
steps = ["Match the [CLIENT: ip] in the message to the application", "Fix credentials, enable mixed mode, or grant the login access as needed"]

[[entry]]
id = "sql-login-integrated"
patterns = ['Login failed for user .NT AUTHORITY\\ANONYMOUS LOGON', 'The login is from an untrusted domain and cannot be used with', 'SSPI handshake failed with error code']
noise = "important"
title = "SQL Server Windows (integrated) authentication failed"
explanation = "Integrated authentication did not deliver the user's identity: ANONYMOUS LOGON typically means Kerberos delegation/double-hop failed; 18452 'untrusted domain' and 17806 'SSPI handshake failed' mean NTLM/Kerberos negotiation failed (SPN, trust, loopback check or domain controller problems)."
causes = ["Missing/duplicate SPNs so Kerberos falls back to NTLM", "Double hop (IIS -> SQL, linked servers) without constrained delegation", "Loopback check when connecting to a local alias", "Domain controller unreachable or trust broken"]
steps = ["Check SPNs for the SQL service account (setspn -L) and fix duplicates", "Configure constrained delegation for double-hop scenarios", "Look at the SSPI error code (e.g. 0x8009030C) in LogLens' code explanation"]

[[entry]]
id = "sql-backup-failed"
providers = ["MSSQLSERVER", "MSSQL$"]
event_ids = [3041]
patterns = ['BACKUP failed to complete the command']
noise = "important"
title = "SQL Server backup failed (3041)"
explanation = "A BACKUP command did not complete; the detailed reason is logged by the backup tool or in the preceding error log lines (disk full, path unreachable, VSS failure)."
causes = ["Backup target full or unreachable (network share permissions)", "VSS or third-party backup agent failure", "Log backup without a prior full backup"]
steps = ["Read the backup tool's log / the SQL error log lines just before", "Verify the target path and permissions for the SQL Server service account"]

[[entry]]
id = "sql-agent-job-failed"
providers = ["SQLSERVERAGENT", "SQLAgent$"]
event_ids = [208]
patterns = ['The job failed\.\s+The Job was invoked by']
noise = "important"
title = "SQL Server Agent job failed"
explanation = "A SQL Server Agent job finished with failure; the job history names the step that failed and its error."
causes = ["Failing step (T-SQL error, SSIS package, command)", "Proxy/credential or permission problem for the step"]
steps = ["Open the job history and read the failing step's message", "Re-run the step manually under the same proxy/account"]

[[entry]]
id = "sql-database-suspect"
patterns = ['marked SUSPECT by recovery']
noise = "important"
title = "SQL Server database marked SUSPECT"
explanation = "Recovery could not bring the database online, so SQL Server marked it SUSPECT and it is unavailable."
causes = ["Corrupted data or log file (storage failure)", "Missing files or insufficient disk space during recovery"]
steps = ["Read the SQL error log for the recovery error", "Restore from backup; use emergency repair only as a last resort", "Check storage health"]

# ---------------------------------------------------------------- Java / JVM
# src: https://docs.oracle.com/en/java/javase/21/troubleshoot/troubleshooting-memory-leaks.html
# src: https://docs.oracle.com/en/java/javase/21/troubleshoot/fatal-error-log.html
# src: https://docs.oracle.com/en/java/javase/21/security/java-secure-socket-extension-jsse-reference-guide.html
# src: https://github.com/brettwooldridge/HikariCP/wiki/About-Pool-Sizing
[[entry]]
id = "java-oom-heap"
patterns = ['java\.lang\.OutOfMemoryError: Java heap space', 'OutOfMemoryError: GC overhead limit exceeded', 'OutOfMemoryError: Requested array size exceeds VM limit']
noise = "important"
title = "Java heap exhausted (OutOfMemoryError: Java heap space / GC overhead)"
explanation = "The JVM could not allocate an object in the heap (-Xmx limit), or spent almost all its time in garbage collection while freeing almost nothing (GC overhead limit). The application is effectively broken until restarted."
causes = ["Memory leak (growing caches, collections, listeners, sessions)", "Heap too small for the workload or a huge request/result set", "Container memory limit lower than expected so -Xmx was set too low"]
steps = ["Capture a heap dump (-XX:+HeapDumpOnOutOfMemoryError) and analyse the dominators", "Check GC logs for heap usage growing between full GCs (leak) vs spikes (load)", "Raise -Xmx (or MaxRAMPercentage in containers) only after excluding a leak"]

[[entry]]
id = "java-oom-metaspace"
patterns = ['OutOfMemoryError: (?:Metaspace|PermGen space|Compressed class space)']
noise = "important"
title = "Java class metadata space exhausted (Metaspace / PermGen)"
explanation = "The JVM ran out of space for class metadata — usually a class-loader leak after repeated redeployments, or heavy dynamic class generation."
causes = ["Hot redeploys in an application server leaking class loaders", "Frameworks generating many proxy/lambda classes", "MaxMetaspaceSize set too low"]
steps = ["Restart the JVM instead of redeploying repeatedly", "Inspect class loader counts in a heap dump", "Raise -XX:MaxMetaspaceSize if the class count is legitimately large"]

[[entry]]
id = "java-oom-native"
patterns = ['OutOfMemoryError: unable to create (?:new )?native thread', 'OutOfMemoryError: Direct buffer memory', 'There is insufficient memory for the Java Runtime Environment to continue', 'Native memory allocation \((?:malloc|mmap)\) failed']
noise = "important"
title = "JVM native memory or thread limit reached"
explanation = "The JVM could not create a thread or allocate memory outside the Java heap (direct buffers, native allocations). The machine/container or the OS process limits are exhausted, not the -Xmx heap."
causes = ["Thread leak or unbounded thread pools", "OS limits (ulimit -u, pids cgroup limit) or container memory limit", "Large direct buffers (Netty, NIO) or heap set so large that little native memory remains"]
steps = ["Count threads (jstack / thread dump) and look for pools that keep growing", "Check ulimit -u, container memory and pids limits", "Reduce -Xmx or MaxDirectMemorySize to leave room for native memory"]

[[entry]]
id = "java-jvm-crash"
patterns = ['A fatal error has been detected by the Java Runtime Environment']
noise = "important"
title = "JVM crashed (fatal error, hs_err_pid file written)"
explanation = "The JVM itself crashed (e.g. SIGSEGV / EXCEPTION_ACCESS_VIOLATION). It writes an hs_err_pid<pid>.log file with the problematic frame, which tells whether native code, a JNI library or the JVM was at fault."
causes = ["Bug in native/JNI library or JDBC/OCI driver", "JVM bug (outdated JDK)", "Hardware/memory problems"]
steps = ["Open hs_err_pid<pid>.log and read 'Problematic frame'", "Update the JDK and native libraries involved"]

[[entry]]
id = "java-stack-overflow"
patterns = ['java\.lang\.StackOverflowError']
noise = "important"
title = "Java StackOverflowError (infinite or very deep recursion)"
explanation = "A thread exhausted its stack, almost always because of unbounded recursion (e.g. two objects calling each other, cyclic toString/equals or JSON serialisation of cyclic graphs)."
causes = ["Recursive call without a proper exit condition", "Cyclic object graph being serialised"]
steps = ["Look for the repeating frames in the stack trace", "Break the cycle; increase -Xss only for legitimately deep recursion"]

[[entry]]
id = "java-class-loading"
patterns = ['\bClassNotFoundException\b', '\bNoClassDefFoundError\b', '\bExceptionInInitializerError\b']
noise = "important"
title = "Java class could not be found or initialised"
explanation = "ClassNotFoundException / NoClassDefFoundError: a class needed at runtime is missing from the classpath. 'NoClassDefFoundError: Could not initialize class X' means X's static initialiser already failed earlier — look for the first ExceptionInInitializerError."
causes = ["Missing or 'provided'-scoped dependency not present at runtime", "Two versions of a library on the classpath, class loader isolation", "Static initialiser failing (configuration, native library)"]
steps = ["Check the deployed jars for the class's library and version", "Search the log for the first ExceptionInInitializerError and its cause", "Use 'mvn dependency:tree' / 'gradle dependencies' to find conflicts"]

[[entry]]
id = "java-linkage-error"
patterns = ['\bNoSuchMethodError\b', '\bNoSuchFieldError\b', '\bAbstractMethodError\b', '\bIncompatibleClassChangeError\b', '\bUnsupportedClassVersionError\b', 'compiled by a more recent version of the Java Runtime']
noise = "important"
title = "Java binary incompatibility (library or Java version mismatch)"
explanation = "Code was compiled against a different version of a library than the one loaded (NoSuchMethodError, NoSuchFieldError, AbstractMethodError, IncompatibleClassChangeError), or against a newer Java version than the runtime (UnsupportedClassVersionError; class file 61 = Java 17, 65 = Java 21)."
causes = ["Dependency version conflict pulled in transitively", "Application built with a newer JDK than the server runs"]
steps = ["Find which jar provides the class at runtime and align versions", "Run on a JRE at least as new as the build target (or lower the compile target)"]

[[entry]]
id = "java-socket-timeout"
patterns = ['\bSocketTimeoutException\b']
noise = "normal"
title = "Java socket timeout (connect or read timed out)"
explanation = "'connect timed out': the TCP connection could not be established in time. 'Read timed out': the connection was open but the server did not send data within the read timeout."
causes = ["Slow or overloaded remote service (read)", "Firewall dropping packets or host unreachable (connect)", "Timeouts configured too low"]
steps = ["Tell connect vs read timeouts apart in the message", "Check the remote service's latency and the network path"]

[[entry]]
id = "java-ssl-handshake"
patterns = ['javax\.net\.ssl\.SSLHandshakeException', 'Received fatal alert: (?:handshake_failure|protocol_version|bad_certificate|certificate_unknown|unknown_ca)', 'No appropriate protocol \(protocol is disabled or cipher suites are inappropriate\)']
noise = "important"
title = "Java TLS handshake failed (SSLHandshakeException)"
explanation = "The TLS handshake failed: no common protocol/cipher (often TLS 1.0/1.1 disabled in java.security), the peer rejected our certificate, or the certificate could not be validated."
causes = ["Protocol or cipher disabled by jdk.tls.disabledAlgorithms on one side", "Server requires a client certificate that is missing or untrusted", "Certificate validation failure (see PKIX)"]
steps = ["Run with -Djavax.net.debug=ssl:handshake to see the negotiation", "Align TLS versions/ciphers on both sides", "Check client-certificate configuration (keystore)"]

[[entry]]
id = "java-pkix"
patterns = ['PKIX path building failed', 'unable to find valid certification path to requested target', 'PKIX path validation failed']
noise = "important"
title = "Java does not trust the server certificate (PKIX path building failed)"
explanation = "The JVM's trust store (cacerts or a custom truststore) contains no CA that issued the server certificate, so the TLS connection is rejected."
causes = ["Internal/corporate CA or TLS-inspecting proxy not in the JVM trust store", "Server not sending its intermediate certificate", "Application using its own truststore file"]
steps = ["Import the issuing CA into the truststore the JVM uses (keytool -importcert)", "Fix the server to send the full chain", "Never disable certificate validation as a fix"]

[[entry]]
id = "java-unknown-host"
patterns = ['java\.net\.UnknownHostException']
noise = "important"
title = "Java could not resolve a host name (UnknownHostException)"
explanation = "DNS lookup for the host failed. Java caches lookups (including failures for a short time), so a brief DNS outage can show up as a burst."
causes = ["Typo or wrong environment in the configured host name", "DNS server or container resolver unreachable", "Name only resolvable inside another network (VPN, cluster DNS)"]
steps = ["Resolve the name from the same host/container (nslookup / getent hosts)", "Check resolver configuration and networkaddress.cache settings"]

[[entry]]
id = "java-npe"
patterns = ['java\.lang\.NullPointerException']
noise = "important"
title = "Java NullPointerException"
explanation = "Code dereferenced a null reference. Recent JVMs print 'helpful' messages naming exactly which variable or call was null."
causes = ["Missing data or configuration not checked for null", "Object used before initialisation"]
steps = ["Read the helpful NPE message and the first stack frame from your code", "Add the missing null handling or fix the data source"]

[[entry]]
id = "java-hikari-pool"
patterns = ['Connection is not available, request timed out after \d+ ?ms']
noise = "important"
title = "JDBC connection pool exhausted (HikariCP)"
explanation = "No database connection became free within connectionTimeout (default 30 s): all pool connections were busy or leaked."
causes = ["Connections not closed (leaks)", "Slow queries or transactions holding connections", "Pool too small for the concurrency"]
steps = ["Enable leakDetectionThreshold to find code that keeps connections", "Check database-side slow queries and locks at that time", "Size the pool deliberately; bigger is not automatically better"]

# ---------------------------------------------------------------- Python
# src: https://docs.python.org/3/library/exceptions.html
# src: https://requests.readthedocs.io/en/latest/user/quickstart/#errors-and-exceptions
# src: https://docs.gunicorn.org/en/stable/settings.html#timeout
[[entry]]
id = "python-traceback"
patterns = ['Traceback \(most recent call last\):']
noise = "normal"
title = "Python exception traceback"
explanation = "Start of a Python traceback. The frames follow (most recent call last) and the final line names the exception type and message — that last line is the one to read first."
causes = ["An exception propagated out of a function and was logged or crashed the program"]
steps = ["Read the last line of the traceback for the exception type", "Then the last frame that belongs to your code"]

[[entry]]
id = "python-memory-error"
patterns = ['\bMemoryError\b']
noise = "important"
title = "Python MemoryError"
explanation = "The interpreter could not allocate memory for an object."
causes = ["Loading a very large file or result set into memory", "Memory leak in a long-running process", "32-bit Python or a container memory limit"]
steps = ["Stream or chunk the data instead of loading it whole", "Profile memory (tracemalloc) for long-running processes"]

[[entry]]
id = "python-recursion"
patterns = ['maximum recursion depth exceeded']
noise = "important"
title = "Python RecursionError (maximum recursion depth exceeded)"
explanation = "Recursion went deeper than sys.getrecursionlimit() (1000 by default) — usually an infinite recursion such as a property or __getattr__ calling itself."
causes = ["Recursive function without a reachable base case", "Property/__getattr__/__repr__ referring to itself"]
steps = ["Look at the repeating frames in the traceback", "Fix the recursion or rewrite it iteratively; raise the limit only for legitimately deep data"]

[[entry]]
id = "python-import-error"
patterns = ['ModuleNotFoundError: No module named', 'ImportError: No module named', 'ImportError: cannot import name']
noise = "important"
title = "Python import failed"
explanation = "'No module named X': the package is not installed in the interpreter/virtual environment that runs the code. 'cannot import name': the module exists but lacks the name — wrong package version or a circular import."
causes = ["Running with a different interpreter / virtual environment than the one packages were installed in", "Missing requirement in deployment", "Package version change or circular import"]
steps = ["Check 'sys.executable' and 'pip list' for the environment that runs the code", "Install the requirement or pin the expected version", "For circular imports move the import inside the function or restructure modules"]

[[entry]]
id = "python-requests-failed"
patterns = ['Max retries exceeded with url', '\bReadTimeoutError\b', '\bConnectTimeoutError\b', 'requests\.exceptions\.(?:ReadTimeout|ConnectTimeout|ConnectionError)\b']
noise = "normal"
title = "Python HTTP request failed (requests / urllib3)"
explanation = "The HTTP call could not complete: connection failed or retries were exhausted ('Max retries exceeded' — the wrapped reason follows, e.g. NameResolutionError, ConnectionRefused, SSLError), or the server did not answer within the timeout."
causes = ["Remote service down, slow or rate-limiting", "DNS, proxy or TLS problems", "Missing or too-short timeout values"]
steps = ["Read the wrapped reason after 'Caused by'", "Test the URL from the same host/container; check proxy environment variables", "Always set explicit timeouts and retry with backoff"]

[[entry]]
id = "python-gunicorn-worker"
patterns = ['\[CRITICAL\] WORKER TIMEOUT \(pid:\d+\)', 'Worker \(pid:\d+\) was sent SIGKILL! Perhaps out of memory\?']
noise = "important"
title = "Gunicorn worker timed out or was killed"
explanation = "A Gunicorn worker did not respond within --timeout (default 30 s) and was killed and restarted, or it was killed by SIGKILL, often by the out-of-memory killer. In-flight requests fail with 502/504 at the proxy."
causes = ["Slow request or blocking call in a sync worker", "Worker memory growth leading to OOM kill", "Timeout lower than legitimate long requests"]
steps = ["Find the slow endpoint (access log durations) and fix or offload it", "Check kernel OOM messages and container memory limits", "Use async workers or raise --timeout only for legitimate long requests"]

# ---------------------------------------------------------------- Node.js
# src: https://nodejs.org/api/errors.html
# src: https://nodejs.org/api/cli.html#--max-old-space-sizesize-in-mib
# src: https://nodejs.org/api/process.html#event-unhandledrejection
[[entry]]
id = "node-heap-oom"
patterns = ['JavaScript heap out of memory', 'Reached heap limit Allocation failed', 'Ineffective mark-compacts near heap limit']
noise = "important"
title = "Node.js ran out of heap memory"
explanation = "V8 hit its heap limit and the process aborted. The default old-space limit depends on the Node version and available memory."
causes = ["Memory leak (global caches, closures, event listeners)", "Processing very large data in memory (big JSON, builds)", "Heap limit lower than the workload needs"]
steps = ["Take heap snapshots (--inspect / --heapsnapshot-near-heap-limit) and compare growth", "Stream large data instead of buffering it", "Raise --max-old-space-size only within the container's memory limit"]

[[entry]]
id = "node-cannot-find-module"
patterns = ['Error: Cannot find module ', '\bMODULE_NOT_FOUND\b', '\bERR_MODULE_NOT_FOUND\b']
noise = "important"
title = "Node.js module not found"
explanation = "require()/import could not resolve a package or file."
causes = ["Dependencies not installed in the deployed environment (missing npm ci)", "Wrong relative path or case-sensitive file name on Linux", "devDependency needed at runtime"]
steps = ["Run 'npm ci' (or the package manager in use) in the deployment", "Check the path and file-name casing", "Move runtime-needed packages from devDependencies to dependencies"]

[[entry]]
id = "node-unhandled-rejection"
patterns = ['UnhandledPromiseRejection', 'Unhandled promise rejection']
noise = "important"
title = "Node.js unhandled promise rejection"
explanation = "A promise was rejected and nothing handled it. Since Node.js 15 this terminates the process by default."
causes = ["Missing await or .catch() on an async call", "Error thrown in an async callback"]
steps = ["Find the rejection reason printed with it and add proper error handling", "Add a process-level 'unhandledRejection' handler that logs before exiting"]

[[entry]]
id = "node-headers-sent"
patterns = ['\bERR_HTTP_HEADERS_SENT\b', 'Cannot set headers after they are sent to the client']
noise = "important"
title = "Node.js response sent twice (ERR_HTTP_HEADERS_SENT)"
explanation = "Code tried to set headers or send a response after the response had already been sent — usually two code paths both responding (missing return after res.send, or both a callback and a promise responding)."
causes = ["Missing 'return' after sending a response", "Error handler responding after the route already did"]
steps = ["Find the route in the stack trace and make sure every branch responds exactly once"]

[[entry]]
id = "node-max-listeners"
patterns = ['MaxListenersExceededWarning', 'Possible EventEmitter memory leak detected']
noise = "normal"
title = "Node.js possible EventEmitter leak"
explanation = "More than the default 10 listeners were added for one event on an emitter, which often means listeners are added repeatedly (per request) and never removed."
causes = ["Adding listeners inside a loop or per request without removing them"]
steps = ["Find where the listener is added (--trace-warnings) and remove it when done, or use once()"]

# ---------------------------------------------------------------- PostgreSQL
# src: https://www.postgresql.org/docs/current/errcodes-appendix.html
# src: https://www.postgresql.org/docs/current/runtime-config-connection.html
# src: https://www.postgresql.org/docs/current/routine-vacuuming.html
# src: https://www.postgresql.org/docs/current/auth-pg-hba-conf.html
[[entry]]
id = "pg-too-many-connections"
patterns = ['sorry, too many clients already', 'remaining connection slots are reserved for']
noise = "important"
title = "PostgreSQL connection limit reached"
explanation = "All max_connections slots (minus those reserved for superusers/replication) are in use, so new connections are refused."
causes = ["Application pools larger than the server allows across all instances", "Connection leaks or idle sessions piling up", "No connection pooler in front of many short-lived clients"]
steps = ["Count connections by application/state in pg_stat_activity", "Reduce pool sizes or add a pooler (e.g. PgBouncer)", "Raise max_connections only with memory headroom"]

[[entry]]
id = "pg-deadlock-serialization"
patterns = ['(?:ERROR|FATAL):\s+deadlock detected', '\bDeadlockDetected\b', 'could not serialize access due to']
noise = "important"
title = "PostgreSQL deadlock or serialization failure (retryable)"
explanation = "Two transactions blocked each other and PostgreSQL aborted one ('deadlock detected', SQLSTATE 40P01), or a REPEATABLE READ / SERIALIZABLE transaction conflicted with a concurrent update (40001). The aborted transaction can be retried."
causes = ["Transactions updating the same rows in different orders", "Long transactions at higher isolation levels"]
steps = ["Retry the transaction on 40P01/40001", "Access rows/tables in a consistent order and keep transactions short", "The DETAIL lines show the processes and queries involved"]

[[entry]]
id = "pg-connect-rejected"
patterns = ['password authentication failed for user', 'no pg_hba\.conf entry for', 'FATAL:\s+(?:database|role) \S+ does not exist']
noise = "important"
title = "PostgreSQL rejected the connection (authentication / pg_hba / unknown database or role)"
explanation = "The server refused the login: wrong password, no pg_hba.conf rule allows this host/user/database/SSL combination, or the requested database or role does not exist."
causes = ["Wrong credentials or rotated secret", "Client IP or SSL mode not covered by pg_hba.conf", "Typo in database/role name or wrong environment"]
steps = ["Compare the host/user/database in the message with pg_hba.conf and reload after changes", "Verify credentials and that the database/role exist"]

[[entry]]
id = "pg-statement-canceled"
patterns = ['canceling statement due to (?:statement timeout|lock timeout|conflict with recovery|user request)', 'terminating connection due to idle-in-transaction timeout']
noise = "normal"
title = "PostgreSQL statement canceled (timeout, recovery conflict or idle transaction)"
explanation = "A query was cancelled because it exceeded statement_timeout or lock_timeout, conflicted with WAL replay on a standby, was cancelled by the client, or a session sat idle inside a transaction too long."
causes = ["Slow query or lock waits", "Long queries on a hot standby while the primary vacuums", "Application forgetting to commit/rollback"]
steps = ["Find the query in the log and check its plan / blocking", "On standbys consider hot_standby_feedback or max_standby_streaming_delay", "Fix code paths that leave transactions open"]

[[entry]]
id = "pg-not-ready"
patterns = ['the database system is (?:starting up|in recovery mode|shutting down|not yet accepting connections)']
noise = "normal"
title = "PostgreSQL not accepting connections yet (starting, recovering or shutting down)"
explanation = "The server is starting up, recovering after a crash, or shutting down; connections are refused until it is ready."
causes = ["Restart or failover in progress", "Crash recovery after a backend was killed"]
steps = ["Check the server log for why it restarted (look for 'terminated by signal')", "Make clients retry with backoff during restarts"]

[[entry]]
id = "pg-out-of-shared-memory"
patterns = ['\bout of shared memory\b']
noise = "important"
title = "PostgreSQL out of shared memory (lock table full)"
explanation = "The shared lock table filled up — usually a transaction touching very many tables/partitions; the HINT suggests raising max_locks_per_transaction."
causes = ["Transactions locking thousands of objects (many partitions, large schema operations)", "max_locks_per_transaction too low"]
steps = ["Reduce objects touched per transaction", "Raise max_locks_per_transaction (needs a restart)"]

[[entry]]
id = "pg-wraparound"
patterns = ['to avoid wraparound data loss', 'must be vacuumed within \d+ transactions']
noise = "important"
title = "PostgreSQL transaction ID wraparound protection"
explanation = "Old transaction IDs were not frozen by VACUUM in time. PostgreSQL first warns, then stops assigning new transaction IDs to prevent data loss, making the database read-only."
causes = ["Autovacuum blocked by long-running transactions or abandoned replication slots / prepared transactions", "Autovacuum disabled or too slow for the write rate"]
steps = ["Find and end long transactions, stale replication slots and prepared transactions", "Run VACUUM (FREEZE) on the oldest tables (age(relfrozenxid))", "Tune autovacuum so it keeps up"]

[[entry]]
id = "pg-backend-crash"
patterns = ['server process \(PID \d+\) was terminated by signal', 'terminating any other active server processes', 'server closed the connection unexpectedly']
noise = "important"
title = "PostgreSQL backend crashed or connection dropped unexpectedly"
explanation = "A server process died (signal 9 is typically the Linux OOM killer, signal 11 a crash), so PostgreSQL restarted all sessions and ran crash recovery. Clients see 'server closed the connection unexpectedly'."
causes = ["Linux OOM killer killing a backend", "Crash in an extension or the server", "Network device dropping the connection (client side)"]
steps = ["Check the kernel log for OOM messages at that time", "Review work_mem / shared_buffers versus RAM", "Look for extensions involved in the crashing query"]

[[entry]]
id = "pg-data-error"
patterns = ['duplicate key value violates unique constraint', 'violates foreign key constraint', 'violates not-null constraint', 'violates check constraint', 'value too long for type character', 'invalid input syntax for (?:type )?\w+', '\b(?:relation|column) \S+ does not exist', 'current transaction is aborted, commands ignored until end of transaction block']
noise = "normal"
title = "PostgreSQL rejected a statement (constraint, type or missing object)"
explanation = "The statement violated a unique/foreign-key/not-null/check constraint, sent a value of the wrong type or length, referenced a table or column that does not exist, or ran inside a transaction that had already failed (every later statement fails until ROLLBACK)."
causes = ["Invalid or duplicate data from the application", "Schema not migrated or code out of sync", "Error handling that continues using a failed transaction"]
steps = ["Read the constraint/column/relation named in the message and the DETAIL line", "For 'current transaction is aborted' find the first error in that transaction", "Run pending migrations if objects are missing"]

[[entry]]
id = "pg-checkpoints-frequent"
patterns = ['checkpoints are occurring too frequently']
noise = "normal"
title = "PostgreSQL checkpoints occurring too frequently"
explanation = "WAL volume forces checkpoints more often than checkpoint_warning allows, which increases I/O and full-page writes."
causes = ["Heavy write bursts (bulk loads)", "max_wal_size too small"]
steps = ["Raise max_wal_size so checkpoints are driven by checkpoint_timeout"]

# ---------------------------------------------------------------- MySQL / MariaDB
# src: https://dev.mysql.com/doc/mysql-errors/8.0/en/server-error-reference.html
# src: https://dev.mysql.com/doc/mysql-errors/8.0/en/client-error-reference.html
# src: https://dev.mysql.com/doc/refman/8.0/en/gone-away.html
# src: https://dev.mysql.com/doc/refman/8.0/en/innodb-deadlocks.html
[[entry]]
id = "mysql-too-many-connections"
patterns = ['\bToo many connections\b']
noise = "important"
title = "MySQL connection limit reached (1040)"
explanation = "All max_connections slots are in use; new clients are refused."
causes = ["Connection pools across all app instances exceed max_connections", "Leaked or sleeping connections", "Slow queries keeping connections busy"]
steps = ["Check 'SHOW PROCESSLIST' for sleeping/long connections by user/host", "Fix leaks and size pools; raise max_connections only with memory headroom"]

[[entry]]
id = "mysql-lock-conflict"
patterns = ['Lock wait timeout exceeded; try restarting transaction', 'Deadlock found when trying to get lock']
noise = "important"
title = "MySQL lock wait timeout (1205) or deadlock (1213)"
explanation = "InnoDB gave up waiting for a row lock after innodb_lock_wait_timeout (1205), or detected a deadlock and rolled back one transaction (1213). Both can be retried."
causes = ["Long transactions holding row locks", "Transactions locking rows in different orders", "Missing indexes causing wide lock ranges"]
steps = ["Retry the transaction", "Check 'SHOW ENGINE INNODB STATUS' (LATEST DETECTED DEADLOCK) for the statements involved", "Keep transactions short and index the WHERE columns"]

[[entry]]
id = "mysql-connection-lost"
patterns = ['MySQL server has gone away', '\bServer has gone away\b', 'Lost connection to (?:MySQL |MariaDB )?server', 'Communications link failure']
noise = "important"
title = "MySQL connection lost (2006 / 2013 / JDBC communications link failure)"
explanation = "The connection to the server broke: the server closed an idle connection (wait_timeout), restarted or crashed, a packet was too large, or the network dropped it."
causes = ["Pooled connection idle longer than wait_timeout or a firewall idle timeout", "Server restart / crash (check the error log)", "Query result or packet larger than max_allowed_packet"]
steps = ["Configure the pool to validate/recycle connections before wait_timeout", "Check the MySQL error log and uptime at that time", "Verify max_allowed_packet for large data"]

[[entry]]
id = "mysql-access-denied"
patterns = ['Access denied for user \S+@', 'Authentication plugin .caching_sha2_password. (?:cannot|could not) be loaded']
noise = "important"
title = "MySQL access denied (1045) or authentication plugin unsupported"
explanation = "The server rejected the user/host/password combination, or the client library does not support the server's authentication plugin (caching_sha2_password is the MySQL 8 default)."
causes = ["Wrong password, or the account exists only for another host ('user'@'host')", "Old client library without caching_sha2_password support"]
steps = ["Check the account with SELECT user, host, plugin FROM mysql.user", "Upgrade the client/connector, or alter the user's authentication plugin deliberately"]

[[entry]]
id = "mysql-cannot-connect"
patterns = ['Can.t connect to (?:local )?(?:MySQL )?server (?:on|through socket)', 'is blocked because of many connection errors']
noise = "important"
title = "Cannot connect to MySQL server (2002 / 2003 / host blocked)"
explanation = "The client could not reach the server over TCP (2003) or the local socket (2002), or the server blocked this host after too many failed connection attempts (1129)."
causes = ["Server not running, wrong host/port/socket path", "Firewall or bind-address restricting connections", "Many aborted connects from one host (e.g. health checks) hitting max_connect_errors"]
steps = ["Check that mysqld is running and listening ('ss -ltnp', bind-address)", "Test from the client host to the port", "For blocked hosts run 'FLUSH HOSTS' and fix the source of failed connects"]

[[entry]]
id = "mysql-packet-too-large"
patterns = ['Got a packet bigger than .max_allowed_packet. bytes']
noise = "important"
title = "MySQL packet larger than max_allowed_packet (1153)"
explanation = "A query or row (large BLOB/TEXT, big multi-row INSERT) exceeded max_allowed_packet; the connection is usually dropped."
causes = ["Large binary/text values or huge batched statements"]
steps = ["Raise max_allowed_packet on server and client consistently", "Split large batches"]

[[entry]]
id = "mysql-missing-object"
patterns = ['Table \x27[^\x27]+\x27 doesn\x27t exist', 'Unknown database \x27[^\x27]+\x27']
noise = "important"
title = "MySQL table or database does not exist (1146 / 1049)"
explanation = "The query referenced a table or database that is not there (or not visible with the current name/case)."
causes = ["Schema not migrated or wrong database selected", "Case sensitivity of table names on Linux (lower_case_table_names)"]
steps = ["Check the connection's database and run pending migrations", "Compare table-name casing with the server's lower_case_table_names setting"]

[[entry]]
id = "mysql-data-error"
patterns = ['Duplicate entry .{1,200} for key', 'Data too long for column', 'Incorrect string value: ', 'a foreign key constraint fails', 'incompatible with sql_mode=only_full_group_by']
noise = "normal"
title = "MySQL rejected data or query (duplicate, too long, charset, foreign key, GROUP BY)"
explanation = "1062 duplicate key; 1406 value longer than the column; 1366 characters the column's charset cannot store (e.g. emoji in utf8/utf8mb3 instead of utf8mb4); 1451/1452 foreign key violation; 1055 non-aggregated column with ONLY_FULL_GROUP_BY."
causes = ["Invalid or duplicate data from the application", "Column charset not utf8mb4", "Queries written for older, laxer SQL modes"]
steps = ["Read the column/key named in the message", "Convert tables/columns to utf8mb4 for full Unicode", "Fix the query or data rather than relaxing sql_mode globally"]

[[entry]]
id = "mysql-read-only"
patterns = ['is running with the --(?:super-)?read-only option']
noise = "important"
title = "MySQL server is read-only (writes rejected)"
explanation = "A write was sent to a server running with read_only/super_read_only — typically a replica, or a former primary after a failover."
causes = ["Application connected to a replica or stale primary endpoint after failover", "Maintenance setting read_only"]
steps = ["Check which server the application's endpoint resolves to", "Point writes to the current primary"]

[[entry]]
id = "mysql-aborted-connection"
patterns = ['Aborted connection \d+ to db']
noise = "normal"
title = "MySQL aborted connection"
explanation = "A client connection ended without being closed properly (client killed, network drop, wait_timeout, packet errors). Occasional entries are normal."
causes = ["Clients exiting without closing connections", "Idle timeouts on server or network devices"]
steps = ["Investigate only if frequent: compare with wait_timeout and the client's pool settings"]

# ---------------------------------------------------------------- nginx
# src: https://nginx.org/en/docs/http/ngx_http_proxy_module.html
# src: https://nginx.org/en/docs/http/ngx_http_upstream_module.html
# src: https://nginx.org/en/docs/ngx_core_module.html#worker_connections
# src: https://nginx.org/en/docs/http/ngx_http_limit_req_module.html
[[entry]]
id = "nginx-upstream-timeout"
patterns = ['upstream timed out \(110: (?:Connection|Operation) timed out\)']
noise = "important"
title = "nginx: upstream timed out (504)"
explanation = "nginx did not get a response (or could not connect) from the back end within proxy_read_timeout / proxy_connect_timeout (60 s by default); the client got 504."
causes = ["Slow back-end request (database, external call)", "Back end overloaded or hung", "Timeout shorter than legitimate long requests"]
steps = ["Find the slow request in the back end's logs", "Fix the slowness first; raise proxy_read_timeout only for known long operations"]

[[entry]]
id = "nginx-upstream-unavailable"
patterns = ['connect\(\) failed \(111: Connection refused\) while connecting to upstream', 'no live upstreams while connecting to upstream', 'connect\(\) to unix:\S+ failed']
noise = "important"
title = "nginx: upstream not reachable (502)"
explanation = "nginx could not connect to the back end: nothing listens on the port or socket (connection refused / socket missing), or every server in the upstream group was marked failed ('no live upstreams'). Clients got 502."
causes = ["Back-end process down, restarting or crashed", "Wrong port/socket path in proxy_pass / fastcgi_pass", "Socket permissions (php-fpm, gunicorn)"]
steps = ["Check that the back end is running and listening where nginx expects", "Look at the back end's logs for crashes at that time"]

[[entry]]
id = "nginx-worker-connections"
patterns = ['worker_connections are not enough']
noise = "important"
title = "nginx ran out of worker connections"
explanation = "All worker_connections slots were in use (each proxied request needs two), so new connections were dropped."
causes = ["Traffic spike or many long-lived connections (keep-alive, websockets)", "Slow upstreams keeping connections open"]
steps = ["Raise worker_connections together with worker_rlimit_nofile / the open-file limit", "Investigate slow upstreams holding connections"]

[[entry]]
id = "nginx-upstream-closed"
patterns = ['upstream prematurely closed connection']
noise = "important"
title = "nginx: upstream closed the connection before responding (502)"
explanation = "The back end closed the connection before sending a complete response — it crashed, was killed, or hit its own timeout."
causes = ["Back-end worker crash or OOM kill", "Back-end request timeout shorter than nginx's", "Keep-alive mismatch between nginx and the back end"]
steps = ["Check the back end's logs for crashes/timeouts at that time", "Align timeouts and keep-alive settings"]

[[entry]]
id = "nginx-body-too-large"
patterns = ['client intended to send too large body']
noise = "normal"
title = "nginx: request body larger than client_max_body_size (413)"
explanation = "A client tried to upload more than client_max_body_size (1 MB by default); nginx answered 413."
causes = ["Legitimate uploads larger than the configured limit"]
steps = ["Raise client_max_body_size for the location that receives uploads (and the back end's own limit)"]

[[entry]]
id = "nginx-upstream-big-header"
patterns = ['upstream sent too big header while reading response header']
noise = "important"
title = "nginx: upstream response header too big (502)"
explanation = "The back end's response headers (often large cookies or auth headers) did not fit into proxy_buffer_size / fastcgi_buffer_size."
causes = ["Large Set-Cookie / authentication headers", "Buffer sizes left at defaults"]
steps = ["Increase proxy_buffer_size and proxy_buffers (or fastcgi_buffer_size)", "Reduce header size in the application if possible"]

[[entry]]
id = "nginx-limit-req"
patterns = ['limiting requests, excess:', 'limiting connections by zone']
noise = "normal"
title = "nginx rate limiting rejected or delayed requests"
explanation = "A limit_req / limit_conn rule triggered for a client; excess requests were delayed or rejected (503 or the configured status)."
causes = ["Client exceeding the configured rate (bots, retries, a busy NAT address)", "Limits set too tight"]
steps = ["Identify the client and zone in the message", "Tune the rate/burst or exempt trusted sources"]

[[entry]]
id = "nginx-redirect-cycle"
patterns = ['rewrite or internal redirection cycle', '\bAH00124\b', 'Request exceeded the limit of \d+ internal redirects']
noise = "important"
title = "Web server internal redirect loop (nginx / Apache)"
explanation = "Rewrite or try_files rules keep redirecting the request internally until the server gives up and returns 500."
causes = ["try_files / RewriteRule pointing to a location that rewrites again", "Fallback file (e.g. index.php or index.html) missing"]
steps = ["Trace the rewrite rules for the URL in the message", "Make sure the fallback target exists and is excluded from the rewrite"]

[[entry]]
id = "nginx-fastcgi-script-unknown"
patterns = ['Primary script unknown']
noise = "normal"
title = "PHP-FPM: primary script unknown"
explanation = "PHP-FPM could not find the script nginx/Apache asked it to run — usually a wrong SCRIPT_FILENAME/document root, or the file is not readable by the FPM user."
causes = ["SCRIPT_FILENAME built from the wrong root", "Request for a non-existent .php file (scanners)", "Permissions for the PHP-FPM user"]
steps = ["Compare the document root in the web server and FPM pool configuration", "Ignore isolated hits from scanners requesting random .php files"]

[[entry]]
id = "nginx-file-not-found"
patterns = ['open\(\) .{1,300} failed \(2: No such file or directory\)', 'directory index of .{1,300} is forbidden']
noise = "normal"
title = "nginx: file not found or directory listing forbidden"
explanation = "A request mapped to a file that does not exist (404) or to a directory without an index file and autoindex off (403)."
causes = ["Missing static files (favicon.ico, robots.txt), broken links, scanners", "Wrong root/alias or deployment missing files"]
steps = ["Ignore common scanner/favicon noise", "If real pages fail, check root/alias and the deployed files"]

# ---------------------------------------------------------------- Apache httpd
# src: https://httpd.apache.org/docs/2.4/mod/mpm_common.html#maxrequestworkers
# src: https://httpd.apache.org/docs/2.4/mod/mod_authz_core.html
# src: https://httpd.apache.org/docs/2.4/mod/mod_proxy.html
# src: https://httpd.apache.org/docs/2.4/mod/core.html#servername
[[entry]]
id = "apache-max-request-workers"
patterns = ['\bAH00161\b', '\bAH00484\b', 'server reached MaxRequestWorkers setting', 'server reached MaxClients setting', '\bAH03490\b', 'scoreboard is full, not at MaxRequestWorkers']
noise = "important"
title = "Apache reached MaxRequestWorkers (all workers busy)"
explanation = "Every Apache worker was busy, so new connections waited in the listen queue — users see slowness or timeouts. 'Scoreboard is full' (event MPM) means old processes still finishing connections occupy the slots."
causes = ["Slow back ends (PHP, proxied apps) keeping workers busy", "Traffic spike or slow clients/keep-alive", "MaxRequestWorkers / ServerLimit too low for the memory available"]
steps = ["Check mod_status for what workers are doing", "Fix slow requests first; then size MaxRequestWorkers/ServerLimit to available RAM"]

[[entry]]
id = "apache-client-denied"
patterns = ['\bAH01630\b', '\bAH01797\b', 'client denied by server configuration']
noise = "normal"
title = "Apache: client denied by server configuration (403)"
explanation = "An authorisation rule (Require / Order-Allow-Deny) refused the request for that path."
causes = ["Missing 'Require all granted' for a new directory/alias", "Intended blocking of sensitive paths or scanners"]
steps = ["Check the <Directory>/<Location> rules that apply to the path in the message", "With Apache 2.4 replace old Order/Allow syntax with Require"]

[[entry]]
id = "apache-servername"
patterns = ['\bAH00558\b', 'Could not reliably determine the server.s fully qualified domain name']
noise = "benign"
title = "Apache ServerName not set (harmless startup warning)"
explanation = "Apache could not work out its own fully qualified name and used an address instead."
causes = ["No global ServerName directive"]
steps = ["Add 'ServerName <host name>' to the main configuration to silence it"]

[[entry]]
id = "apache-proxy-backend"
patterns = ['\bAH01102\b', '\bAH00898\b', '\bAH01114\b', '\bAH00957\b', 'error reading status line from remote server', 'failed to make connection to backend']
noise = "important"
title = "Apache proxy could not reach or read from the back end (502/503)"
explanation = "mod_proxy failed to connect to the back end (AH00957/AH01114) or the back end closed/timed out before sending a valid response (AH01102/AH00898)."
causes = ["Back end down, restarting or listening elsewhere", "Back-end timeout or crash mid-request", "Keep-alive connection closed by the back end while Apache reused it"]
steps = ["Check the back end's health and logs at that time", "Tune ProxyTimeout and consider disablereuse/keepalive settings for the worker"]

[[entry]]
id = "apache-child-crash"
patterns = ['\bAH00052\b', 'exit signal Segmentation fault']
noise = "important"
title = "Apache child process crashed (segmentation fault)"
explanation = "An httpd child process crashed, dropping the requests it was serving — usually a bug in a loaded module (PHP extension, third-party module)."
causes = ["Faulty or incompatible module / PHP extension", "Memory corruption or exhausted resources"]
steps = ["Enable core dumps (CoreDumpDirectory) and inspect with gdb", "Disable recently added modules/extensions to isolate the culprit"]

# ---------------------------------------------------------------- Linux kernel and system services
# src: https://www.kernel.org/doc/html/latest/admin-guide/mm/concepts.html
# src: https://www.kernel.org/doc/html/latest/admin-guide/lockup-watchdogs.html
# src: https://man7.org/linux/man-pages/man3/errno.3.html
# src: https://www.freedesktop.org/software/systemd/man/latest/systemd.unit.html
[[entry]]
id = "linux-oom-killer"
patterns = ['Out of memory: Kill(?:ed)? process', 'invoked oom-killer', '\boom-kill:', 'Memory cgroup out of memory']
noise = "important"
title = "Linux OOM killer terminated a process"
explanation = "The kernel (or a cgroup/container memory limit) ran out of memory and killed the process with the highest OOM score; the message names it and its memory usage."
causes = ["Process memory growth (leak) or a workload larger than RAM / the container limit", "No or too little swap; overcommitted host"]
steps = ["Identify the killed process and its RSS in the message", "Check whether it was a cgroup (container) limit or system-wide", "Fix the leak or raise the limit; tune the application's own memory settings (heap sizes)"]

[[entry]]
id = "linux-segfault"
patterns = ['\bsegfault at [0-9a-f]+ ip\b', '\btraps: .{1,100} general protection']
noise = "important"
title = "Linux process crashed (segfault / general protection fault)"
explanation = "A user-space process accessed invalid memory and was killed by the kernel; the message names the program and the library it crashed in."
causes = ["Bug in the program or a native library", "Incompatible library versions", "Faulty memory (if many unrelated programs crash)"]
steps = ["Note the program and library in the message; enable core dumps (coredumpctl) to analyse", "Update the program/library; test RAM if crashes are random"]

[[entry]]
id = "linux-too-many-open-files"
patterns = ['Too many open files', '\bEMFILE\b', '\bENFILE\b']
noise = "important"
title = "Too many open files (file-descriptor limit reached)"
explanation = "The process hit its open-file limit (EMFILE, 'ulimit -n' / LimitNOFILE) or the system-wide limit (ENFILE). Sockets count as files, so busy servers hit it first."
causes = ["File/socket descriptor leak", "Default soft limit (often 1024) too low for a server", "Very many concurrent connections"]
steps = ["Count descriptors: 'ls /proc/<pid>/fd | wc -l' or lsof -p <pid>", "Fix leaks; raise LimitNOFILE in the service unit / container settings"]

[[entry]]
id = "linux-kernel-stall"
patterns = ['blocked for more than \d+ seconds', 'soft lockup - CPU#\d+ stuck for', 'hard LOCKUP', 'rcu_\w+ (?:self-)?detected stalls?']
noise = "important"
title = "Linux kernel stall (hung task, soft/hard lockup, RCU stall)"
explanation = "A task was stuck in uninterruptible sleep for more than 120 s (usually waiting for I/O), or a CPU did not schedule normally for many seconds (lockup / RCU stall). Often a symptom of storage or hypervisor problems."
causes = ["Storage or NFS not responding (hung tasks in D state)", "Overcommitted VM host stealing CPU", "Kernel/driver bugs"]
steps = ["Look at the stack trace that follows to see what it waited on (I/O, NFS, filesystem)", "Check storage latency and hypervisor CPU steal at that time", "Update kernel and drivers if no external cause is found"]

[[entry]]
id = "linux-fs-error"
patterns = ['EXT4-fs error', 'XFS \(\S+\): (?:Metadata )?corruption detected', 'BTRFS error', 'Remounting filesystem read-only', 'Read-only file system', '\bEROFS\b']
noise = "important"
title = "Linux file system error or volume remounted read-only"
explanation = "The file system detected corruption or an I/O failure; ext4 typically remounts the volume read-only to protect data, after which writes fail with 'Read-only file system'."
causes = ["Underlying disk or storage errors", "Unclean shutdown or VM storage problems", "File system bug (rare)"]
steps = ["Check dmesg for the disk errors that preceded it", "Schedule fsck / xfs_repair from maintenance mode", "Verify backups before repairing"]

[[entry]]
id = "linux-disk-io-error"
patterns = ['I/O error, dev \w+, sector', 'Buffer I/O error on dev', 'critical (?:medium|target) error, dev', 'failed command: (?:READ|WRITE) FPDMA QUEUED']
noise = "important"
title = "Linux disk I/O error"
explanation = "The block layer reported failed reads/writes for a disk sector, or the SATA link reported failed commands. Data on the device is at risk."
causes = ["Failing disk or SSD (bad sectors)", "Cable, controller or SAN path problems", "VM storage backend issues"]
steps = ["Check SMART data (smartctl -a /dev/<dev>) and the controller/SAN", "Back up data and replace the device if errors repeat"]

[[entry]]
id = "linux-conntrack-full"
patterns = ['nf_conntrack: table full, dropping packet']
noise = "important"
title = "Linux connection-tracking table full (packets dropped)"
explanation = "The netfilter conntrack table reached nf_conntrack_max, so new connections are dropped — visible as random timeouts on busy hosts, NAT gateways and Kubernetes nodes."
causes = ["Very many short-lived connections or a traffic flood", "nf_conntrack_max too low for the host"]
steps = ["Compare 'conntrack -C' with nf_conntrack_max", "Raise nf_conntrack_max (and hash size) or reduce connection churn"]

[[entry]]
id = "linux-kernel-panic"
patterns = ['Kernel panic - not syncing']
noise = "important"
title = "Linux kernel panic"
explanation = "The kernel hit an unrecoverable error and stopped; the text after 'not syncing' gives the reason (e.g. VFS unable to mount root, fatal exception, out of memory)."
causes = ["Hardware failure or bad memory", "Kernel/driver bug", "Missing root file system or initramfs problems at boot"]
steps = ["Capture the full panic message (serial console / kdump)", "Check hardware and recent kernel or driver updates"]

[[entry]]
id = "linux-hardware-error"
patterns = ['Machine check events logged', '\[Hardware Error\]']
noise = "important"
title = "Linux machine check / hardware error"
explanation = "The CPU or memory controller reported a hardware error (corrected or uncorrected) through the machine check architecture."
causes = ["Failing memory DIMM or CPU", "Overheating or power problems"]
steps = ["Decode details with rasdaemon / mcelog and the server's hardware event log", "Replace components that keep reporting errors"]

[[entry]]
id = "linux-systemd-failed"
patterns = ['Main process exited, code=(?:killed|dumped|exited, status=[1-9])', 'Failed with result .(?:exit-code|signal|core-dump|timeout|oom-kill|watchdog|resources).', 'systemd\[1\]: Failed to start ', 'Start request repeated too quickly', '\bstart-limit-hit\b']
noise = "important"
title = "systemd service failed"
explanation = "A systemd unit's main process exited with an error, was killed, or failed to start; 'Start request repeated too quickly' / start-limit-hit means systemd stopped restarting it after too many failures."
causes = ["Application error at startup (configuration, permissions, port in use)", "Process killed by a signal or the OOM killer", "Crash loop hitting StartLimitBurst"]
steps = ["Run 'journalctl -u <unit> -b' to read the service's own output before the failure", "Fix the cause, then 'systemctl reset-failed <unit>' and start it again"]

[[entry]]
id = "linux-ssh-failed-password"
patterns = ['Failed password for (?:invalid user )?\S+ from [0-9a-f.:]+ port \d+', 'Invalid user \S+ from [0-9a-f.:]+ port \d+']
noise = "normal"
title = "SSH login failure"
explanation = "An SSH password login failed or used a non-existent user. Bursts from many addresses are internet password-guessing."
causes = ["Mistyped password", "Automated brute-force scanning of an exposed SSH port"]
steps = ["Group by source address; use key-based auth and disable password login", "Rate-limit or block offenders (fail2ban, firewall)"]

[[entry]]
id = "linux-cannot-allocate"
patterns = ['fork: (?:retry: )?Resource temporarily unavailable', 'Cannot allocate memory', '\bENOMEM\b']
noise = "important"
title = "Linux could not allocate memory or create a process"
explanation = "A memory allocation failed (ENOMEM 'Cannot allocate memory') or a new process/thread could not be created ('fork: Resource temporarily unavailable' — process/thread limits or memory)."
causes = ["System or cgroup memory exhausted, strict overcommit settings", "Per-user process limit (ulimit -u) or pids cgroup limit reached", "Thread or process leak"]
steps = ["Check free memory, overcommit settings and cgroup limits", "Count processes/threads for the user or container", "Fix the leak or raise the limit deliberately"]

[[entry]]
id = "linux-nfs-not-responding"
patterns = ['nfs: server \S+ not responding']
noise = "important"
title = "NFS server not responding"
explanation = "The NFS client lost contact with the server; processes accessing the mount hang until it comes back ('OK' message follows when it recovers)."
causes = ["NFS server down or overloaded", "Network problems between client and server"]
steps = ["Check the NFS server and the network path", "Look for hung tasks on the client while it lasts"]

[[entry]]
id = "linux-syn-flood"
patterns = ['Possible SYN flooding on port']
noise = "normal"
title = "Possible SYN flood (listen queue overflowing)"
explanation = "The listen backlog of a port overflowed, so the kernel started using SYN cookies. Either an attack, or the application accepts connections too slowly for the load."
causes = ["Traffic burst or SYN flood", "Application slow to accept(), backlog too small"]
steps = ["Check whether traffic is legitimate", "Raise the application's listen backlog and net.core.somaxconn if needed"]

# ---------------------------------------------------------------- Containers: Kubernetes and Docker
# src: https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/
# src: https://kubernetes.io/docs/concepts/scheduling-eviction/node-pressure-eviction/
# src: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
# src: https://kubernetes.io/docs/concepts/containers/images/
# src: https://docs.docker.com/engine/daemon/troubleshoot/
[[entry]]
id = "k8s-oomkilled"
patterns = ['\bOOMKilled\b', '\bexit(?:ed)?(?: with)? code[: ]+137\b']
noise = "important"
title = "Container killed for exceeding its memory limit (OOMKilled / exit 137)"
explanation = "The container used more memory than its limit and the kernel killed it (exit code 137 = SIGKILL). Kubernetes then restarts it."
causes = ["Memory limit too low for the workload", "Memory leak in the application", "Runtime heap settings not aware of the container limit"]
steps = ["Compare actual usage (kubectl top / metrics) with the limit", "Set runtime heap limits relative to the container limit (e.g. MaxRAMPercentage, --max-old-space-size)", "Fix leaks before raising the limit"]

[[entry]]
id = "k8s-crashloop"
patterns = ['\bCrashLoopBackOff\b', 'Back-off restarting failed container']
noise = "important"
title = "Kubernetes container keeps crashing (CrashLoopBackOff)"
explanation = "The container exits repeatedly and Kubernetes waits longer and longer between restarts. The reason is in the previous container's logs and exit code."
causes = ["Application error at startup (configuration, missing secret, dependency down)", "Failing liveness probe or OOM kill", "Wrong command/entrypoint"]
steps = ["Run 'kubectl logs <pod> --previous' and 'kubectl describe pod <pod>' (Last State, exit code)", "Fix the startup error or probe configuration"]

[[entry]]
id = "k8s-image-pull"
patterns = ['\bImagePullBackOff\b', '\bErrImagePull\b', 'Failed to pull image', 'pull access denied', 'manifest unknown', 'toomanyrequests: You have reached your pull rate limit']
noise = "important"
title = "Container image could not be pulled"
explanation = "The node could not download the image: wrong name/tag (manifest unknown), missing registry credentials (pull access denied), registry rate limit, or network/DNS problems to the registry."
causes = ["Typo in image name or tag that does not exist", "Missing or wrong imagePullSecrets", "Registry rate limits or unreachable registry"]
steps = ["Check the exact image reference in the pod spec and the Events of 'kubectl describe pod'", "Verify pull secrets and try 'docker/crictl pull' from the node", "Use a registry mirror or authenticated pulls to avoid rate limits"]

[[entry]]
id = "k8s-failed-scheduling"
patterns = ['\bFailedScheduling\b', '\d+/\d+ nodes are available']
noise = "important"
title = "Kubernetes could not schedule the pod"
explanation = "No node satisfied the pod's requirements: insufficient CPU/memory for its requests, taints without tolerations, node selectors/affinity, or volume/zone constraints. The message lists how many nodes failed for which reason."
causes = ["Resource requests larger than free capacity", "Taints, node selectors or affinity rules excluding all nodes", "Persistent volume bound to another zone"]
steps = ["Read the reasons per node count in the event", "Lower requests, add capacity, or fix selectors/tolerations"]

[[entry]]
id = "k8s-probe-failed"
patterns = ['(?:Liveness|Readiness|Startup) probe failed']
noise = "normal"
title = "Kubernetes probe failed"
explanation = "A health probe failed. Readiness failures remove the pod from service endpoints; liveness (and exhausted startup) failures make the kubelet restart the container."
causes = ["Application slow or not ready (startup, dependency down)", "Probe timeout/threshold too strict or wrong path/port"]
steps = ["Check what the probe calls and how long it takes", "Use a startup probe for slow starts; avoid liveness probes that depend on external services"]

[[entry]]
id = "k8s-evicted"
patterns = ['The node was low on resource', 'The node had condition: \[(?:Memory|Disk|PID)Pressure\]']
noise = "important"
title = "Pod evicted because the node ran low on resources"
explanation = "The kubelet evicted the pod to reclaim memory, disk (ephemeral storage) or process IDs on the node."
causes = ["Pods without proper requests/limits using more than expected", "Node disk filled by logs, images or emptyDir volumes"]
steps = ["Check node conditions and usage ('kubectl describe node')", "Set requests/limits (including ephemeral-storage) and clean up disk usage"]

[[entry]]
id = "k8s-mount-failed"
patterns = ['\bFailedMount\b', 'MountVolume\.\w+ failed', 'Unable to attach or mount volumes']
noise = "important"
title = "Kubernetes volume could not be mounted"
explanation = "The kubelet could not attach or mount a volume for the pod (missing secret/configmap, storage driver errors, volume still attached elsewhere)."
causes = ["Referenced Secret/ConfigMap/PVC does not exist", "CSI driver or storage backend errors", "ReadWriteOnce volume still attached to another node"]
steps = ["Read the event message for the volume and error", "Check the referenced object and the CSI driver pods' logs"]

[[entry]]
id = "k8s-config-error"
patterns = ['\bCreateContainerConfigError\b', 'couldn.t find key \S+ in (?:ConfigMap|Secret)', '\b(?:secret|configmap)s? "[^"]+" not found']
noise = "important"
title = "Kubernetes container config error (missing Secret/ConfigMap or key)"
explanation = "The container could not be created because a referenced Secret or ConfigMap (or one of its keys) does not exist in the namespace."
causes = ["Secret/ConfigMap not created or created in another namespace", "Key name typo in env/valueFrom"]
steps = ["Compare the names in the pod spec with 'kubectl get secret,configmap -n <ns>'", "Create the missing object or fix the reference"]

[[entry]]
id = "k8s-exec-format"
patterns = ['exec format error']
noise = "important"
title = "exec format error (wrong CPU architecture or bad entrypoint)"
explanation = "The kernel could not execute the container's entrypoint: the image was built for another CPU architecture (e.g. arm64 vs amd64), or a script lacks a valid shebang line."
causes = ["Single-architecture image built on a different platform", "Entrypoint script without '#!' or with Windows line endings"]
steps = ["Check the image platform ('docker image inspect' / manifest) against the node architecture", "Build multi-arch images or fix the script header/line endings"]

[[entry]]
id = "k8s-node-not-ready"
patterns = ['\bNodeNotReady\b']
noise = "important"
title = "Kubernetes node not ready"
explanation = "The control plane stopped receiving healthy status from the node's kubelet; pods on it will be evicted after a grace period."
causes = ["Kubelet or container runtime stopped/crashed", "Node out of resources or network partition", "Node shut down"]
steps = ["Run 'kubectl describe node' for conditions", "Check kubelet and container runtime logs on the node"]

[[entry]]
id = "docker-daemon-unreachable"
patterns = ['Cannot connect to the Docker daemon']
noise = "important"
title = "Docker daemon not reachable"
explanation = "The Docker CLI or a tool could not reach the daemon socket — the daemon is not running or the user lacks permission on the socket."
causes = ["Docker service stopped or failed to start", "User not in the docker group / wrong DOCKER_HOST"]
steps = ["Check 'systemctl status docker' (or Docker Desktop) and its logs", "Verify DOCKER_HOST and socket permissions"]
