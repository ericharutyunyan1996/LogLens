# src: https://learn.microsoft.com/en-us/troubleshoot/windows-server/user-profiles-and-logon/troubleshoot-user-profiles-events
# src: event message templates of the 'Microsoft-Windows-User Profiles Service' publisher (wevtutil gp)
[[entry]]
id = "event-user-profile-failed"
providers = ["Microsoft-Windows-User Profiles Service"]
event_ids = [1500, 1508, 1511, 1515]
noise = "important"
title = "User profile could not be loaded (temporary or backup profile)"
explanation = "Windows could not load the user's profile: logon refused (1500), the registry hive could not be loaded (1508), a temporary profile was used (1511), or the profile was backed up and the backup will be tried next time (1515). Changes made in a temporary profile are lost at logoff."
causes = ["Corrupted NTUSER.DAT or profile registry entry (.bak key)", "Antivirus or another process locking the profile", "Disk full or permission problems on the profile folder"]
steps = ["Check HKLM\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\ProfileList for duplicate/.bak SIDs", "Check free disk space and profile folder permissions", "Back up the user's data before rebuilding the profile"]

[[entry]]
id = "event-user-profile-1530"
providers = ["Microsoft-Windows-User Profiles Service"]
event_ids = [1530]
noise = "benign"
title = "Registry file still in use at logoff (usually harmless)"
explanation = "At logoff some process still had the user's registry hive open; Windows released it forcibly. Very common and normally harmless."
causes = ["Services or agents keeping handles to the user hive"]
steps = ["Ignore unless profiles get corrupted; then identify the process named in the details"]

# src: https://learn.microsoft.com/en-us/troubleshoot/windows-client/setup-upgrade-and-drivers/event-10-is-logged-in-application-log
[[entry]]
id = "event-wmi-10"
